      {id:'register', label:`Read the key register`, clue:'keyreg', text:`Scrupulous for the servants and silent for the family, which is how such books have always been kept and why they are usually useless. This one is useless in a way that narrows the field to three people.`}

  suspects:[
    {id:'devyani', name:`Rani Sahiba Devyani`, role:`Widow of the late Maharaja`,
     brief:`Mother of Kunwar Arjun, twelve, who stands second to the gaddi.`,
     long:`Forty-four, entirely composed, and answering your questions in English she learned in Lausanne, from behind no screen at all, which is itself a decision she has made about you.`,
     deflect:[`That is a matter for the household, and the household is mine.`,`She looks at it without touching it. It means nothing to me.`,`You must ask the hotel people. Half of this building is a hotel now and I am told it is very well spoken of.`],
     topics:[
      {id:'night', label:`Where were you at midnight?`, text:`In this wing. My women were with me until eleven and after that I was alone, which is what I prefer and what I shall go on saying.`},
      {id:'bhairav', label:`How did you stand with the Rajkumar?`, text:`Bhairav was fond of my son and correct with me for eighteen years. He turned his brother's house into a hotel and I said nothing about it, and he thought that made us friends.`},
      {id:'son', label:`Tell me about Kunwar Arjun`, text:`He is twelve. He is second to the gaddi after his uncle's line and he has been second since the day he was born, and there is nobody in this State who has ever said otherwise out loud.`}
     ],
     confront:{
      statement:{text:`Then take the bearer, since the State police have taken him. That is what such witnesses are for, Inspector, and you and I both know it.`},
      green:{text:`Ninety people. And four of them are mine, and their green is the same green, and I imagine you knew that before you came up here.`},
      attar:{text:`Something in her stillness changes quality without moving at all. It is made in this wing. It is not sold. You will have to decide what you think that is worth.`},
      keyreg:{text:`There has been a key in this wing since the old Maharaja's time and no woman of this house has ever been asked to sign for it. I could not tell you where it hangs. That is true, and it is also not much of an answer.`},
      register:{clue:'devyani', text:`She reads the four sheets slowly and puts them down flat and square on the table before she speaks, and when she does her voice has not altered at all. In 1919 a clerk at Nathdwara was paid a hundred rupees not to write two lines. I was seventeen. I did not know it for twenty years and I have known it for six. My husband is dead, the clerk is dead, and every man who arranged it is dead, and the only thing left living is a boy of twelve who would have woken up on Tuesday morning the son of nobody. Bhairav found it in January. He did not threaten me — you should understand that he was not that kind of man. He told me he was sorry and that he would place it before the Resident because it was true. He was quite right that it was true.`}
     }},
    {id:'crake', name:`Mr Aloysius Crake`, role:`Manager of the Ranipur Palace Hotel`,
     brief:`Brought out from a Calcutta hotel in 1935. Has the run of the public wing.`,
     long:`Loud, affable, perspiring, and telling you at length about the difficulty of running a first-class house in a native State, which he appears to think is what you have come about.`,
     deflect:[`Palace side, old man. Nothing to do with me. I run a hotel.`,`He barely glances at it. Haven't the foggiest.`,`You want the State police for that. I only worry about the linen.`],
     topics:[
      {id:'night', label:`Where were you at midnight?`, text:`In the office with the durbar bar receipts. Miss Hazra was at the other desk until half past eleven and after that I was on my own, and I make no bones about it.`},
      {id:'rajkumar', label:`How did he treat the hotel?`, text:`Like a business, which is unusual in a prince and was very much to my advantage. He knew the price of everything in this building including me.`},
      {id:'durbar', label:`Who was in the palace that night?`, text:`Ninety of the household, forty guests, thirty musicians and the entire population of the bazaar outside the gate. If you are looking for someone who could not have been in that hall, I should start with the guests, because they were all extremely drunk on the terrace.`}
     ],
     confront:{
      accounts:{text:`The affability comes off in one piece. Eleven hundred a month on the kitchen account, yes, and Miss Hazra has queried it nineteen times in her own hand, which I imagine is how you have it. He found it in November. He took it off my salary at a hundred and fifty a month for the next six years and told me that if I left the State he would have me before a magistrate in Bombay. I have been the cheapest hotel manager in India since November and I had every possible reason to want that man alive.`},
      bond:{text:`Girdhar Singh's paper? That was in my guest file because the Rajkumar put it there himself in February and told me to leave it exactly where nobody would look for it. He had a sense of humour, in his way.`},
      green:{text:`Every bearer in this hotel. I have signed for two hundred yards of that cloth in two years.`}
     }},
    {id:'sarojini', name:`Miss Sarojini Hazra`, role:`Bookkeeper to the hotel`,
     brief:`Keeps the accounts, and has queried the same entry nineteen times.`,
     long:`Twenty-nine, from Calcutta, precise, and visibly the person who actually runs this building.`,
     deflect:[`I keep books, Inspector. I don't keep opinions in them.`,`I have not seen that and it has not been through this office.`,`You would have to ask the palace side. They tell us nothing and we tell them less.`],
     topics:[
      {id:'query', label:`Tell me about your marginal queries`, text:`Nineteen times in two years I have written please confirm against the same entry, and nineteen times Mr Crake has initialled it and given it back. In November the Rajkumar read the ledger himself for the first time and asked me one question, and I answered it, and I have been waiting since November for something to happen.`},
      {id:'night', label:`Where were you at midnight?`, text:`At my desk until half past eleven, then across the guard court to my quarters. I passed the durbar hall and it was full of noise and I did not look in.`},
      {id:'household', label:`How does the palace side regard the hotel?`, text:`With extremely good manners. The Rajkumar was building something and the rest of that family were waiting, very politely, for him to stop.`}
     ],
     confront:{
      accounts:{text:`Nineteen queries in my hand and nineteen initials in his. I should like that noted, because when a hotel of this kind is found to be short it is not usually the manager who is asked to explain it.`},
      iris:{text:`Mrs Boyce-Lynn sits on that terrace every night of the year and misses nothing. If she says two people crossed that court, then two people crossed it.`}
     }},
    {id:'girdhar', name:`Thakur Girdhar Singh`, role:`Jagirdar of Bhilwas; the Rajkumar's creditor`,
     brief:`Four lakhs out on a bond that dies with the borrower.`,
     long:`Sixty, courteous, immovable, and entirely willing to discuss money with a policeman, which tells you he has already thought about how it looks.`,
     deflect:[`This is a matter of the State and not of the hotel.`,`He turns it in his fingers and returns it. I do not know it.`,`I have told the State police everything and they were satisfied. You are welcome to be less so.`],
     topics:[
      {id:'bond', label:`Tell me about the loan`, text:`Four lakhs, at my own rate, against the revenue of six villages. He came to me for it because no bank in Bombay would lend against a palace, and I took it because he was a serious man and I do not lend to unserious ones.`},
      {id:'death', label:`What does his death do to your money?`, text:`It kills it. Read the clause. The bond falls in on his death and does not touch his estate, and I have spent two years wanting that man to live to be ninety. You are looking at the one person in Ranipur who is four lakhs poorer this morning.`},
      {id:'night', label:`Where were you at midnight?`, text:`In the durbar hall with the Political Agent's assistant and thirty other people, being extremely bored. There are forty witnesses and I am sorry to make it so easy for you.`}
     ],
     confront:{
      bond:{text:`Yes. And the clause is in my hand and it was my own foolishness, and now you know why I have been sitting in this hotel for three days looking like a man at a funeral, which I am.`},
      register:{text:`He reads it and does not react for a long moment. Then he sets it down very gently. This should have gone into a fire in 1919. Whoever kept it did that boy no kindness.`}
     }},
    {id:'boycelynn', name:`Mrs Iris Boyce-Lynn`, role:`A guest of two years' standing`,
     brief:`Sits on the east terrace every night, facing the Sheesh Mahal.`,
     long:`Sixty-eight, widowed, permanent, and in possession of more accurate information about this palace than anybody employed by it.`,
     deflect:[`I couldn't say, and I don't invent. Ask me what I saw.`,`Not my business, dear, and I have quite enough of my own.`,`Do ask Miss Hazra. She is the only person in this hotel who knows anything and the only one nobody asks.`],
     topics:[
      {id:'terrace', label:`What did you see from the terrace?`, clue:'iris', text:`I sat out from eleven, as I do. The court is lit and I have nothing else to look at. Two people crossed it in that hour: Bhairav Singh going in at about a quarter past, and one other going in after him, from the zenana side, some little while before the noise. I could not tell you a face. I could tell you that it was not a bearer's walk.`},
      {id:'household', label:`What do you make of the family?`, text:`Perfectly charming and perfectly ruthless, like every family with a throne in it, and I include my own. There has not been a comfortable moment in this palace since the old man died in 1931.`},
      {id:'bearer', label:`What of the man they have arrested?`, text:`Ghansham has brought me tea at seven in the morning for two years and he is frightened of the lift. They will hang him for the convenience of it and everybody in this hotel knows it, and you are the first person who has come to ask me anything.`}

     confront:{
      statement:{text:`Nathu Lal is the most truthful man in Rajputana and he cannot see the floor of that hall from where he sits. I have said so to three officers and they have written it down and gone away.`},

    `On the night of the durbar she came the seventy yards of screened corridor from the zenana to the east arch, with a key that no woman of that house has ever been asked to sign for, and a katar out of a case she opened without breaking anything, and the smell of an attar that is made in eleven bottles a year in one wing of one palace.`,

function sceneBg(kind, P, W, H, base){
  const L = P.brass, V = P.verd;
  let g = `<rect width="${W}" height="${H}" fill="url(#sg)"/>`;
  if(kind === 'interior'){
    g += `<rect y="${base}" width="${W}" height="${H-base}" fill="${P.deep}" fill-opacity=".55"/>`;
    g += `<path d="M0 ${base} H${W}" stroke="${L}" stroke-opacity=".45"/>`;
    g += `<rect x="${W*0.62}" y="34" width="${W*0.26}" height="${base-110}" fill="${P.deep}" stroke="${L}" stroke-opacity=".35"/>`;
    g += `<path d="M${W*0.75} 34 V${base-76} M${W*0.62} ${(34+base-76)/2} H${W*0.88}" stroke="${L}" stroke-opacity=".28"/>`;
    g += `<path d="M${W*0.08} ${base} V46 h${W*0.12}" stroke="${L}" stroke-opacity=".18"/>`;
  } else if(kind === 'outdoor'){
    g += `<path d="M0 ${base} H${W}" stroke="${V}" stroke-opacity=".5"/>`;
    g += `<path d="M0 ${base} q${W*0.2} -46 ${W*0.42} -22 q${W*0.22} -32 ${W*0.58} -8 V${H} H0Z" fill="${P.deep}" fill-opacity=".5"/>`;
    for(let i=0;i<7;i++) g += `<path d="M${40+i*96} ${base} l-13 -26 l13 -8 l13 8Z" fill="${P.deep}" fill-opacity=".55" stroke="${V}" stroke-opacity=".3"/>`;
  } else if(kind === 'water'){
    g += `<path d="M0 ${base-56} H${W}" stroke="${V}" stroke-opacity=".5"/>`;
    for(let i=0;i<5;i++) g += `<path d="M-20 ${base-40+i*14} q60 -8 120 0 q60 8 120 0 q60 -8 120 0 q60 8 120 0 q60 -8 120 0 q60 8 120 0" stroke="${V}" stroke-opacity="${.32-i*.05}" fill="none"/>`;
    g += `<circle cx="${W*0.82}" cy="52" r="19" fill="${L}" fill-opacity=".5"/>`;
  } else if(kind === 'stage'){
    g += `<rect y="${base}" width="${W}" height="${H-base}" fill="${P.deep}" fill-opacity=".6"/>`;
    for(let i=0;i<9;i++) g += `<path d="M${i*80} ${base} L${i*80-30} ${H}" stroke="${L}" stroke-opacity=".18"/>`;

  } else {
    g += `<rect y="${base}" width="${W}" height="${H-base}" fill="${P.deep}" fill-opacity=".55"/>`;

  }

}

function sceneSvg(c, l){
  const P = PALETTE[c.id] || PALETTE.title;
  const W = 720, H = 300, base = 232;
  const LINE = P.brass, FILL = P.deep, ACC = P.verd;
  const vis = l.actions.filter(a => !(a.hidden && !has(a.hidden)));
  const n = vis.length || 1;
  const kind = SCENE_BG_AT[c.id + ':' + l.id] || SCENE_BG[c.id] || 'interior';
  const sz = Math.max(.82, Math.min(1.25, 1.45 - n*0.075));
  let g = sceneBg(kind, P, W, H, base);
  vis.forEach((a, i) => {
    const key = c.id + ':' + l.id + ':' + a.id;
    const sc = SCENE[key] || ['papers', a.label];
    const draw = PROPS[sc[0]] || PROPS.papers;
    const x = W * (i + .5) / n;
    const back = i % 2 === 1;
    const s = sz * (back ? .88 : 1);
    const y = base - 100*s - (back ? 26 : 0);
    const done = S.done.includes('a:' + l.id + ':' + a.id);
    const on = S.pick && S.pick.a === a.id && S.pick.l === l.id;
    g += `<g class="hs${done?' seen':''}${on?' on':''}" tabindex="0" role="button" aria-label="${sc[1].replace(/"/g,'')}"`+
         ` onmouseenter="hsIn(event,'${l.id}','${a.id}')" onmouseleave="hsOut()"`+
         ` onfocus="hsIn(event,'${l.id}','${a.id}')" onblur="hsOut()"`+
         ` onclick="hsPick('${l.id}','${a.id}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();hsPick('${l.id}','${a.id}')}"`+
         ` transform="translate(${(x-50*s).toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})">`+
         `<rect x="-4" y="-4" width="108" height="108" fill="transparent"/>`+
         draw(LINE, FILL, ACC) +
         (done ? `<g transform="translate(66 2)"><circle cx="12" cy="12" r="11" fill="${P.deep}" stroke="#7d2b24" stroke-width="2"/><path d="M6 12 l4 5 l8 -10" stroke="#7d2b24" stroke-width="2.6" fill="none" stroke-linecap="round"/></g>` : '')+
         `</g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" class="sceneSvg">`+
    `<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">`+
    `<stop offset="0" stop-color="${P.glow}"/><stop offset="1" stop-color="${P.deep}"/></linearGradient></defs>${g}</svg>`;
}

function sceneGlance(lid, aid){
  const sc = SCENE[C().id + ':' + lid + ':' + aid];
  return sc ? sc[1] : '';
}
function hsIn(e, lid, aid){
  const wrap = document.getElementById('sceneWrap'), box = document.getElementById('glanceBox');
  if(!wrap || !box) return;
  const g = e.currentTarget.getBoundingClientRect(), w = wrap.getBoundingClientRect();
  box.textContent = sceneGlance(lid, aid);
  box.style.left = (g.left - w.left + g.width/2) + 'px';
  box.style.top  = (g.top - w.top - 8) + 'px';
  box.classList.add('on');
}
function hsOut(){ const b = document.getElementById('glanceBox'); if(b) b.classList.remove('on'); }
function hsPick(lid, aid){ S.pick = {l:lid, a:aid}; S.last = null; render(); }
function closePop(){ S.popup = false; render(); }

function audioBoot(){
  if(A.live || !A.on) return;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return;
  try{
    A.ctx = new Ctx();
    A.master = A.ctx.createGain(); A.master.gain.value = 0; A.master.connect(A.ctx.destination);
    /* long, smeared tail */
    const dl = A.ctx.createDelay(2.0); dl.delayTime.value = .62;
    const fb = A.ctx.createGain(); fb.gain.value = .46;
    const damp = A.ctx.createBiquadFilter(); damp.type='lowpass'; damp.frequency.value=1500;
    const wet = A.ctx.createGain(); wet.gain.value = .62;
    dl.connect(damp); damp.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(A.master);
    A.send = dl;
    const len = A.ctx.sampleRate * 3, buf = A.ctx.createBuffer(1, len, A.ctx.sampleRate), nd = buf.getChannelData(0);
    for(let i=0;i<len;i++) nd[i] = (Math.random()*2-1) * .55;
    A.noiseBuf = buf;
    /* drone cluster: unison, a beating neighbour, a fifth, and a tritone underneath */
    A.droneF = A.ctx.createBiquadFilter(); A.droneF.type='lowpass'; A.droneF.frequency.value=380; A.droneF.Q.value=5;
    const dg = A.ctx.createGain(); dg.gain.value=.5; A.droneF.connect(dg); dg.connect(A.master);
    [[1,.075,'triangle'],[1,.055,'sawtooth'],[1.4983,.030,'triangle'],[1.4142,.026,'triangle']]
      .forEach(([m,v,w])=>{
        const o=A.ctx.createOscillator(); o.type=w; o.frequency.value=110*m;
        const g=A.ctx.createGain(); g.gain.value=v;
        o.connect(g); g.connect(A.droneF); o.start(); A.drone.push({o,g,m});
      });
    const breathe = A.ctx.createOscillator(); breathe.type='sine'; breathe.frequency.value=.07;
    const breatheG = A.ctx.createGain(); breatheG.gain.value=90;
    breathe.connect(breatheG); breatheG.connect(A.droneF.frequency); breathe.start();
    A.live = true;
    applyMood(true);
    schedule();
    weatherLoop(6000);
  }catch(e){ A.on=false; }
}
function ramp(param, v, t){ if(!param) return; const now=A.ctx.currentTime;
  param.cancelScheduledValues(now); param.setValueAtTime(param.value, now); param.linearRampToValueAtTime(v, now+t); }

function setTheme(id){

function setMood(phase, tone){
  const changed = tone && tone !== A.tone;
  if(tone) setTheme(tone);
  if(tone) A.tone = tone;
  A.mood = phase;
  if(A.live){
    applyMood();
    if(changed){ weatherStop(); weatherLoop(3500); }
  }
}
function applyMood(instant){
  const t = TONE[A.tone] || TONE.title, p = PHASE[A.mood] || PHASE.play;
  A.p = {t,p};
  const s = instant ? .8 : 3.0;
  ramp(A.master.gain, A.on ? p.gain : 0, s);
  ramp(A.droneF.frequency, p.lp * .42, s);
  const rt = (t.voice && t.voice.drone) || DRONE_DEFAULT;
  A.drone.forEach((d,i) => {
    const r = rt[i] || rt[rt.length-1];
    d.o.type = r[2];
    ramp(d.o.frequency, t.root * r[0] * (i===1 ? t.colour : 1), s);
    ramp(d.g.gain, r[1], s);
  });
}
/* a bowed tone that slides into pitch and wavers — never quite steady */
function bow(freq, dur, vol){
  if(!A.live || !A.on) return;
  const v = (A.p && A.p.t.voice) || {};
  const n = A.ctx.currentTime;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain(), f = A.ctx.createBiquadFilter();
  f.type='lowpass'; f.frequency.value = (A.p ? A.p.p.lp : 1200); f.Q.value = 3;
  o.type = v.wave || 'triangle';
  const gl = v.glide || .035;
  o.frequency.setValueAtTime(freq * (Math.random()<.5 ? 1-gl : 1+gl*.8), n);
  o.frequency.exponentialRampToValueAtTime(freq, n + dur*(v.reach || .45));
  const vib = A.ctx.createOscillator(), vibG = A.ctx.createGain();
  vib.type='sine'; vib.frequency.value = (v.vibRate || 3.4) + Math.random()*1.6;
  vibG.gain.value = freq * (v.vibDepth || .007);
  vib.connect(vibG); vibG.connect(o.frequency); vib.start(n); vib.stop(n+dur+.1);
  g.gain.setValueAtTime(0, n);
  g.gain.linearRampToValueAtTime(vol, n + dur*(v.attack || .42));
  g.gain.exponentialRampToValueAtTime(.0001, n + dur);
  o.connect(f); f.connect(g); g.connect(A.master); g.connect(A.send);
  o.start(n); o.stop(n + dur + .1);
}
/* an inharmonic struck tone — glass, not brass */
function bell(freq, dur, vol){
  if(!A.live || !A.on) return;
  const v = (A.p && A.p.t.voice) || {};
  const n = A.ctx.currentTime;
  const car = A.ctx.createOscillator(), mod = A.ctx.createOscillator();
  const modG = A.ctx.createGain(), g = A.ctx.createGain();
  car.type='sine'; mod.type='sine';
  car.frequency.value = freq; mod.frequency.value = freq * (v.bell || 1.4142);
  modG.gain.setValueAtTime(freq * 2.6, n);
  modG.gain.exponentialRampToValueAtTime(freq * .05, n + dur*.6);
  mod.connect(modG); modG.connect(car.frequency);
  g.gain.setValueAtTime(0, n);
  g.gain.linearRampToValueAtTime(vol, n + .012);
  g.gain.exponentialRampToValueAtTime(.0001, n + dur);
  car.connect(g); g.connect(A.master); g.connect(A.send);
  mod.start(n); car.start(n); mod.stop(n+dur+.05); car.stop(n + dur + .05);
}
/* the weather of the place: it arrives, it passes, it leaves silence behind */
function weather(){
  if(!A.live || !A.on || !A.p) return;
  const w = A.p.t.weather; if(!w) return;
  const n = A.ctx.currentTime;
  const src = A.ctx.createBufferSource(); src.buffer = A.noiseBuf; src.loop = true;
  const f = A.ctx.createBiquadFilter(); f.type = w.type; f.Q.value = w.q;
  f.frequency.setValueAtTime(w.f * .8, n);
  f.frequency.linearRampToValueAtTime(w.f * (1 + w.drift), n + w.dur * .6);
  f.frequency.linearRampToValueAtTime(w.f * .75, n + w.dur);
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0, n);
  g.gain.linearRampToValueAtTime(w.g * (.7 + Math.random()*.6), n + w.rise);
  g.gain.linearRampToValueAtTime(0, n + w.dur);
  src.connect(f); f.connect(g); g.connect(A.master);
  src.start(n); src.stop(n + w.dur + .2);
  const node = {src, g, f};
  A.wNodes.push(node);
  src.onended = () => {
    A.wNodes = A.wNodes.filter(x => x !== node);
    try{ g.disconnect(); f.disconnect(); }catch(e){}
  };
}
/* cut whatever weather is still in the air — a gust can run 22 seconds,
   and it must not follow you out of the case */
function weatherStop(){
  clearTimeout(A.wTimer);
  if(!A.live) return;
  const n = A.ctx.currentTime;
  A.wNodes.forEach(({src, g}) => {
    try{
      g.gain.cancelScheduledValues(n);
      g.gain.setValueAtTime(g.gain.value, n);
      g.gain.linearRampToValueAtTime(0, n + .5);
      src.stop(n + .6);
    }catch(e){}
  });
  A.wNodes = [];
}
function weatherLoop(delay){
  clearTimeout(A.wTimer);
  if(!A.live || !A.on) return;
  A.wTimer = setTimeout(() => {
    weather();
    const w = (A.p && A.p.t.weather) || {gap:26000, dur:12};
    weatherLoop(w.dur*1000 + w.gap * (.6 + Math.random()*.9));
  }, delay);
}
function schedule(){
  clearTimeout(A.timer);
  if(!A.live || !A.on) return;
  const {t,p} = A.p, v = t.voice || {};
  const quiet = (A.mood === 'play' || A.mood === 'title');
  const sc = SCALES[(quiet && v.scale) ? v.scale : p.scale];
  A.step++;
  if(Math.random() < p.dens){
    const deg = sc[Math.floor(Math.random()*sc.length)];
    const oct = p.oct[Math.floor(Math.random()*p.oct.length)];
    const f = t.root * Math.pow(2, deg/12 + oct + 1);
    if(Math.random() < p.bell) bell(f*2, 3.2 + Math.random()*2.4, .055);
    else bow(f, 3.4 + Math.random()*2.6, .07);
  }
  if(A.step % 9 === 0) bow(t.root/2, 7.5, .085);
  ornament(v, t);
  A.timer = setTimeout(schedule, p.tempo * (v.tempo || 1) * (.72 + Math.random()*.56));
}
/* the one sound that belongs to this place and nowhere else */
function ornament(v, t){
  const o = v.orn, k = A.step;
  if(!o) return;
  if(o === 'tick'     && k % 2  === 0){ bell(t.root*18, .09, .020); }
  if(o === 'clang'    && k % 7  === 0){ bell(t.root*3, 5.5, .050); }
  if(o === 'foghorn'  && k % 11 === 0){ bow(t.root, 6.5, .090); setTimeout(()=>bow(t.root*1.3348, 7.5, .075), 720); }
  if(o === 'glass'    && k % 4  === 0){ bell(t.root*10.05, 4.4, .028); }
  if(o === 'whistle'  && k % 6  === 0){ bow(t.root*6, 5.0, .034); }
  if(o === 'gong'     && k % 10 === 0){ bell(t.root*1.5, 7.5, .058); }
  if(o === 'engine'   && k % 5  === 0){ bow(t.root/2, 11, .070); }
  if(o === 'tanpura'  && k % 3  === 0){
    [1, 1.4983, 2, 1].forEach((m,i) => setTimeout(()=>bell(t.root*m*2, 2.7, .034), i*340));
  }
}
function sting(kind){
  if(!A.live) return;
  const t = TONE[A.tone] || TONE.title;
  if(kind === 'clue'){ bell(t.root*6, 3.4, .075); setTimeout(()=>bell(t.root*8.49, 3.8, .05), 230); }
  if(kind === 'break'){ bow(t.root*2, 4.6, .085); setTimeout(()=>bow(t.root*2.828, 5.2, .075), 120); }
}
function soundToggle(){
  A.on = !A.on;
  if(A.on){ if(!A.live) audioBoot(); else { applyMood(true); schedule(); weatherLoop(4000); } }
  else { clearTimeout(A.timer); weatherStop(); if(A.live) ramp(A.master.gain, 0, .5); }
  document.querySelectorAll('.sndbtn').forEach(b => b.innerHTML = sndLabel());
}
function sndLabel(){ return A.on ? '&#9834; music on' : '&#9834; music off'; }
function sndBtn(){ return `<button class="sndbtn" onclick="soundToggle()">${sndLabel()}</button>`; }

const S = { cid:null, ap:0, clues:[], done:[], tab:'places', view:null, sel:null, last:null, cipherMsg:null, pick:null, popup:false };
const view = document.getElementById('view');
const C = () => CASES.find(c => c.id === S.cid);
const ROMAN = ['I','II','III','IV','V','VI','VII','VIII','IX','X'];
const has = id => S.clues.includes(id);
const hash = str => { let h=0; for(let i=0;i<str.length;i++) h=(h*31+str.charCodeAt(i))|0; return Math.abs(h); };
const clueName = id => (C().clues[id] || {name:'?'}).name;

function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const d = document.createElement('div');
  d.className='toast'; d.textContent=msg; document.body.appendChild(d);
  setTimeout(()=>d.remove(), 2600);
}
function addClue(id){
  if(!id || has(id)) return false;
  S.clues.push(id); return true;
}
function spend(key, cost){
  if(S.done.includes(key)) return true;           // revisiting costs nothing
  if(S.ap < cost){ toast('The hour is too late for that.'); return false; }
  S.ap -= cost; S.done.push(key); return true;
}
function tally(remaining, total){
  let h='';
  for(let g=0; g<Math.ceil(total/5); g++){
    const inGroup = Math.min(5, total - g*5);
    const spentGroup = (g+1)*5 <= (total-remaining);
    const partial = Math.max(0, Math.min(inGroup, remaining - g*5));
    h += '<span class="tallygroup '+(inGroup===5?'five ':'')+(partial===0?'spent':'')+'">';
    for(let i=0;i<inGroup;i++) h+='<i style="opacity:'+(i<partial?'.85':'.2')+'"></i>';
    h += '</span>';
  }
  return h;
}

          <h2>${c.title}</h2>
          <span class="where">${c.tag}</span>
          <span class="hook">${c.hook}</span>
          <span class="rubber">Open · unsolved</span>
        </span>
      </button>`).join('')}
  </div>`;
  window.scrollTo(0,0); screenIn();
}

/* ---------- briefing ---------- */
function brief(id){
  const c = CASES.find(x=>x.id===id); setMood('play', id);
  view.innerHTML = `
  <button class="back" onclick="showCases()">&larr; All cases</button>
  <div class="paper">
    <span class="plate-wide">${motif(c.id)}</span>
    <p class="eyebrow" style="color:var(--oxblood)">Confidential · ${c.tag}</p>
    <h2 style="font-size:32px">${c.title}</h2>
    <div class="hr"></div>
    ${c.brief.map((p,i)=>`<p class="${i===0?'first':''}">${p}</p>`).join('')}
    <div class="hr"></div>
    <p style="font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--oxblood);text-transform:uppercase">
      ${c.ap} hours · ${c.suspects.length} persons of interest · ${Object.keys(c.clues).length} pieces of evidence to be had
    </p>
    <p style="margin-top:18px"><button class="btn ink" onclick="begin('${c.id}')">Take the case</button></p>
  </div>`;
  window.scrollTo(0,0); screenIn();
}

function begin(id){
  S.cid=id; setMood('play', id); S.ap=C().ap; S.clues=[]; S.done=[]; S.tab='places'; S.sel=null; S.last=null; S.cipherMsg=null; S.pick=null; S.popup=false;
  render();
}

/* ---------- main render ---------- */
function render(){
  const c = C();
  const total = Object.keys(c.clues).length;
  let body='';
  if(S.sel && S.sel.type==='place') body = placePanel(S.sel.id);
  else if(S.sel && S.sel.type==='person') body = personPanel(S.sel.id);
  else if(S.tab==='places') body = placesList();
  else if(S.tab==='people') body = peopleList();
  else body = evidenceList();

  view.innerHTML = `
  <span class="plate-thin">${motif(c.id)}</span>
  <div class="duty">
    <div>
      <p class="eyebrow">File ${ROMAN[CASES.indexOf(c)]} · in hand</p>
      <h2>${c.title}</h2>
      <p class="meta" style="margin:6px 0 0">${c.tag}</p>
    </div>
    <div>
      <div class="tally">${tally(S.ap, c.ap)}</div>
      <div class="hourslabel" style="margin-top:6px">${S.ap} of ${c.ap} hours left · ${S.clues.length}/${total} evidence</div>
      <div style="margin-top:8px">${sndBtn()}</div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab ${S.tab==='places'&&!S.sel?'on':''}" onclick="go('places')">Places</button>
    <button class="tab ${S.tab==='people'&&!S.sel?'on':''}" onclick="go('people')">People</button>
    <button class="tab ${S.tab==='evidence'?'on':''}" onclick="go('evidence')">Evidence <span class="ct">(${S.clues.length})</span></button>
    <button class="tab" style="margin-left:auto;color:var(--oxblood)" onclick="accuse()">Name the killer</button>
  </div>
  ${body}`;
}
function go(t){ S.tab=t; S.sel=null; S.last=null; S.cipherMsg=null; S.pick=null; S.popup=false; setMood('play'); render(); window.scrollTo(0,0); }
function openItem(type,id){ S.sel={type,id}; S.last=null; S.cipherMsg=null; S.pick=null; S.popup=false; setMood(type==='person'?'tense':'play'); render(); window.scrollTo(0,0); }
function closeItem(){ S.sel=null; S.last=null; S.cipherMsg=null; S.pick=null; S.popup=false; setMood('play'); render(); window.scrollTo(0,0); }

/* ---------- places ---------- */
function placesList(){
  const c=C();
  return `<div class="rows">${c.locations.map(l=>{
    const vis = l.actions.filter(a=>!(a.hidden && !has(a.hidden)));
    const doneN = vis.filter(a=>S.done.includes('a:'+l.id+':'+a.id)).length;
    return `<button class="row" onclick="openItem('place','${l.id}')">
      <span class="k">${doneN}/${vis.length}</span>
      <span><span class="t">${l.name}</span><span class="d">${l.desc}</span></span>
    </button>`;}).join('')}</div>`;
}
function placePanel(id){
  const c=C(), l=c.locations.find(x=>x.id===id);
  const picked = (S.pick && S.pick.l===l.id) ? l.actions.find(a=>a.id===S.pick.a) : null;
  const pickedDone = picked && S.done.includes('a:'+l.id+':'+picked.id);
  return `<button class="back" onclick="closeItem()">&larr; Places</button>
  <div class="paper panel">
    <div class="sceneWrap" id="sceneWrap">
      ${sceneSvg(c, l)}
      <div class="glanceBox" id="glanceBox"></div>
    </div>
    ${picked ? `<div class="actbar">
        <span class="g"><b>${sceneGlance(l.id, picked.id)}</b>${picked.label}</span>
        <button class="btn ink" onclick="doAct('${l.id}','${picked.id}',1)">
          ${pickedDone ? 'Look again &middot; no cost' : 'Do it &middot; 1 hour'}</button>
      </div>`
      : `<div class="hint">Look over the scene &mdash; hover or tap anything that catches your eye</div>`}
    <p class="eyebrow" style="color:var(--oxblood)">Scene</p>
    <h3>${l.name}</h3>
    <p class="lede">${l.long}</p>
    <p class="eyebrow" style="margin-top:22px;color:var(--ink-soft)">Or work from the list</p>
    <div class="acts">${l.actions.filter(a=>!(a.hidden && !has(a.hidden))).map(a=>{
      const key='a:'+l.id+':'+a.id;
      const spentAlready=S.done.includes(key);
      return `<button class="act ${spentAlready?'spent':''}" onclick="doAct('${l.id}','${a.id}')">
        <span class="lbl">${a.label}</span>
        <span class="cost">${spentAlready?'done':'1 hour'}</span></button>`;
    }).join('')}</div>
    ${(S.last && !S.popup)?resultBlock():''}
  </div>
  ${(S.popup && S.last) ? `<div class="popup" onclick="closePop()">
      <div class="paper popinner" onclick="event.stopPropagation()">
        <p class="lbl">${l.name}</p>
        <h3>${picked ? picked.label : 'Finding'}</h3>
        ${resultBlock()}
        <p class="popclose"><button class="btn ink" onclick="closePop()">Close</button></p>
      </div></div>` : ''}`;
}
function doAct(lid,aid,fromScene){
  const l=C().locations.find(x=>x.id===lid), a=l.actions.find(x=>x.id===aid);
  if(fromScene) S.pick={l:lid, a:aid};
  S.popup = !!fromScene;
  if(a.requires && !has(a.requires)){ S.last={text:a.blocked||`You get no further with that today.`, clue:null}; render(); return; }
  if(a.type==='cipher'){ if(!spend('a:'+lid+':'+aid,1)) return; S.popup=false; S.last={cipher:a, lid, aid}; render(); return; }
  if(!spend('a:'+lid+':'+aid,1)){ S.popup=false; return; }
  const gained = addClue(a.clue);
  if(gained) sting('clue');
  S.last={text:a.text, clue:gained?a.clue:null};
  render();
}
function resultBlock(){
  const c=C();
  if(S.last.cipher){
    const a=S.last.cipher;
    return `<div class="result">
      <p>${a.text}</p>
      <div class="cipher">${a.ciphertext}</div>
      <div class="cipherform">
        <input id="cipherIn" placeholder="Write out the message in plain English" onkeydown="if(event.key==='Enter')trySolve()">
        <button class="btn ink" onclick="trySolve()">Read it</button>
      </div>
      ${S.cipherMsg?`<p style="margin-top:12px;font-family:var(--mono);font-size:12.5px;color:var(--oxblood)">${S.cipherMsg}</p>`:''}
      ${has(a.clue)?`<p class="found" style="margin-top:12px">Entered in the file</p>`:''}
    </div>`;
  }
  return `<div class="result">
    <p>${S.last.text}</p>
    ${S.last.clue?`<p class="found">Entered in the file</p>`:''}
  </div>`;
}
function trySolve(){
  const a=S.last.cipher;
  const raw=(document.getElementById('cipherIn').value||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(!raw){ S.cipherMsg='Nothing written yet.'; render(); return; }
  if(raw.includes(a.answerKey)){
    const gained=addClue(a.clue);
    if(gained) sting('break');
    S.cipherMsg = gained ? 'The letters fall into place: ' + a.plain : 'You have already read it: ' + a.plain;
  } else {
    S.cipherMsg = a.hint;
  }
  render();
}

/* ---------- people ---------- */
function peopleList(){
  const c=C();
  return `<div class="gallery">${c.suspects.map(s=>{
    const vis = s.topics.filter(t=>!(t.hidden && !has(t.hidden)));
    const asked = vis.filter(t=>S.done.includes('t:'+s.id+':'+t.id)).length;
    const shown = S.clues.filter(cl=>S.done.includes('c:'+s.id+':'+cl)).length;
    return `<button class="pcard" onclick="openItem('person','${s.id}')">
      <span class="frame">${portrait(s.id)}</span>
      <span class="cap">
        <span class="nm">${s.name}</span>
        <span class="rl">${s.role}</span>
        <span class="st">${asked}/${vis.length} asked · ${shown} shown</span>
      </span>
    </button>`;}).join('')}</div>`;
}
function personPanel(id){
  const c=C(), s=c.suspects.find(x=>x.id===id);
  const clueBtns = S.clues.length
    ? S.clues.map(cl=>{
        const spentAlready=S.done.includes('c:'+s.id+':'+cl);
        return `<button class="act ${spentAlready?'spent':''}" onclick="confront('${s.id}','${cl}')">
          <span class="lbl">Show &ldquo;${clueName(cl)}&rdquo;</span>
          <span class="cost">${spentAlready?'shown':'1 hour'}</span></button>`;}).join('')
    : `<div class="empty" style="color:var(--ink-soft);border-color:var(--manila-edge)">You have nothing in hand to put in front of anyone yet.</div>`;
  return `<button class="back" onclick="closeItem()">&larr; People</button>
  <div class="paper panel">
    <div class="dossier">
      <div class="plate">${portrait(s.id)}</div>
      <div class="who">
        <p class="eyebrow" style="color:var(--oxblood);margin-bottom:4px">${s.role}</p>
        <h3>${s.name}</h3>
        <p class="lede" style="margin-top:8px">${s.long}</p>
        <div class="facts">${((CHARS[s.id]||{}).facts||[]).map(f=>`<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join('')}</div>
      </div>
    </div>
    <p class="eyebrow" style="margin-top:22px;color:var(--ink-soft)">Ask about</p>
    <div class="acts">${s.topics.filter(t=>!(t.hidden && !has(t.hidden))).map(t=>{
      const key='t:'+s.id+':'+t.id, spentAlready=S.done.includes(key);
      return `<button class="act ${spentAlready?'spent':''}" onclick="ask('${s.id}','${t.id}')">
        <span class="lbl">${t.label}</span>
        <span class="cost">${spentAlready?'asked':'1 hour'}</span></button>`;
    }).join('')}</div>
    <p class="eyebrow" style="margin-top:22px;color:var(--ink-soft)">Put evidence to them</p>
    <div class="acts">${clueBtns}</div>
    ${S.last?resultBlock():''}
  </div>`;
}
function ask(sid,tid){
  const s=C().suspects.find(x=>x.id===sid), t=s.topics.find(x=>x.id===tid);
  if(!spend('t:'+sid+':'+tid,1)) return;
  const gained=addClue(t.clue);
  if(gained) sting('clue');
  S.last={text:`<em>${t.label}</em><br>&ldquo;${t.text}&rdquo;`, clue:gained?t.clue:null};
  render();
}
function confront(sid,cl){
  const s=C().suspects.find(x=>x.id===sid);
  if(!spend('c:'+sid+':'+cl,1)) return;
  const r=(s.confront||{})[cl];
  if(r){
    const gained=addClue(r.clue);
    if(gained) sting('break');
    S.last={text:`You lay the ${clueName(cl).toLowerCase()} on the table.<br>&ldquo;${r.text}&rdquo;`, clue:gained?r.clue:null};
  } else {
    const d = Array.isArray(s.deflect) ? s.deflect[hash(cl+s.id) % s.deflect.length] : s.deflect;
    S.last={text:`You lay the ${clueName(cl).toLowerCase()} on the table.<br>&ldquo;${d}&rdquo;`, clue:null};
  }
  render();
}

/* ---------- evidence ---------- */
function evidenceList(){
  const c=C();
  if(!S.clues.length) return `<div class="empty">The file is empty. Go and fill it.</div>`;
  const P=PALETTE[c.id]||PALETTE.title;
  return `<div class="tags">${S.clues.map((id,i)=>{
    const cl=c.clues[id], draw=PROPS[clueProp(c,id)]||PROPS.papers;
    return `<div class="tag">
      <div class="tagicon"><svg viewBox="-6 -4 112 112" xmlns="http://www.w3.org/2000/svg">${draw(P.brass,P.deep,P.verd)}</svg></div>
      <div class="tagbody">
        <div class="no">Exhibit ${String(i+1).padStart(2,'0')}</div>
        <div class="nm">${cl.name}</div>
        <div class="tx">${cl.text}</div>
      </div>
    </div>`;}).join('')}</div>`;
}
/* which object in the world produced this exhibit */
function clueProp(c, clueId){
  for(const l of c.locations) for(const a of l.actions)
    if(a.clue===clueId){ const sc=SCENE[c.id+':'+l.id+':'+a.id]; if(sc) return sc[0]; }
  for(const s of c.suspects){
    for(const t of s.topics) if(t.clue===clueId) return 'person';
    for(const k in (s.confront||{})) if(s.confront[k].clue===clueId) return 'person';
  }
  return 'papers';
}

/* ---------- accusation ---------- */
function accuse(){
  const c=C(); setMood('charge');
  view.innerHTML = `
  <button class="back" onclick="render()">&larr; Back to the case</button>
  <div class="paper">
    <p class="eyebrow" style="color:var(--oxblood)">Charge sheet</p>
    <h3>State your case</h3>
    <p class="lede">Once the seal goes on, it goes to the magistrate as written. You have ${S.ap} hours left — you may still go back.</p>
    <div class="dossier" style="margin-top:18px">
      <div class="plate" id="chargePlate">${portrait(c.suspects[0].id)}</div>
      <div class="who">
    <div class="charge">
      <div><label>The person charged</label>
        <select id="selWho" onchange="chargeFace()">${c.suspects.map(s=>`<option value="${s.id}">${s.name} — ${s.role}</option>`).join('')}</select></div>
      <div><label>How it was done</label>
        <select id="selHow">${c.methods.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div>
      <div><label>Why it was done</label>
        <select id="selWhy">${c.motives.map((m,i)=>`<option value="${i}">${m}</option>`).join('')}</select></div>
    </div>
      </div>
    </div>
    <button class="seal" onclick="verdict()">Seal the<br>charge</button>
  </div>`;
  window.scrollTo(0,0); screenIn();
}
function chargeFace(){
  const el=document.getElementById('chargePlate');
  if(el) el.innerHTML = portrait(document.getElementById('selWho').value);
}
function verdict(){
  const c=C();
  const who=document.getElementById('selWho').value;
  const how=+document.getElementById('selHow').value;
  const why=+document.getElementById('selWhy').value;
  const rightWho = who===c.answer.culprit, rightHow = how===c.answer.method, rightWhy = why===c.answer.motive;
  const total=Object.keys(c.clues).length, pct=Math.round(S.clues.length/total*100);
  setMood(rightWho?'win':'lose');
  let rank, note;
  if(!rightWho){ rank='Case unsolved'; note=c.wrongEnding; }
  else if(rightHow && rightWhy && pct>=85){ rank='Master detective'; note='The defence never rose. Every step of it was in your file before you spoke a word.'; }
  else if(rightHow && rightWhy){ rank='Consulting detective'; note='A clean conviction, argued on the evidence you troubled to gather.'; }
  else if(rightHow || rightWhy){ rank='Inspector, first class'; note='The right neck in the noose, though counsel had a day of sport with the gaps.'; }
  else { rank='Lucky'; note='You named the right person and could not say how or why. The jury went with you anyway. Do not count on it twice.'; }

  view.innerHTML = `
  <div class="paper">
    <p class="rank">${rank}</p>
    <h3 style="font-size:30px">${rightWho?'You had your man.':'You had the wrong man.'}</h3>
    <p>${note}</p>
    <div class="hr"></div>
    <div class="scoreline"><span>Person charged</span><span>${rightWho?'CORRECT':'WRONG — it was '+c.suspects.find(s=>s.id===c.answer.culprit).name}</span></div>
    <div class="scoreline"><span>Method</span><span>${rightHow?'CORRECT':'WRONG'}</span></div>
    <div class="scoreline"><span>Motive</span><span>${rightWhy?'CORRECT':'WRONG'}</span></div>
    <div class="scoreline"><span>Evidence gathered</span><span>${S.clues.length}/${total} · ${pct}%</span></div>
    <div class="scoreline"><span>Hours unspent</span><span>${S.ap}</span></div>
    <div class="hr"></div>
    <p class="eyebrow" style="color:var(--oxblood)">What actually happened</p>
    ${c.epilogue.map(p=>`<p>${p}</p>`).join('')}
    <p style="margin-top:22px">
      <button class="btn ink" onclick="begin('${c.id}')">Work the case again</button>
      <button class="btn ink" onclick="showCases()" style="margin-left:8px">Other cases</button>
    </p>
  </div>`;
  window.scrollTo(0,0); screenIn();
}

showCases();
</script>
</body>
</html>
