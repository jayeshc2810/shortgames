CASES.push({
  id:'whitmoor',
  title:'The Whitmoor Séance',
  tag:'Bloomsbury, London · March 1912',
  hook:`Five people held hands in the dark for forty minutes. When the gas came up, the medium was dead.`,
  ap:20,
  brief:[
    `Madame Sabine Lestrel took the chair at nine, the gas was turned down, and five sitters joined hands around the table at Whitmoor Street. The street door was bolted; the room door was wedged with its own chair from the inside.`,
    `At twenty past ten Dr Poole struck a match. Lestrel had been dead some while, of what the police surgeon at first took to be a seizure, and what he found on the second look was a six-inch steel bodkin driven in behind the left ear.`,
    `Every sitter swears every hand was held. The spiritualist papers have already printed the obvious explanation and it is not one you can put before a magistrate.`
  ],
  clues:{
    bodkin:{name:`The bodkin`, text:`A milliner's steel bodkin, six inches, wiped on something woollen and dropped behind the cabinet curtain.`},
    tongs:{name:`The reaching rod`, text:`A lazy-tongs of light steel, folded flat into the cabinet wall and oiled at every joint. Extended, it will cross that table and come back.`},
    hand:{name:`The spirit hand`, text:`A kid glove stuffed with horsehair on a shaped wooden wrist, kept warm in the cabinet by a covered lamp.`},
    plan:{name:`The sitting plan`, text:`Friday's arrangement in Lestrel's hand. Wrack, then Aird, then Fennimore, then Poole, then Quick's empty chair, then Lestrel — and against two names a small pencilled cross.`},
    tap:{name:`The gas tap`, text:`Turned off at the bracket, not blown out. The bracket is behind the left shoulder of one chair and beyond the arm of any other.`},
    watch:{name:`Poole's stopwatch card`, text:`Manifestation at 9.41, ninety-four seconds. Table lifted twice. Against every sitter, by his own reckoning: hands held throughout.`},
    cheques:{name:`Sir Osmund's counterfoils`, text:`Two thousand four hundred pounds to S. Lestrel across twenty-six months, in fifties and hundreds, all in his own hand.`},
    agreement:{name:`Poole's agreement`, text:`One controlled sitting, one hundred guineas, and a signed statement naming the person who worked the apparatus. Dated the fourth. Signed by both.`},
    statement:{name:`The unsigned statement`, text:`Two paragraphs of confession in Lestrel's hand, breaking off mid-sentence, and one name written out in full three times as though she were practising how it would look in print.`},
    fireboard:{name:`The nailed fireboard`, text:`The flue behind it has not been opened in years. The board is nailed at eight points and the nail heads are painted over.`},
    quick:{name:`Quick's door book`, text:`Street door bolted 9.10 and not drawn again until the police came. Nobody in, nobody out, and the doorkeeper sat in the passage the whole while with his boots off.`},
    paint:{name:`Luminous paint`, text:`A smear of the green paint used on séance gauze, worked into the seam of a cuff and not quite got out again.`},
    coldhand:{name:`Mrs Fennimore's realisation`, text:`What she held from a little after half past nine was warm, and dry, and it never once moved. A living hand moves.`},
    clemency:{name:`Miss Aird's admission`, text:`She does not deny the rod or the statement. She says only that she was to be handed over to the police as the fraud, and that Lestrel was to be handed a hundred guineas and a book.`}
  },
  locations:[
    {id:'room', name:`The Séance Room`, desc:`Whitmoor Street, first floor. Sealed since Friday.`,
     long:`Heavy curtains, a round table of no great weight, six chairs, one gas bracket, and a smell of camphor and scorched wool.`,
     actions:[
      {id:'tap', label:`Examine the gas bracket`, clue:'tap', text:`You try the reach from each chair in turn, which takes twenty minutes and looks ridiculous, and settles the question entirely.`},
      {id:'curtain', label:`Search behind the cabinet curtain`, clue:'bodkin', text:`It has rolled against the skirting and lain there since Friday, which tells you something about the police search and nothing at all about the murder.`},
      {id:'fire', label:`Examine the fireplace`, clue:'fireboard', text:`Two papers have already explained that something came down this chimney. You get a claw hammer and put the question beyond argument.`},
      {id:'table', label:`Measure the table and the chairs`, text:`Four feet six across, light enough for one hand to lift on the near edge, and marked underneath with the fingernail scars of a great many séances. It is a conjurer's table and everybody in the room knew it.`}
     ]},
    {id:'cabinet', name:`The Medium's Cabinet`, desc:`The curtained recess behind her chair.`,
     long:`A shelf, a covered lamp, a jug, and the smell of hot kid leather.`,
     actions:[
      {id:'rod', label:`Search the cabinet wall`, clue:'tongs', text:`It lies flat against the boards behind a hanging cloth, and folds down to the length of a walking stick.`},
      {id:'glove', label:`Search the cabinet shelf`, clue:'hand', text:`Under a cloth, beside the lamp that keeps it at the temperature of a living thing.`},
      {id:'basket', label:`Turn out the property basket`, text:`Gauze, a tin trumpet, a bottle of ether, a musical box with the governor removed, and a bell on a wire. Twenty years of an honest trade dishonestly practised, and not one thing in it that will kill a woman.`}
     ]},
    {id:'dressing', name:`Lestrel's Dressing Room`, desc:`Two floors up, and a good deal richer than the séance room.`,
     long:`Silk, a great many photographs of the bereaved, and a writing case with a poor lock.`,
     actions:[
      {id:'plan', label:`Search the writing desk`, clue:'plan', text:`She planned her sittings as a general plans a field, and kept every plan she ever made.`},
      {id:'case', label:`Force the writing case`, clue:'statement', hidden:'agreement', text:`The lock costs you a bent letter-opener and about four seconds. Inside, under the passbook, is what she was writing on Thursday night.`},
      {id:'cuff', label:`Go through the laundry basket`, clue:'paint', text:`Three blouses, two cuffs each. On the fourth cuff, something green that has been scrubbed at.`}
     ]},
    {id:'hall', name:`The Hall and Street Door`, desc:`Where Quick sat all evening with his boots off.`,
     long:`A gas jet, a chair, a bolt of the old sort that shrieks, and a door book kept since 1897.`,
     actions:[
      {id:'book', label:`Read the door book`, clue:'quick', text:`Quick writes down every soul who crosses that step, and has done for fifteen years, chiefly because he distrusts every one of them.`}
     ]},
    {id:'society', name:`The Society for Psychical Study`, desc:`Poole's rooms in Adam Street.`,
     long:`Card indexes, a spirit balance, four hundred exposed mediums in alphabetical order, and a man who has never once been surprised.`,
     actions:[
      {id:'card', label:`Read the sitting record`, clue:'watch', text:`Poole records to the second and does not embroider. His card is the best evidence in the case and it appears, at first, to make the case impossible.`},
      {id:'file', label:`Search the Lestrel file`, clue:'agreement', text:`Nine years of her, in Poole's small hand, ending in a document that is not a research note at all but a contract.`}
     ]},
    {id:'bank', name:`Sir Osmund's House, Portman Square`, desc:`The patron's papers, offered without a murmur.`,
     long:`He shows you into the study himself and puts the whole of it in front of you, which is either innocence or a very good imitation.`,
     actions:[
      {id:'cheques', label:`Examine the cheque counterfoils`, clue:'cheques', text:`He does not wait to be asked twice, and he watches you add it up.`},
      {id:'letters', label:`Read the letters from his son`, text:`Nine letters from a boy who went down with the Pathan in 1909, read so often that the folds have parted. They tell you why a rich man paid two thousand pounds to be lied to, and nothing whatever about who killed the liar.`}
     ]}
  ],
  suspects:[
    {id:'wrack', name:`Sir Osmund Wrack`, role:`Ironfounder; her patron`,
     brief:`Sat on the medium's right. Lost a son at sea in 1909.`,
     long:`A big, worn, courteous man who answers every question fully and looks at the door whenever the boy is mentioned.`,
     deflect:[`I saw nothing. The room was black as a pocket.`,`He turns it over with great care and hands it back. I am afraid that means nothing to me.`,`You must ask Dr Poole. He is the one who watches. I was there to listen.`],
     topics:[
      {id:'why', label:`Why did you attend?`, text:`Because for two years she has been the only person in England who would talk to me about my son in the present tense. You may write that down and think what you like of it.`},
      {id:'felt', label:`What did you feel and hear?`, text:`A cold draught at about half past nine. The table twice. And a sound I took for the bell on the wire, though it came from the wrong side of the room.`},
      {id:'money', label:`What did it cost you?`, text:`I have never counted, which I imagine is the answer you were hoping for.`}
     ],
     confront:{
      cheques:{text:`Yes. And I would have paid twice that, and I shall be laughed at in every club in London, and I do not much care.`},
      statement:{text:`He reads it twice and his face does something unpleasant. Then she was going to sell me that as well. First the boy and then the confession — both at a hundred guineas. I begin to see why somebody killed her, Inspector, and I am sorry to say it does not much shock me.`},
      hand:{text:`He holds it a long moment and puts it down as though it were hot. I have held that. I know I have held that.`}
     }},
    {id:'clemency', name:`Miss Clemency Aird`, role:`The medium's assistant`,
     brief:`Twenty-four. Sat between Sir Osmund and Mrs Fennimore, hands held all evening.`,
     long:`Neat, quick, and entirely composed, with the flat London voice of somebody who has learned a better one and drops it when tired.`,
     deflect:[`I worked for her four years. I don't know what half the things in that room were for.`,`She glances at it and away. That was hers, I expect. Everything in that house was hers.`,`You keep showing me objects, Inspector. Show me a person.`],
     topics:[
      {id:'work', label:`What did your work consist of?`, text:`The cabinet, the sitters' letters, the lamp, the gauze, and keeping the room at the temperature she liked. She called me her hands. It was meant kindly and it was perfectly accurate.`},
      {id:'night', label:`Describe Friday evening`, text:`We sat at nine. She was flat all week and worse that night. Nothing came until the manifestation, and after it she went very quiet, and I thought she had gone into one of her states, and I let her be.`},
      {id:'cabinet', label:`Who could reach the cabinet?`, text:`Anyone behind her chair, in the dark. Which is nobody, since we were all of us holding hands, which is the difficulty, isn't it.`}
     ],
     confront:{
      tongs:{text:`Every medium in London has one of those and half of them have two. It is not a weapon, it is a piece of furniture.`},
      hand:{text:`For the trumpet work. You cannot hold a trumpet and two hands at once, so you hold one hand and a glove. The sitters know it happens. They simply prefer that it should not be happening to them.`},
      paint:{text:`I paint the gauze. It is on all my cuffs, and on the sleeve of every blouse I own, and it has been for four years.`},
      plan:{text:`I sat where I always sat. She put me between the two who most wanted to believe, because they hold tightest and notice least. That was her arrangement, not mine.`},
      coldhand:{text:`The composure goes, very slightly, at one corner. The old lady is seventy-one and she dozed. She said so herself at the inquest.`},
      statement:{clue:'clemency', text:`She reads her own name three times over in her employer's handwriting, and when she speaks it is in the flat voice and she does not go back to the other one. Poole's hundred guineas was for a confession. Hers. And the person who goes to Holloway for taking two thousand four hundred pounds off that poor man is not the woman who spoke in the voice — it's the girl who worked the cabinet, and she'd have stood in the dock and said so, and then written a book about her redemption. She taught me every part of it. She taught me the hands. She said I was quick.`}
     }},
    {id:'poole', name:`Dr Naismith Poole`, role:`Psychical researcher`,
     brief:`Came to expose her. Timed the whole sitting to the second.`,
     long:`Forty-one, dry as chalk, and the only person in this case who has not once told you a lie, which is not at all the same as telling you everything.`,
     deflect:[`I record what occurs. I do not speculate, and I am afraid I cannot help you speculate either.`,`He examines it with real interest and hands it back. Common apparatus. Nothing evidential.`,`My card is my evidence, Inspector. Everything else is anecdote.`],
     topics:[
      {id:'why', label:`Why were you at the table?`, text:`Because in nine years she has never once sat under control, and this time she had agreed to. I have exposed forty-one mediums. She would have been the forty-second and by a distance the best of them.`},
      {id:'observed', label:`What did you observe?`, text:`Nothing that requires a spirit and nothing that requires a murderer, which is the trouble. The table twice, a cold draught, a bell out of position, and every hand at the table held from nine until I struck a light.`},
      {id:'terms', label:`What were your terms with her?`, hidden:'agreement', text:`A hundred guineas for one controlled sitting and a signed statement. She was not to confess to fraud in the abstract — the Society has fifty of those and they are worthless. She was to name the person who physically worked the apparatus, and to hand them over. I told her plainly it meant a prosecution. She said the girl was young and would come out of it very well known.`}
     ],
     confront:{
      watch:{text:`Every second of it. And I will swear to it, and any counsel will make me swear to it, and it will acquit whoever did this unless you can show me how the thing was reached without a hand leaving that table.`},
      tongs:{text:`He goes still. Then, quietly: extended, that is fifty-one inches. The table is fifty-four across. Ah. No — from a chair at the side, it is nothing like fifty-four.`},
      agreement:{text:`Yes. I have been waiting three days for somebody to find that and ask me about it. You are the first, which does the Metropolitan Police no credit at all.`}
     }},
    {id:'fennimore', name:`Mrs Adela Fennimore`, role:`A regular sitter`,
     brief:`Seventy-one. Sat on Miss Aird's left, and held her hand all evening.`,
     long:`Small, deaf on one side, and much sharper than the inquest allowed her to appear.`,
     deflect:[`I am sure I don't know, dear. I only came for my husband.`,`She holds it up to the light and shakes her head. It's nothing to me.`,`You must ask the young people. They see so much better in the dark.`],
     topics:[
      {id:'sitting', label:`Tell me about the sitting`, text:`Cold, and long, and not one of her better evenings. Ernest did not come. He very rarely does now, which I put down to the company.`},
      {id:'held', label:`Whose hand did you hold?`, text:`Miss Aird's, on my right, from nine o'clock until the light. And Dr Poole's on my left, which was like holding a cold potato and being examined at the same time.`},
      {id:'manner', label:`How had Madame Lestrel been that week?`, text:`Frightened, dear. Not of ghosts — she was never frightened of those, they were her living. She was frightened of a person, and she kept saying she had been very stupid and it would all come right on Monday.`}
     ],
     confront:{
      hand:{clue:'coldhand', text:`She takes it and holds it properly, the way you hold a hand and not an object, and she sits with it for a long moment. Then: oh. Oh, I see. It was warm, and it was dry, and it never moved, not once, not in all that time. I remember thinking the poor girl had gone to sleep sitting up. A living hand moves, Inspector. Even asleep it moves. I have held my husband's hand for forty years and I ought to have known this was not one.`},
      plan:{text:`A cross against my name and a cross against Sir Osmund's. Well — we are the two who paid, dear, and the two who wanted it. I don't need a policeman to explain that cross to me.`}
     }},
    {id:'quick', name:`Bartholomew Quick`, role:`Doorkeeper at Whitmoor Street`,
     brief:`Sat in the passage from nine until the police came, with his boots off.`,
     long:`Sixty, sour, and in possession of a fifteen-year book that he clearly regards as the only honest document in the house.`,
     deflect:[`Not my department, sir. I keep the door.`,`Never seen it and don't want it explained.`,`They brought all manner of rubbish into that room. I stopped looking years ago.`],
     topics:[
      {id:'door', label:`Who came and went?`, text:`Nobody, sir. Bolted at ten past nine and not drawn till the constable. That bolt shrieks like a cat and I'd have heard it in my sleep, which I was not.`},
      {id:'temper', label:`How was the household?`, text:`Bad all week. She had words with the young lady on the Wednesday, in the dressing room, with the door shut, and I heard the pitch of it if not the sense.`},
      {id:'girl', label:`Tell me about Miss Aird`, text:`Came to her a slavey out of Hoxton four years back and can talk like a duchess now when she troubles to. Works that cabinet like a sailor works rigging. Never liked her and never had a reason, which I know is worth nothing to you.`}
     ],
     confront:{
      quick:{text:`Fifteen years of it, sir, and never a correction. If a person got into that room on Friday they got in before nine and they never left, and there were five of them and I can name every one.`}
     }}
  ],
  methods:[
    `Struck by somebody who came down the chimney in the dark`,
    `A bodkin fixed to her own reaching rod and worked across the table`,
    `Poisoned in the glass at her elbow before the gas went down`,
    `Killed before nine, and the sitting played out to a dead woman`,
    `Struck by a sitter who quietly left the table in the dark`
  ],
  motives:[
    `To end a fraud that had cost Sir Osmund thousands`,
    `To stop a confession that would have named its author`,
    `Jealousy of the medium's hold on a rich man`,
    `To protect the Society from a scandal`,
    `To silence a blackmailer of long standing`
  ],
  answer:{culprit:'clemency', method:1, motive:1},
  wrongEnding:`The coroner has returned murder by a person or persons unknown, and three newspapers have explained the locked room by means that no jury will ever hear. A young woman has left London and is doing rather well on the Brighton circuit.`,
  epilogue:[
    `Poole's hundred guineas bought a confession, and the confession was to name the hands. Sabine Lestrel had taught Clemency Aird every part of the trade — the cabinet, the gauze, the trumpet, and above all the substitution of a warmed glove for a living hand, so that two sitters may each swear they are holding the same person.`,
    `On Friday she used it on the pair either side of her, as she had a hundred times before, and then reached the folded rod out of the cabinet at her employer's back. Fifty-one inches is not enough to cross that table. It is a great deal more than enough to come at a woman sitting round the curve of it from the side.`,
    `Then she turned the gas tap off at the bracket behind her shoulder, so that nobody would strike a light early, put the rod back in the wall, dropped the bodkin behind the curtain, and sat holding two hands until twenty past ten.`,
    `Poole's card, which was meant to be the ruin of her, was very nearly her acquittal: every hand held, from nine until the light. It was true. He had simply not asked what a hand was.`
  ]

CASES.push({
  id:'kilnbrae',
  title:'The Snow at Kilnbrae',
  tag:'Inverness-shire · January 1926',
  hook:`One line of footprints goes to the gun-room window. Nothing comes away from it.`,
  ap:17,
  brief:[
    `Colonel Ranald Kilgour was found on the gun-room floor at Kilnbrae at half past nine on Tuesday, shot once through the chest with his own stalking rifle. The door was bolted on the inside. The window was shut.`,
    `Outside, in nine inches of new snow, a single line of boot prints runs from the drive to the gun-room window and stops. Nothing leads away from it. The county has settled comfortably on a poacher, a supernatural agency, or both.`,
    `The house was full: a daughter, a factor, a guest, a cook and a ghillie, all of whom heard the shot at nine and none of whom can get out of the glen until the road clears on Friday. Which gives you until Friday.`
  ],
  clues:{
    stove:{name:`The burst cartridge case`, text:`In the gun-room stove ash, a twelve-bore brass head, split down the wall and blown clear of its paper. It was not fired from a gun.`},
    snowbook:{name:`The estate weather book`, text:`Kept twice daily for thirty years. Tuesday: fine to dusk, first snow 7.40 p.m., heavy after nine.`},
    tracks:{name:`The single line of prints`, text:`Twenty-two prints, drive to window, none returning. The stride is even, the toe is deeper than the heel in every one of them, and the snow in each print is unbroken beneath.`},
    spareboots:{name:`The Colonel's spare boots`, text:`Back on their rack in the boot room, wet through inside and out, laced with a bow where the Colonel's man always laced them with a double knot.`},
    surgeon:{name:`The surgeon's note`, text:`Body cold through, stiffening well advanced at eleven o'clock, stomach nearly empty of a six o'clock tea. Dr Menzies will say before eight and cannot be moved beyond it.`},
    rifle:{name:`The stalking rifle`, text:`Racked, cleaned, and lightly oiled, with one round gone from the belt. The barrel is cold and there is fresh oil on the cleaning rod.`},
    bolt:{name:`The gun-room fastenings`, text:`The door bolt is shot home. The window catch has been broken since the war and is held shut with a nail that anybody can lift from the outside in four seconds, as the ghillie does most mornings.`},
    drams:{name:`Two glasses`, text:`On the gun-room table, two whisky glasses. One drained, one hardly touched, and both wiped round the rim with a handkerchief.`},
    timber:{name:`The timber account`, text:`Four hundred and twelve pounds for standing timber off the Corrie beat in 1924, and no stumps on the Corrie beat older than this winter. Rait's hand throughout.`},
    engagement:{name:`Miss Kilgour's engagement`, text:`A ring on a chain under her blouse, and a letter from Captain Sturrock proposing they tell her father at Christmas, which they did, with results the whole glen heard.`},
    warletter:{name:`The unfinished letter`, text:`To the Military Secretary, War Office, begun on Tuesday afternoon and stopping four lines in. It concerns a field return of 14 April 1917 and asks that the original be looked out.`},
    citation:{name:`The regimental return`, text:`The April 1917 return, wired for from Perth. The man Sturrock reported as shot for cowardice was struck off the strength three days before the report that condemned him was written.`},
    sturrockbreak:{name:`Sturrock's admission`, text:`He does not argue about the boots or the stove. He says that Ranald Kilgour had known him for thirty years and gave him until Monday, and that Monday was not a kindness.`}
  },
  locations:[
    {id:'gunroom', name:`The Gun Room`, desc:`Bolted from inside. The Colonel is still where he fell.`,
     long:`Oiled steel, wet dog, peat smoke and blood. A stove in the corner, banked and long out.`,
     actions:[
      {id:'body', label:`Examine the body with Dr Menzies`, clue:'surgeon', text:`Menzies is a country doctor of thirty years and does not enjoy being contradicted by a sergeant with a clock. He takes you through the stiffening, the cold and the tea, and then says the word before, and repeats it.`},
      {id:'stove', label:`Rake out the stove`, clue:'stove', text:`Ash, peat, a boot-button, and one thing that has no business being burnt in a stove by anybody with a gun cabinet four feet away.`},
      {id:'rack', label:`Examine the rifles and the belt`, clue:'rifle', text:`A man is shot at nine o'clock and by half past the weapon is cleaned, oiled and racked. Either he did it himself, which is difficult, or somebody had a great deal more time than the story allows.`},
      {id:'fasten', label:`Test the door and window`, clue:'bolt', text:`The whole county has spent three days on this bolted door. It takes you four seconds and a penknife to make the county look foolish.`},
      {id:'table', label:`Examine the table`, clue:'drams', text:`He drank alone every evening of his life, says the household. Tuesday he did not.`},
      {id:'desk', label:`Search the gun-room desk`, text:`Game books back to 1889, a bill for cartridges, and a note to himself to speak to Fergus about the Corrie fence. Thirty-seven years of a man who wrote down everything except the one thing you want.`}
     ]},
    {id:'snow', name:`The Snow Outside the Window`, desc:`Twenty-two prints in, none out.`,
     long:`Frozen hard since Wednesday morning and roped off by a sergeant who deserves better than what you are about to do to his theory.`,
     actions:[
      {id:'prints', label:`Cast and measure the prints`, clue:'tracks', text:`You take three casts and lie on a rug in the snow for an hour with a rule. A man walking forward drives his heel in. Every one of these is deepest at the toe.`},
      {id:'drive', label:`Follow the line back to the drive`, text:`It begins at the gravel sweep, where the snow was cleared on Wednesday by a gardener acting on his own initiative and with the best of intentions. Whatever was there is in a heap by the stable and it is now water.`}
     ]},
    {id:'boots', name:`The Boot Room and Back Passage`, desc:`Where the whole household's footwear lives.`,
     long:`Forty pairs on a rack, a paraffin stove for drying, and a smell that would fell a horse.`,
     actions:[

    {id:'rait', name:`Mr Dugald Rait`, role:`Factor of the Kilnbrae estate`,

     long:`Careful, civil, and sweating very slightly in a room at four degrees.`,
     deflect:[`That will be estate business, and estate business is mine to keep.`,`I couldn't say. I'm out on the ground six days in seven.`,`You'll find everything in the ledgers, Inspector, and the ledgers are in the office.`],
     topics:[
      {id:'night', label:`Where were you at nine?`, text:`In the office with the lamp lit, doing the Martinmas rents. Nobody with me. I heard the shot and I thought it was Fergus after a beast, God forgive me, and I finished the column before I went out.`},

      {id:'guest', label:`What did you make of Captain Sturrock?`, text:`He came for a fortnight in October and he has not gone. He does not shoot, he does not fish, and he sits with the Colonel of an evening in the gun room with the door shut, and neither of them looks the better for it afterwards.`}

     confront:{
      timber:{text:`The sweating stops being slight. Four hundred and twelve pounds, and I have been eleven years on a hundred and sixty a year with a wife in a chair. He found it in November. He said I would repay it out of my wage over nine years and that we would neither of us mention it again, and I have been thanking God for that man every night since, which I do not expect you to believe now.`},

    {id:'sturrock', name:`Captain Neil Sturrock`, role:`Guest; served with the Colonel`,
     brief:`Came for a fortnight in October and has not left.`,
     long:`Easy, likeable, forty-four, and the only man in this house who has looked genuinely rested since Tuesday.`,
     deflect:[`Couldn't tell you, old man. I'm a guest here, I only know where the whisky lives.`,`He turns it over pleasantly and gives it back. Means nothing to me.`,`You'd have to ask Rait. He knows where every nail in this place is.`],
     topics:[
      {id:'night', label:`Where were you at nine?`, text:`Walking. I know how that sounds. I walk at night, I have since France, and on Tuesday I went down the drive as far as the lodge and back and got wet doing it.`},
      {id:'colonel', label:`Your evenings in the gun room`, text:`Old soldiers. We were in the same battalion from 1915 and there is a great deal of it we have never told anybody else, and rather less of it that either of us enjoyed remembering.`},
      {id:'ishbel', label:`And Miss Kilgour?`, text:`I asked her in October and she said yes, and Ranald said no, and I could not for the life of me get him to say why. I know now, of course. He was being decent about it, in his way. He was giving me until Monday to leave the country.`, hidden:'citation'}

     confront:{
      warletter:{text:`He reads four lines and hands it back without a tremor, which takes some doing. A field return. Nine years old. Written by a man of twenty-nine who had not slept in eleven days.`},
      citation:{clue:'sturrockbreak', text:`The ease goes, and what is underneath is not frightening, only very tired. Struck off three days before. Yes. I signed a report that put a boy against a wall for cowardice, and the boy had been dead in a shell hole for seventy hours when I wrote it, and I signed it because a division wanted an example and I wanted a majority. Ranald found the discrepancy in November, in his own damned box of papers. He gave me until Monday to resign my commission and write to the family myself. He called that mercy. Have you any idea what it would have been?`},
      spareboots:{text:`Then somebody wore the old man's boots. It was not me — I take a nine and he took an eleven, which any of them will tell you.`},

    {id:'nairn', name:`Mrs Bridie Nairn`, role:`Cook and housekeeper`,
     brief:`Thirty-one years at Kilnbrae. Took the Colonel his tea at six.`,
     long:`Immovable, unfrightened, and answering you with one eye on a pot that is more important than you are.`,

     topics:[
      {id:'tea', label:`When did you last see him?`, text:`Six o'clock, with his tea, in the gun room. He'd the fire going and he'd two glasses out, and I mind thinking that was a first in thirty-one years, and I mind saying nothing about it, because you didn't.`},
      {id:'shot', label:`The shot at nine`, text:`I was at the range with the girl. It came at nine or a minute after and it came from the gun room, and it was a queer flat sound, not like a rifle at all. I said so at the time and the sergeant wrote down that I heard a shot.`},
      {id:'house', label:`How was the household that week?`, text:`Wrong from the Sunday. The master white as a sheet over his papers, Miss Ishbel not speaking, Mr Rait in and out like a cat at a door, and the Captain whistling. The Captain was the only cheerful thing in this house and he had no business being it.`}
     ],
     confront:{

      surgeon:{text:`Before eight. Aye. Well. I gave that man his tea at six and he ate near none of it, and I've been thinking about that since Wednesday.`}

    {id:'todd', name:`Fergus Todd`, role:`Ghillie`,
     brief:`Poaches the estate he is paid to protect. Lifts the gun-room window most mornings.`,
     long:`Sixty-odd, monosyllabic, and quietly certain he is going to be hanged for this because men like him usually are.`,

     topics:[
      {id:'window', label:`The gun-room window`, text:`Nail's been in it since the war. I go in that way for the dog's leads at six in the morning rather than tramp round the whole house wet. The Colonel knew it fine and never said.`},
      {id:'night', label:`Where were you on Tuesday?`, text:`Up the Corrie. After a beast, if you must have it, and I'll take what's coming for that and not for the other.`},
      {id:'snow', label:`When did the snow come?`, text:`It came on at the back of half seven, and it was thick by nine, and any man in this glen will tell you the same. That's why yon footprints is nonsense. Snow that heavy fills a print in twenty minutes, and them's as sharp as the hour they were made.`}

  epilogue:[
    `On 14 April 1917 Neil Sturrock signed a report that had a boy shot for cowardice three days after that boy was already dead. Ranald Kilgour found the discrepancy in his own papers in November and spent two months trying to find a way round it, and on Tuesday afternoon he began the letter that ended it.`,

CASES.push({
  id:'peregrine',
  title:'The Drop at the Peregrine',
  tag:'The Strand, London · November 1908',
  hook:`A hundredweight of sandbag came out of the flies in the second act, in front of nine hundred people.`,
  ap:18,
  brief:[
    `At twenty to ten on Saturday, eleven minutes into the second act of The Gilded Cage, a counterweight bag fell fifty-two feet from the fly floor of the Peregrine Theatre and killed Miss Cora Vell where she stood.`,
    `Nine hundred people saw it. Not one of them saw anything useful. The flyman on that rail was not at his pins, the house was dark above the proscenium, and the company has spent three days explaining that hemp perishes and accidents happen.`,
    `Hemp does perish. It does not perish in a single clean plane three-quarters of the way through, six feet above the pin rail, which is what the Lord Chamberlain's man found on Sunday morning and what has brought you to a theatre that would very much like to reopen on Thursday.`
  ],
  clues:{
    rope:{name:`The cut line`, text:`Severed three-quarters through in one plane, six feet above the pin rail, with a keen blade drawn downward. The last quarter is torn.`},
    pinrail:{name:`The pin rail`, text:`The line was made off properly, in a correct figure of eight, by a man who has done it ten thousand times. Whatever happened, no line was let go by hand.`},
    prompt:{name:`The prompt book`, text:`Act two, page nine. Cora's mark has been moved six feet stage left in fresh pencil in Hoyt's hand, initialled and dated Saturday afternoon, and the new mark stands directly under the number four bar.`},
    ladder:{name:`The fly-floor ladder`, text:`Three days of dust on the rungs and a clean smear of it on the fourth and ninth, with a trace of blue greasepaint on the ninth, at the height of a hand.`},
    glove:{name:`A white evening glove`, text:`From the act-two costume basket. There is a nick across the palm and a single strand of hemp caught in the stitching.`},
    mortgage:{name:`The mortgage deed`, text:`Twelve hundred pounds on the Peregrine lease, dated August, signed by Sylvanus Hoyt and by Cora Vell — and her signature on it is not the signature on her contract, on her cheques, or on anything else she ever wrote.`},
    letter:{name:`Cora's letter to her solicitor`, text:`Posted Saturday morning, returned by the firm on Monday. She asks Mr Braithwaite to attend her at the theatre on Monday and to bring the lease, and she asks whether a signature may be disowned without the disowning of the man.`},
    rival:{name:`The Delamere contract`, text:`An offer from the Delamere management, unsigned: her own company, her own terms, and the rights to The Gilded Cage travelling with her, since the rights are hers.`},
    note:{name:`The note that drew the flyman away`, text:`Printed capitals on a torn strip of a call sheet: FRONT OF HOUSE WANTS YOU NOW, PREWER. Nobody in front of house sent it.`},
    prewer:{name:`Prewer's account`, text:`He left his rail at the act-two opening on the strength of the note, was nine minutes finding out that nobody wanted him, and came back to a stopped show. Sober, and able to name six people who will say so.`},
    garrity:{name:`The understudy's whereabouts`, text:`Nell Garrity was in wardrobe from the interval, standing on a box with Mrs Slack's mouth full of pins, and the two of them can account for every minute of it.`},
    hoytbreak:{name:`Hoyt's admission`, text:`He does not deny the pencil or the deed. He says the theatre took twenty-two years of his life and she was going to take it to the Delamere in a cab on Monday morning.`}
  },
  locations:[
    {id:'stage', name:`The Stage and the Mark`, desc:`Dark since Saturday. The chalk is still down.`,
     long:`A set of a drawing room in Belgravia, a working light, and a chalk cross that somebody has been careful not to sweep.`,
     actions:[
      {id:'mark', label:`Examine the chalk mark and the bar above`, text:`The cross sits six feet stage left of the wear mark her shoes have made in the boards over eleven weeks. Directly above it, fifty-two feet up, is the number four counterweight bar.`},
      {id:'bag', label:`Examine the bag and the fallen line`, clue:'rope', text:`The Lord Chamberlain's man was quite right, and he was also looking at the wrong end. The interesting end is the one still hanging.`},
      {id:'house', label:`Question the front-of-house staff`, text:`Two dressers, a fireman and a boy who sells oranges. Nine hundred people were looking at Miss Vell, and every one of the staff was looking at the nine hundred. Nobody in this building was looking up.`}
     ]},
    {id:'flies', name:`The Fly Floor and Pin Rail`, desc:`Fifty-two feet up, and dark in performance.`,
     long:`A steel gallery, a rail of belaying pins, forty lines, and a view of the stage that nobody in the audience has ever imagined existing.`,
     actions:[
      {id:'rail', label:`Examine the pins and the made-off lines`, clue:'pinrail', text:`Prewer's work is beautiful. Every line on that rail is made off the same way, and the number four is no different from the other thirty-nine.`},
      {id:'ladder', label:`Examine the ladder to the fly floor`, clue:'ladder', text:`Nobody has swept up here since the Coronation. Dust of that age keeps a record better than most witnesses.`},
      {id:'lines', label:`Test the rest of the rail`, text:`Thirty-nine other lines, every one sound, every one properly aged, several of them a good deal older than the number four. If hemp were perishing in this theatre it would not have begun with the newest rope on the rail.`}
     ]},
    {id:'prompt', name:`The Prompt Corner`, desc:`Where the book lives and every change is written down.`,
     long:`A desk, a hooded lamp, a board of cue bells, and the only complete account of what this company did every night for eleven weeks.`,
     actions:[
      {id:'book', label:`Read the prompt book`, clue:'prompt', text:`Nothing in a theatre is undocumented. Every move any actor has made since September is pencilled, initialled and dated in this book, including the last one.`},
      {id:'call', label:`Examine the call sheet and the board`, clue:'note', text:`Saturday's call sheet has a strip torn from the foot of it. The strip turns up in the stage doorkeeper's tin, where the boy who was handed it put it for safe keeping, being nine years old and conscientious.`}
     ]},
    {id:'dressing', name:`Cora Vell's Dressing Room`, desc:`Number one, stage right. Untouched.`,
     long:`Flowers going over, eleven weeks of telegrams, and a writing table that she plainly used more than the mirror.`,
     actions:[
      {id:'desk', label:`Search the writing table`, clue:'rival', text:`Under the telegrams, an offer she had not signed, and a rough note of the terms in her own hand with the figures worked twice.`},
      {id:'post', label:`Trace her Saturday post`, clue:'letter', text:`Braithwaite's clerk hands it over with visible relief. It went out on the Saturday morning collection and came back to the firm on Monday, by which time there was nobody to attend.`},
      {id:'flowers', label:`Go through the cards on the flowers`, text:`Eleven weeks of admirers, three of them alarming, all three of them accounted for at other addresses on Saturday by officers who have done the work properly. The theatre is full of people who loved her and none of them were in the flies.`}
     ]},
    {id:'office', name:`Hoyt's Office`, desc:`Over the box office, with a window onto the Strand.`,
     long:`Twenty-two years of playbills, a safe standing open, and a man who has been through his own papers before you got to them.`,
     actions:[
      {id:'safe', label:`Go through the lease and the deeds`, clue:'mortgage', text:`He has not hidden it, which is either innocence or the calculation of a man who knows a hidden thing is worse than an explained one.`},
      {id:'compare', label:`Compare the signatures`, clue:'mortgage', requires:'letter', blocked:`You want a specimen of her hand that is beyond argument — something she wrote and sent that never passed through this building.`, text:`You lay her letter beside the deed. The capital V is a different animal in each, and once you have seen it you cannot unsee it.`},
      {id:'books', label:`Examine the theatre's books`, text:`The Gilded Cage has played to eighty-one per cent for eleven weeks and the Peregrine is still losing forty pounds a week, which is the ordinary condition of the London theatre and no evidence of anything.`}
     ]},
    {id:'wardrobe', name:`Wardrobe`, desc:`Under the stage, and warm as an oven.`,
     long:`Mrs Slack has run this room since the eighties and knows what every member of this company was wearing, and doing, and thinking.`,
     actions:[
      {id:'basket', label:`Search the act-two costume baskets`, clue:'glove', text:`Everything is where it should be and cleaned to the day. One item is where it should be, and has not been cleaned, and is a pair short of a pair.`},
      {id:'pins', label:`Ask Mrs Slack about the interval`, clue:'garrity', text:`She answers before you have finished the question, having spent three days waiting for somebody to ask it about the girl.`}
     ]}
  ],
  suspects:[
    {id:'hoyt', name:`Mr Sylvanus Hoyt`, role:`Actor-manager of the Peregrine`,
     brief:`Her partner on the bill and off it. On stage in act two, six feet from her.`,
     long:`Magnificent, ruined, and playing the scene of a lifetime to an audience of one policeman.`,
     deflect:[`My dear fellow, this is a theatre. There are ten thousand objects in it and I have signed for all of them.`,`He looks at it and his face does a great deal of work. Poor Cora. Poor, poor Cora.`,`You must ask the staff. I am the last man in this building who knows how anything actually operates.`],
     topics:[
      {id:'night', label:`Where were you when it fell?`, text:`On stage, downstage right, eleven minutes into the act, with my back three-quarters to her, saying a line I have said four hundred times. I turned round because the house made a noise no house ever makes.`},
      {id:'cora', label:`How did you stand with her?`, text:`Four years, and if you want the word, use it. She made this theatre and I made her, and neither of us ever conceded the second half of that sentence.`},
      {id:'mark', label:`Why did you move her mark?`, text:`Because from the fourth row of the dress circle she was masked by the sofa on that speech, and had been for eleven weeks, and on Saturday I finally got round to it. I have moved a thousand marks. It is the one part of this business I am actually good at.`}
     ],
     confront:{
      prompt:{text:`Initialled and dated, yes, because that is how a prompt book is kept and I keep mine properly. If I had moved that mark for the reason you are thinking of, Inspector, do you imagine I should have signed my name to it?`},
      rival:{text:`The Delamere. Yes, I knew. She told me in September and she told me kindly, which was worse.`},
      ladder:{text:`Blue greasepaint. I wear blue greasepaint in act two. So does Marchmont's understudy, and so did half the company at the benefit in October, and it is on every door handle in this building.`},
      glove:{text:`One of my gloves, with a nick in it. I have four dozen gloves and they are all nicked, my dear man, they go through the mangle twice a week.`},
      note:{text:`Printed capitals. Well. That is anybody in London who can hold a pencil, and it is certainly not my hand, which you may compare with anything in that book.`},
      mortgage:{clue:'hoytbreak', text:`The performance stops, quite suddenly, like a lamp being turned out, and what is left is a tired man of fifty-six. Twelve hundred pounds in August to keep the doors open, and she would not sign, and I signed for her, and I told myself I would tell her at Christmas when we were in profit. She had it from Braithwaite's clerk on Friday. She was to see him on Monday morning and then she was going to the Delamere in a cab and taking the play with her, because the play is hers, and I should have had a forged deed, an empty theatre and fourteen years in Pentonville. Twenty-two years I have kept this house open. She was going to close it on a Monday morning between two appointments.`},
      letter:{text:`He reads it and puts it down very carefully. Whether a signature may be disowned without the disowning of the man. That is Cora entirely. She was going to give me the chance to say it first.`}
     }},
    {id:'garrity', name:`Miss Nell Garrity`, role:`Understudy to Miss Vell`,
     brief:`Went on as Lady Ardent from the Monday and has been playing to full houses since.`,
     long:`Twenty-two, and perfectly aware that she is the answer every newspaper in London has already arrived at.`,
     deflect:[`I don't know anything about the working side. I stand where I'm chalked.`,`I've been shown that already by the other one. It still means nothing to me.`,`Everybody in this theatre thinks I did it. You may as well say so out loud.`],
     topics:[
      {id:'interval', label:`Where were you in the interval?`, text:`On a box in wardrobe with Ruby Slack pinning me into the third-act dress, from the curtain of act one until they came running down. She had six pins in her mouth and I could not have got off that box for a fire.`},
      {id:'cora', label:`What was she to you?`, text:`She heard me in a hall in Camberwell and she had me in this company inside a month, and she made me learn her part properly, not the way understudies learn. And now I am playing it eight times a week and the Era says I am a discovery, and I would give the whole of it back, and nobody will ever believe that sentence for as long as I live.`},
      {id:'company', label:`How was the company that week?`, text:`Frightened. Not of anything you could name — of the way Mr Hoyt had gone quiet. He is a shouter. When a shouter stops shouting, a company knows something is wrong long before it knows what.`}
     ],
     confront:{
      garrity:{text:`Then say it in front of them, please. Say it in the green room where they can all hear you say it.`},
      rival:{text:`She was taking me with her. It is in her hand there, in the terms — the second lead. I should have been playing the Delamere at eight pounds a week instead of this theatre at three, and everybody has decided I killed her for the part I already had coming.`}
     }},
    {id:'prewer', name:`Mr Ike Prewer`, role:`Flyman on the number four rail`,
     brief:`Was not at his pins when the bag fell. Has been drinking since Sunday.`,
     long:`Thirty years in the flies of four theatres, and quite certain that he killed her by not being there.`,
     deflect:[`I was off the floor. That's the whole of me in this, and it's enough.`,`Never seen it. I don't go about the house. I go up my ladder and I come down it.`,`Ask Mr Hoyt. He'd know. He knows the working of this house better than he lets on.`],
     topics:[
      {id:'away', label:`Why did you leave the rail?`, clue:'prewer', text:`Boy come up with a note at the top of the act. Front of house wants you now, Prewer. So down I go, and there's nobody wants me, and I'm nine minutes running about that building like a fool, and I come back up and the show's stopped and there's a woman dead under my bar.`},
      {id:'rope', label:`Tell me about that line`, text:`New in September, that one. I made it off myself Saturday like I have every night since. A line don't part where that parted, not made off proper, not in a hundred years. Somebody put a knife in my rope, sir, and let the show do the rest.`},
      {id:'who', label:`Who can get to the fly floor?`, text:`Anyone as can climb a ladder in the dark and don't mind the height. Which in this company is about four people, and three of them are on the stage in act two.`}
     ],
     confront:{
      note:{text:`That's it. That's the very thing. And I've thought about that note every hour since, because if I'd stopped to ask the boy who sent it, she'd be alive and I'd be nothing but a flyman with a story.`},
      rope:{text:`Drawn down, see. You'd cut up if you was standing on the floor working at it. Drawn down like that's a man leaning over from above the rail, on the ladder, doing it quick with his arm out.`},
      prewer:{text:`Six of them will say it and I'd rather they didn't have to. Sober or drunk, I wasn't on my floor, and a woman's dead under my bar.`}
     }},
    {id:'slack', name:`Mrs Ruby Slack`, role:`Wardrobe mistress`,
     brief:`Has run wardrobe at the Peregrine since 1886.`,
     long:`Immense, unhurried, with a mouth that is usually full of pins and an eye that has been reading this company for twenty-two years.`,
     deflect:[`That's not wardrobe, dear, and if it's not wardrobe I've not looked at it.`,`She holds it at arm's length. Not mine. Nothing in this theatre's mine except the frocks.`,`I could tell you what everybody was wearing. I couldn't tell you what they were up to.`],
     topics:[
      {id:'girl', label:`Where was Miss Garrity in the interval?`, text:`On my box with six pins in her, from the act-one curtain till the screaming started, and I'll say it to a judge. That girl has been hanged in every paper in London by people who were not in my room.`},
      {id:'gloves', label:`Tell me about the act-two costumes`, text:`Everything of his goes through my hands twice a week and comes back to me clean. What came back to me on Saturday was one glove, and it was not clean, and I put it in the basket and I have been looking at it for three days.`},
      {id:'hoyt', label:`What did you make of Mr Hoyt that week?`, hidden:'glove', text:`Quiet. And he came down to my room on the Friday, which he has done perhaps four times in twenty-two years, and asked me quite pleasantly how the third-act dress was coming for the understudy. On the Friday, dear. Before anybody needed a third-act dress for an understudy.`}
     ],
     confront:{
      glove:{text:`One glove, filthy, with a cut across the palm. He gave me the other one on the Sunday and asked me to send the pair to the cleaners, and I have not sent it, because a pair is two and I have had one of them since Saturday night.`},
      ladder:{text:`Blue's his act-two colour. Hers was rose and the girl's is rose. There's one man in this house wearing blue on his hands in the second act, dear, and you have met him.`}
     }},
    {id:'marchmont', name:`Mr Aubrey Marchmont`, role:`Author of The Gilded Cage`,
     brief:`Hated the production and said so in print.`,
     long:`Thirty, aggrieved, and entirely delighted to be a suspect, which he clearly considers the most interesting thing that has ever happened to him.`,
     deflect:[`I write the words. What they do with them afterwards is a matter for the police, as it turns out.`,`He waves it away. I have no idea. I have never understood a single mechanical thing.`,`Ask Hoyt. Hoyt has an explanation for everything, all of them theatrical.`],
     topics:[
      {id:'play', label:`Your quarrel with the production`, text:`They cut four hundred lines and the whole of the third act's argument, and what is left plays to eighty-one per cent, which is the most humiliating fact of my professional life.`},
      {id:'cora', label:`And Miss Vell?`, text:`She cut them. She was quite right to and I shall never forgive her, and both of those things are entirely true.`},
      {id:'rights', label:`Who owns the play?`, text:`She did, outright, from the option in 1907 — I sold it to her for ninety pounds because I was hungry, and it has made her four thousand. On her death it goes to her estate, which is a sister in Leamington. It does not come back to me and it does not go to the theatre. I have had three days to look into that and I recommend it to you as a study in disappointment.`}
     ],
     confront:{
      rival:{text:`The Delamere, yes. She told me in September and asked whether I should like the third act put back for the new production. That is why I am standing here answering your questions instead of dancing on her grave.`},
      prompt:{text:`He moved a mark six feet on the Saturday. I have watched that man move marks for eleven weeks. He does it constantly, he does it well, and it is the only thing he does that I have never been able to sneer at.`}
     }}
  ],
  methods:[
    `A perished hemp line that parted under its own weight`,
    `The line cut nearly through, and the bag left for the show to bring down`,
    `The bag deliberately let go by hand from the pin rail`,
    `The pin drawn from the rail during the interval`,
    `The bar overloaded in the interval so that it would fail on the cue`
  ],
  motives:[
    `To take the leading part`,
    `To stop a forged signature reaching a solicitor`,
    `To keep the play from leaving for the Delamere`,
    `To avenge a butchered third act`,
    `To collect on the theatre's insurance`
  ],
  answer:{culprit:'hoyt', method:1, motive:1},
  wrongEnding:`The inquest has found misadventure, the Peregrine reopened on Thursday to the largest advance in its history, and an understudy who was on a box in wardrobe will be answering for this in every dressing room she ever works in.`,
  epilogue:[
    `Sylvanus Hoyt mortgaged the Peregrine lease in August for twelve hundred pounds and signed Cora Vell's name to the deed, because the play was hers and so, in every way that mattered, was the theatre. Braithwaite's clerk let it slip on the Friday. She wrote to her solicitor on Saturday morning and asked to see him on Monday with the lease.`,
    `That afternoon he moved her mark six feet stage left, in pencil, initialled and dated, in the prompt book — the one place in a theatre where nothing goes unrecorded, and the reason he has been believed for three days. He had moved a thousand marks. He knew exactly what stood fifty-two feet above the new one.`,
    `He sent a boy up to the flies with a torn strip of the call sheet, went up the ladder in the dark in his act-two gloves, cut three-quarters through the number four line with one drawn stroke, and was downstage right with his back three-quarters turned when the show did the rest.`,
    `He came off the ladder with a nicked glove and a strand of hemp in the stitching, and gave the other one to his wardrobe mistress on Sunday to be cleaned as a pair. Mrs Slack has been sitting on one glove for three days waiting to be asked.`
  ]
});

CASES.push({
  id:'marathon',
  title:'Four Days out of Port Said',
  tag:`SS Marathon, the Arabian Sea · October 1934`,
  hook:`A woman who never swam was found in the ship's bath at six bells. The bath is filled from the sea.`,
  ap:18,
  brief:[
    `Mrs Enid Carrow was found face down in the canvas swimming bath on the boat deck of the Marathon at six o'clock on Thursday morning, by a deck steward who had walked past the same spot at twenty to four and seen nothing.`,
    `The ship's surgeon signed accidental drowning before breakfast. He also, at your request and with poor grace, drew off what was in her lungs. It is fresh water. That bath is pumped full from the Arabian Sea every morning at a quarter past five.`,
    `There is no port until Bombay and no police until Ballard Pier, where nine hundred passengers will walk down a gangway into a city of a million people. You have the run of the ship until she berths, and not one hour after it.`
  ],
  clues:{
    freshwater:{name:`What was in her lungs`, text:`Fresh water, soft, with a trace of soap. The swimming bath is salt, pumped from over the side, and has been every morning of the voyage.`},
    filllog:{name:`The bath log`, text:`Emptied at ten each night, scrubbed, and pumped full again at 5.15 a.m. by the watch. Thursday no different. She was found in it at six.`},
    cabinbath:{name:`The bath in B-14`, text:`Mrs Carrow's own bathroom. The plug chain has been pulled clean out of its seating, the mat is sodden and has been hung back on its rail folded, and there is soap dried on the rim in a smear at the height of a shoulder.`},
    hamper:{name:`The linen hamper`, text:`Number nine, from the B-deck pantry, standing on the boat deck at half past four with its lid down. The inside of the canvas is wet through and there is a long grey hair caught in the wicker at the hinge.`},
    rounds:{name:`The quartermaster's rounds`, text:`Boat deck walked at 3.40 and reported clear. Walked again at 4.35: hamper number nine standing by the bath housing, which he noted and did not move, it being not his department.`},
    pursercopy:{name:`The Port Said query`, text:`A wire handed in by Mrs Carrow at Port Said, prepaid reply, addressed to a firm of enquiry agents in Chancery Lane, asking for the marriage record of one Beryl Onslow.`},
    wire:{name:`The reply from London`, text:`Received 11.20 p.m. Wednesday and placed in her hand by the wireless boy at half past. ONSLOW MARRIED FRASCATI ROME OCTOBER 1931 CERTIFICATE HELD.`},
    lists:{name:`Three passenger lists`, text:`Marseille to Bombay in 1932, Tilbury to Colombo in 1933, and this voyage. Onslow and Frascati in adjoining cabins on all three, under four names between them, never once travelling as married.`},
    winnings:{name:`The smoking-room steward's account`, text:`Something over nine hundred pounds to Signor Frascati across four voyages, always at the same table, always after the same young lady has made the introductions and gone early to bed.`},
    keyboard:{name:`The pass-key board`, text:`B-deck pantry. Eleven hooks, eleven keys, and the board is checked at midnight and at six. On Thursday at six the B-14 pass key was on the wrong hook.`},
    gown:{name:`A damp dressing gown`, text:`Hanging behind the door of C-9, still heavy at the hem at nine in the morning, smelling of soap and of nothing whatever of the sea.`},
    masterletter:{name:`Her note to the Master`, text:`Written Wednesday night, unsent, in the blotter of B-14. She asks Captain Havelock for a private half-hour at nine on Thursday morning on a matter she would rather not put in writing before Bombay.`},
    frascati:{name:`Frascati's account`, text:`He gives up the marriage, the four names and the nine hundred pounds within a minute of being shown the lists, and then stops dead, and will not say one word about Wednesday night.`},
    beryl:{name:`Miss Onslow's admission`, text:`She does not argue about the wire. She says that at Bombay there would have been a police launch and a magistrate, and that a woman of twenty-six with a Rome certificate and four names does not walk away from that.`}
  },
  locations:[
    {id:'bath', name:`The Swimming Bath, Boat Deck`, desc:`Canvas and steel, forward of the second funnel.`,
     long:`Sixteen feet by nine, roped off since six, with the morning's salt water still in it and the ship's officers standing about looking at anything else.`,
     actions:[
      {id:'body', label:`Have the surgeon draw off the lungs`, clue:'freshwater', text:`Dr Kaye does it under protest, in front of the master, and goes very quiet indeed at the result.`},
      {id:'log', label:`Read the bath log`, clue:'filllog', text:`Kept by the watch in pencil, initialled every morning, and never once in the history of the P&O intended to matter.`},
      {id:'rail', label:`Examine the rail and the housing`, text:`Fresh white paint from Tuesday, unmarked; a coil of new rope; and the whole of the boat deck holystoned at five as it is every day of the year. If there was ever anything here to find, the ship's own routine has scrubbed it away.`}
     ]},
    {id:'suite', name:`Mrs Carrow's Suite, B-14`, desc:`Locked since the morning, at your order.`,
     long:`A sitting room, a bedroom, a private bathroom, and eleven trunks belonging to a widow who has crossed this water fourteen times.`,
     actions:[
      {id:'bathroom', label:`Examine her bathroom`, clue:'cabinbath', text:`The bath is dry now and it has been dried. What cannot be dried is the seating of a plug chain, or a folded mat that was folded wet.`},
      {id:'blotter', label:`Search the writing desk`, clue:'masterletter', text:`Under the ship's stationery, one sheet written in a firm hand at some time after eleven on Wednesday night.`},
      {id:'trunks', label:`Go through the trunks`, text:`Fourteen crossings' worth of a comfortable life: dinner dresses, a dressing case, a photograph of a husband dead in 1929, and four hundred pounds in notes untouched in a jewel drawer that anybody could have opened with a hairpin.`}
     ]},
    {id:'cabin', name:`Miss Onslow's Cabin, C-9`, desc:`One deck below, and three doors from Signor Frascati.`,
     long:`Small, neat, and belonging to somebody who travels a good deal more lightly than her aunt.`,
     actions:[
      {id:'gown', label:`Examine what is hanging behind the door`, clue:'gown', text:`Everything else in this cabin is dry, pressed and put away. One thing is not.`},
      {id:'papers', label:`Search her papers`, text:`A passport, a letter of credit for sixty pounds, and eleven letters from a young man in Poona that are exactly what they appear to be. Whatever this cabin is hiding, it is not hiding it in writing.`}
     ]},
    {id:'purser', name:`The Purser's Office and Wireless Room`, desc:`Every wire, every list, every name on board.`,
     long:`Two clerks, a Marconi operator who has been awake since four, and a filing system that is the only complete history of anybody at sea.`,
     actions:[
      {id:'filed', label:`Go through the outgoing wires from Port Said`, clue:'pursercopy', text:`Six hundred passengers and a hundred and nine wires from Port Said, and the ninety-first of them was handed in by a woman who is now dead.`},
      {id:'reply', label:`Find the prepaid reply`, clue:'wire', hidden:'pursercopy', text:`The Marconi boy remembers taking it down, remembers the hour, and remembers that the lady read it standing in the alleyway and then thanked him and asked what time the Master breakfasted.`},
      {id:'lists', label:`Compare the old passenger lists`, clue:'lists', text:`The company keeps them for seven years. It takes you two hours and a clerk who would rather be doing anything else, and it is the best two hours you spend on this ship.`}
     ]},
    {id:'smoking', name:`The First-Class Smoking Room`, desc:`Where the money changes hands after ten.`,
     long:`Leather, brass, a fiddle-rail on every table, and a steward who has watched four voyages of this and said nothing because saying something is not what a steward is for.`,
     actions:[
      {id:'steward', label:`Get the steward to talk`, clue:'winnings', text:`It takes twenty minutes and the assurance that he will not be asked to say it in front of the company. Then it comes out in one long sentence, as though he has been holding it since 1932.`},
      {id:'tables', label:`Examine the cards and the table`, text:`Two sealed company packs, a shoe, and a table that has been played on honestly and dishonestly for eleven years without keeping any record of either.`}
     ]},
    {id:'pantry', name:`The B-Deck Pantry and Linen Room`, desc:`Hampers, pass keys, and the night watch's book.`,
     long:`Hot, narrow, smelling of starch, and rather better documented than the first-class passengers would believe.`,
     actions:[
      {id:'hamper', label:`Examine the linen hampers`, clue:'hamper', text:`Eleven of them, ten bone dry. The eleventh has been emptied, wiped over and stood back in line, by somebody who did not think about the wicker at the hinge.`},
      {id:'keys', label:`Check the pass-key board`, clue:'keyboard', text:`Checked at midnight and at six, initialled both times, by two different men who each assumed the other had put it back wrong.`},
      {id:'rounds', label:`Read the quartermaster's night book`, clue:'rounds', text:`He walks the boat deck every fifty-five minutes and writes down what he sees, including a hamper standing where no hamper should stand, because he was brought up in a service where you write everything down and complain later.`}
     ]}
  ],
  suspects:[
    {id:'renn', name:`Mr Julius Renn`, role:`Mrs Carrow's secretary`,
     brief:`Nine years in her employ. Handles her drafts, her tickets and her correspondence.`,
     long:`Grey, precise, and sweating in a manner he would like you to attribute to the Arabian Sea.`,
     deflect:[`I keep her papers, Inspector. I do not keep her confidences.`,`He examines it carefully, which is his habit with everything. I could not say.`,`You would do better with the young lady. I was never told anything at all.`],
     topics:[
      {id:'position', label:`What exactly is your position?`, text:`I have signed for her, travelled for her and been rude to her creditors for her since 1925, on four hundred a year and a cabin on C deck, and I am forty-eight.`},
      {id:'night', label:`Where were you on Wednesday night?`, text:`In the smoking room until half past eleven, and then in my cabin. Nobody saw me go to it and nobody saw me stay in it, which I understand is the usual difficulty.`},
      {id:'bombay', label:`What was her business in Bombay?`, text:`Two properties in Colaba and a solicitor she distrusted. Nothing that anybody could possibly want her dead for, unless you count solicitors.`}
     ],
     confront:{
      masterletter:{text:`His face when he reads it is the most honest thing he has done in nine years. A private half-hour with the Master. I have taken two hundred and eleven pounds off her in false drafts across three years and I have been waiting three days for you to say so, and I would have gone to prison for it gladly rather than have you look at me like that. I did not touch her. I have never in my life touched anybody.`},
      wire:{text:`Beryl? Beryl and the Italian? He sits down without being asked. Oh, the poor woman. She spent two years introducing that man to every card table between here and Tilbury and thinking she had done the girl a kindness.`}
     }},
    {id:'beryl', name:`Miss Beryl Onslow`, role:`Her niece and companion`,
     brief:`Twenty-six. Travelling to Bombay to be married, by her own account.`,
     long:`Pleasant, easy, immaculate at nine in the morning after a night in which somebody drowned, and the only person on this ship who has asked you no questions at all.`,
     deflect:[`I'm afraid I've no idea. Aunt Enid didn't tell me things, she announced them.`,`She looks at it with polite interest and hands it back. Should that mean something to me?`,`Do ask Mr Renn. He knew all her business and I knew none of it.`],
     topics:[
      {id:'aunt', label:`What was she to you?`, text:`My mother's sister, and she has kept me since I was nineteen, and I have earned it. Do you know what a companion does? She listens. Fourteen crossings of listening.`},
      {id:'night', label:`Where were you on Wednesday night?`, text:`I read to her until eleven and went down to my cabin. She was perfectly well and perfectly disagreeable, as she was every night of her life.`},
      {id:'bombay', label:`And your marriage at Bombay?`, text:`A Mr Lyall of the Public Works Department. Aunt Enid did not approve, but then Aunt Enid did not approve of anything that would have taken me out of that suite.`}
     ],
     confront:{
      gown:{text:`I had a bath. On a ship, in the Arabian Sea, in October. I should think half the passengers had one.`},
      cabinbath:{text:`Her bathroom is her bathroom. I have run that bath for her four hundred times and I have pulled that chain out of the wall myself before now, it is a ship's fitting and it is loose.`},
      keyboard:{text:`I have a pass key of my own for her suite. She gave it to me in 1932 so she should not have to get up to let me in. Do check with the purser.`},
      hamper:{text:`Something in the composure moves, very slightly, and settles again. A hamper on the boat deck. Yes. Well. That is where hampers go, isn't it, at that hour.`},
      wire:{text:`She reads it once and does not put it down. She wired Chancery Lane from Port Said. She had four days to say it to me and she never said one word.`},
      frascati:{clue:'beryl', text:`When she speaks again the pleasantness is entirely gone and what is left is much younger and a great deal harder. Emilio talks. He has always talked. Yes — Rome, 1931, and I have made the introductions in first class on four ships since, and it is the only trade I have. She had it in her hand at half past eleven on Wednesday and she told me, in that suite, that at Bombay there would be a launch and a magistrate and that she would see me got a fair hearing. A fair hearing. I ran her a bath every night of my life for seven years, Inspector. It is the one thing I know how to do without thinking about it at all.`}
     }},
    {id:'kaye', name:`Dr Anstruther Kaye`, role:`Ship's surgeon`,
     brief:`Signed accidental drowning before breakfast.`,
     long:`Thirty-eight, capable, and furious with himself in a way that is doing him more credit than his certificate did.`,
     deflect:[`I am the surgeon, not the master-at-arms. Ask me about the body.`,`Not medical. I can tell you nothing about it.`,`I have four hundred passengers with sunstroke and a stoker with a crushed hand. Be quick with me.`],
     topics:[
      {id:'certificate', label:`Why did you certify accident?`, text:`Because a woman was in a swimming bath and had water in her. In eleven years at sea I have certified nine drownings and every one of them was exactly what it looked like, and I shall be hearing about this one for the rest of my career.`},
      {id:'water', label:`Explain the fresh water`, text:`Drowning in fresh and drowning in salt are two different deaths and always have been. She did not take one mouthful of that bath. She was dead before she came near it and she was drowned in something soft and soapy, which on this ship means a cabin bath and nothing else.`},
      {id:'body', label:`What else does the body tell you?`, text:`Bruising above both elbows, front and back, of the sort you get from being gripped hard by somebody standing over you, and a woman of sixty-one with a weak heart who would not have needed much holding at all.`}
     ],
     confront:{
      freshwater:{text:`My own analysis, condemning my own certificate. You may put that in your report and I hope you do.`},
      cabinbath:{text:`Soap on the rim at shoulder height. That is where the water goes when somebody is held down in it and comes up once.`}
     }},
    {id:'frascati', name:`Signor Emilio Frascati`, role:`A gentleman travelling for his health`,
     brief:`Cabin C-12, three doors from Miss Onslow. Plays cards after ten.`,
     long:`Charming, tanned, forty, and wearing a dinner jacket at ten in the morning because he has not been to bed.`,
     deflect:[`I am a passenger. I play a little bridge. This is the whole of my life at sea.`,`He spreads his hands. Signore, I have never seen this thing.`,`You must ask the young lady. The young ladies always know more than we do.`],
     topics:[
      {id:'voyages', label:`How many times have you made this passage?`, text:`Four, five. I am not well and the sea agrees with me. You will find I am on no list you have of dishonest men, because I have never once been caught, which I say to you as a compliment to your predecessors.`},
      {id:'tables', label:`Tell me about the card table`, text:`I win. I win at a rate that is remarkable and not impossible, and that is a very careful sentence and I have had eleven years to compose it.`},
      {id:'onslow', label:`And Miss Onslow?`, text:`A charming girl. I am introduced to her aunt's friends and I am grateful for it. That is all, and please observe that I have not smiled while saying it.`}
     ],
     confront:{
      lists:{clue:'frascati', text:`He looks at three passenger lists for a long moment and then laughs, once, with real appreciation. Bene. Rome, October 1931, at Santa Maria in Trastevere, and there is a certificate and you have found the record of it. Four names, nine hundred pounds, four ships. Write it all down.` + '\u0020' + `And then he stops, and the charm goes off him like a coat. About Wednesday night I say nothing. Nothing at all, signore. Not one word.`},
      winnings:{text:`Nine hundred and eleven pounds, and the steward has undercounted. I shall not dispute a figure with a man who has been so accurate.`},
      wire:{text:`So she knew. He is quiet a while. She was not a kind woman but she was not a cruel one either, and she gave that girl seven years of a roof. It is a great pity she found out on a ship.`}
     }},
    {id:'padgett', name:`Mr Hollis Padgett`, role:`Deck steward`,
     brief:`Walked the boat deck at 3.40 and found her at six.`,
     long:`Twenty-two years with the company, badly shaken, and answering you with the exactness of a man who has already been over it four hundred times in his head.`,
     deflect:[`Not my part of the ship, sir.`,`I've not seen that and I'd not touch it.`,`The pantry would know. They know everything below and half of what's above.`],
     topics:[
      {id:'found', label:`Describe finding her`, text:`Six o'clock, laying out the chairs. She was face down at the shallow end in her nightgown with her hair spread out, and there was not one thing disturbed about that bath, sir. Not a chair, not a rope, not a splash on the deck. That's what I keep coming back to.`},
      {id:'deck', label:`The boat deck at night`, text:`Empty from midnight. The quartermaster walks it every hour and I turn out at half five. Nobody goes up there in October, sir, it blows too hard.`},
      {id:'hampers', label:`What are hampers doing on the boat deck?`, text:`Nothing, sir. Nothing at all. They go up the after well and never past the second funnel, and if I'd seen one at half three I'd have moved it, and I never saw one at half three.`}
     ],
     confront:{
      hamper:{text:`Number nine. That's B-deck pantry, sir, and it has no business forward of the funnel at any hour of any day, and it was not there when I walked at twenty to four, and I will say that in any court you like.`},
      rounds:{text:`The quartermaster's a better witness than me and he writes it down as he goes. Clear at twenty to four. Hamper at five and thirty. That's your hour, sir, and there's only the one deck it came up by.`}
     }}
  ],
  methods:[
    `Struck on the boat deck and put into the swimming bath`,
    `Drowned in the fresh water of her own bathroom and carried up`,
    `Drowned in the swimming bath where she was found`,
    `Poisoned, and the bath arranged to explain it`,
    `Put over the side and washed back aboard`
  ],
  motives:[
    `To conceal the forging of her drafts`,
    `To stop a handing-over to the police at Bombay`,
    `To inherit her estate`,
    `To cancel a gambling debt owed to her`,
    `To prevent a marriage she had forbidden`
  ],
  answer:{culprit:'beryl', method:1, motive:1},
  wrongEnding:`The Marathon berthed at Ballard Pier on Saturday and nine hundred people went down the gangway into Bombay. The company has recorded an accidental drowning, and a young woman and an Italian gentleman sailed for Colombo on the twelfth in adjoining cabins under two more names.`,
  epilogue:[
    `Enid Carrow wired Chancery Lane from Port Said because she had begun, after two years and four ships, to wonder why her niece's charming Italian acquaintance always won. The prepaid reply reached her at half past eleven on Wednesday night: Onslow married Frascati, Rome, 1931.`,
    `She did what a decent, hard, unimaginative woman does. She told the girl to her face, in the suite, and wrote to the Master asking for half an hour at nine.`,
    `Beryl Onslow had run that bath every night for seven years. She held her aunt in it, dried the bath, folded the wet mat back onto its rail, and went down to the B-deck pantry for hamper number nine and a pass key that she put back on the wrong hook at some time after four in the morning.`,
    `She carried her up to the boat deck between the quartermaster's rounds and waited, somewhere out of the wind, until the watch pumped the bath full of the Arabian Sea at a quarter past five. She had thought about the salt water. She had not thought about the fresh.`
  ]
});

CASES.push({
  id:'ranipur',
  title:'The Mirrors of Ranipur',
  tag:`Ranipur State, Rajputana · March 1937`,
  hook:`The only witness saw the blow struck with the left hand. He was looking at a mirror.`,
  ap:18,
  brief:[
    `Rajkumar Bhairav Singh, younger brother of the Maharaja of Ranipur and the man who turned half the old palace into the Ranipur Palace Hotel, was found in the Sheesh Mahal at midnight on the night of the spring durbar, killed with a ceremonial katar from the palace armoury.`,
    `The State police have a witness and an arrest. Ghansham, a bearer, is in the guardroom because Nathu Lal, the shehnai player in the musicians' gallery, saw the blow struck with the left hand by a man in the household's green, standing at the west arch. Ghansham is left-handed and wears green.`,
    `The Rajkumar's brother is in Europe. The Resident's office would like a name before the Maharaja's train reaches Delhi on Friday, and the State police would like the one they already have.`
  ],
  clues:{
    wound:{name:`The wound`, text:`One thrust, driven downward and inward under the collarbone, from the victim's right and from above his shoulder line. The Rajkumar stood five foot eleven.`},
    katar:{name:`The katar`, text:`Seventeenth-century, from the armoury case, and the case is unforced and its lock unmarked. Three keys exist. On the grip, worked into the binding, a smell of khus.`},
    statement:{name:`Nathu Lal's statement`, text:`From the gallery he saw a figure in household green step to the Rajkumar, strike once with the left hand, and go out by the west arch. He is sixty, he has played in that hall for forty years, and he has not changed one word of it.`},
    mirrors:{name:`The sightline from the gallery`, text:`You stand where he stood. The gallery screen looks onto the mirrored west wall and onto nothing else — the floor of the hall is not visible from it at any point. Everything he saw, he saw in glass.`},

    accounts:{name:`The hotel accounts`, text:`Eleven hundred rupees a month across two years, moving out of the hotel's kitchen account and into a Bombay bank in the name of A. Crake, entered by a bookkeeper who has queried it in the margin nineteen times.`},

    iris:{name:`Mrs Boyce-Lynn's account`, text:`She sat on the terrace facing the Sheesh Mahal from eleven until the noise began, and in that hour precisely two people crossed the lit court: the Rajkumar, going in, and one other, going in after him, from the zenana side.`},
    devyani:{name:`The Rani Sahiba's admission`, text:`She does not dispute the register or the attar. She says the entry was never made because a clerk at Nathdwara was paid not to make it in 1919, by people long dead, for reasons that were nothing to do with her.`}
