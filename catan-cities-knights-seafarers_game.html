};

ACTIONS.knights = () => {
  const p = cur();
  const list = knightsOf(p);
  const ready = list.filter(x => knightCanAct(p, x));
  chooseOption("Knights", "You have " + list.length + " knight" + (list.length === 1 ? "" : "s") + " on the board.", [
    { label: "Hire a knight", sub: costText(COST.knight) + " · basic knights on board: " + knightCounts(p)[1] + "/2", value: "hire",
      disabled: !canPay(p, COST.knight) || knightCounts(p)[1] >= 2 },
    { label: "Activate a knight", sub: costText(COST.activate) + " · " + list.filter(x => !x.k.active).length + " idle", value: "act",
      disabled: !canPay(p, COST.activate) || !list.filter(x => !x.k.active).length },
    { label: "Promote a knight", sub: costText(COST.promote) + (p.imp.politics < 3 ? " · Fortress needed for mighty knights" : ""), value: "promote",
      disabled: !canPay(p, COST.promote) },
    { label: "Take a knight action", sub: ready.length + " knight" + (ready.length === 1 ? "" : "s") + " ready to move, displace or chase the robber", value: "use",
      disabled: !ready.length }
  ], v => {
    if (v === "hire") actBuildKnight();
    else if (v === "act") actActivateKnight(false);
    else if (v === "promote") actPromoteKnight(false);
    else actKnightAction();
  });
};

ACTIONS.cards = () => {
  const p = cur();
  if (isCK()) {
    if (!p.prog.length) { toast("You hold no progress cards."); return; }
    chooseOption("Progress cards", "Play as many as you like on your turn.",
      p.prog.map((c, i) => ({
        label: PROG[c].title,
        sub: PROG[c].text +
          (c === "alchemist" && G.phase !== "roll" ? " — only playable before you roll." : "") +
          (c === "bishop" && !G.barbAttacked ? " — the robber is frozen until the barbarians land." : ""),
        value: i, deck: PROG[c].deck,
        disabled: (c === "alchemist" && G.phase !== "roll") || (c === "bishop" && !G.barbAttacked)
      })),
      i => { if (p.prog[i] === "alchemist") playAlchemist(i); else playProgress(i); });
  } else {
    if (p.devPlayedThisTurn) { toast("Only one development card per turn."); return; }
    const pd = playableDev(p);
    if (!pd.length) {
      const vpN = p.dev.filter(d => d === "vp").length;
      const fresh = p.devBoughtThisTurn.length;
      toast(!p.dev.length ? "You hold no development cards."
        : fresh ? "Cards bought this turn cannot be played until your next turn."
        : vpN ? "Victory point cards stay hidden and are never played."
        : "Nothing to play right now.");
      return;
    }
    const counts = {};
    pd.forEach(c => { counts[c] = (counts[c] || 0) + 1; });
    chooseOption("Development cards", "One per turn, at any point during your turn.",
      Object.keys(counts).map(c => ({
        label: DEV_INFO[c].title + (counts[c] > 1 ? " ×" + counts[c] : ""),
        sub: DEV_INFO[c].text, value: c, deck: "dev"
      })),
      c => playDev(c));
  }
};

/* ---------- trading ---------- */
ACTIONS.bank = () => {
  const p = cur();
  const rate = tradeRates(p);
  const goods = isCK() ? ALLCARDS : RES;
  const give = goods.filter(k => hasCard(p, k) >= rate[k]);
  if (!give.length) { toast("Nothing in hand reaches a trade ratio yet."); return; }
  chooseOption("Trade with the bank", "Your best ratios, ports and abilities included.",
    give.map(k => ({ label: "Give " + rate[k] + " " + k, sub: "You hold " + hasCard(p, k), value: k })),
    k => {
      const want = goods.filter(x => x !== k);
      pickCards("Trade with the bank", "Take one in exchange for " + rate[k] + " " + k + ".", want, 1, sel => {
        addCard(p, k, -rate[k]);
        addCard(p, sel[0], 1);
        note(p.name + " trades " + rate[k] + " " + k + " for 1 " + sel[0] + ".");
        render();
      });
    });
};

ACTIONS.swap = () => {
  const p = cur();
  const others = G.players.filter(o => o.id !== p.id).map(o => o.id);
  choosePlayer("Trade with a player", "Settle the deal out loud, then record it here.", others, oid => {
    const o = G.players[oid];
    const give = {}, get = {};
    ALLCARDS.forEach(k => { give[k] = 0; get[k] = 0; });
    const goods = isCK() ? ALLCARDS : RES;
    const draw = () => {
      const row = (k, obj, who, tag) =>
        '<div class="counter"><span class="lab"><span class="dot" style="width:11px;height:11px;border-radius:2px;background:' +
        CARDCOLOR[k] + '"></span>' + cap(k) + ' <span class="muted">(' + hasCard(who, k) + ")</span></span>" +
        '<span class="stepper"><button data-m="' + tag + "|" + k + '">−</button><span>' + obj[k] +
        '</span><button data-p="' + tag + "|" + k + '">+</button></span></div>';
      openModal(
        "<h2>Trade with " + esc(o.name) + '</h2><div class="body">' +
        '<p class="eyebrow" style="color:var(--brown-2)">YOU GIVE</p>' + goods.map(k => row(k, give, p, "g")).join("") +
        '<p class="eyebrow" style="color:var(--brown-2);margin-top:12px">YOU RECEIVE</p>' + goods.map(k => row(k, get, o, "r")).join("") +
        "</div>" +
        '<div class="foot"><button class="btn" id="cx">Cancel</button><button class="btn primary" id="ok">Complete the trade</button></div>',
        m => {
          m.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
            const [tag, k] = b.dataset.p.split("|");
            const obj = tag === "g" ? give : get, who = tag === "g" ? p : o;
            if (obj[k] < hasCard(who, k)) { obj[k]++; draw(); }
          }));
          m.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
            const [tag, k] = b.dataset.m.split("|");
            const obj = tag === "g" ? give : get;
            if (obj[k] > 0) { obj[k]--; draw(); }
          }));
          m.querySelector("#cx").addEventListener("click", () => { closeModal(); render(); });
          m.querySelector("#ok").addEventListener("click", () => {
            const gTot = sum(ALLCARDS.map(k => give[k])), rTot = sum(ALLCARDS.map(k => get[k]));
            if (!gTot && !rTot) { toast("Set what changes hands first."); return; }
            if (isAI(o)) {
              const refuse = aiAcceptsTrade(o, give, get);
              if (refuse) { toast(o.name + " declines — " + refuse + "."); return; }
            }
            ALLCARDS.forEach(k => {
              if (give[k]) { addCard(p, k, -give[k]); addCard(o, k, give[k]); }
              if (get[k]) { addCard(o, k, -get[k]); addCard(p, k, get[k]); }
            });
            const fmt = obj => ALLCARDS.filter(k => obj[k]).map(k => obj[k] + " " + k).join(", ") || "nothing";
            note(p.name + " trades " + fmt(give) + " to " + o.name + " for " + fmt(get) + ".");
            if (isAI(o)) toast(o.name + " accepts the trade.");
            closeModal();
            render();
          });
        });
    };
    draw();
  });
};

      '<div class="seg"><button id="m1" class="' + (setupChoice.mode === "base" ? "on" : "") + '">Base Catan · 10 VP</button>' +
      '<button id="m2" class="' + (setupChoice.mode === "ck" ? "on" : "") + '">Cities &amp; Knights · 13 VP</button>' +

      '<div class="seg"><button id="p3" class="' + (setupChoice.count === 3 ? "on" : "") + '">3 players</button>' +
      '<button id="p4" class="' + (setupChoice.count === 4 ? "on" : "") + '">4 players</button></div>' +
      '<div class="setup-grid">' + seats + "</div>" +
      '<p class="muted">' +
      (humans === 0 ? "All seats are bots — the game will play itself while you watch."
        : humans === 1 ? "Solo game: you against " + (setupChoice.count - 1) + " bots."
        : humans + " people share this screen; pass it when the prompt names someone else.") +
      " Catan needs 3 players, so fill the spare seats with bots to play alone.</p>" +
      "</div>" +
      '<div class="foot"><button class="btn primary" id="go">Deal the board</button></div>',
      m => {
        const save = () => { for (let i = 0; i < setupChoice.count; i++) setupChoice.names[i] = m.querySelector("#nm" + i).value; };
        m.querySelector("#m1").addEventListener("click", () => { save(); setupChoice.mode = "base"; draw(); });
        m.querySelector("#m2").addEventListener("click", () => { save(); setupChoice.mode = "ck"; draw(); });
        m.querySelector("#m3").addEventListener("click", () => { save(); setupChoice.mode = "sf"; draw(); });
        m.querySelector("#p3").addEventListener("click", () => { save(); setupChoice.count = 3; draw(); });
        m.querySelector("#p4").addEventListener("click", () => { save(); setupChoice.count = 4; draw(); });
        m.querySelectorAll("[data-seat]").forEach(b => b.addEventListener("click", () => {
          save();
          setupChoice.ai[+b.dataset.seat] = b.dataset.ai === "1";
          draw();
        }));
        m.querySelector("#go").addEventListener("click", () => {
          save();
          closeModal();
          startGame(setupChoice.mode, setupChoice.count,
            setupChoice.names.slice(0, setupChoice.count), setupChoice.ai.slice(0, setupChoice.count));
        });
      });
  };
  draw();
}

function startGame(mode, count, names, ais) {
  G.mode = mode;
  G.target = mode === "ck" ? 13 : mode === "sf" ? 14 : 10;
  G.players = [];
  for (let i = 0; i < count; i++) {
    const bot = !!(ais && ais[i]);
    const fallback = bot ? PLAYER_COLORS[i].name + " Bot" : PLAYER_COLORS[i].name;
    const pl = makePlayer(i, (names[i] || "").trim() || fallback);
    pl.ai = bot;
    pl.aiTrades = 0;
    G.players.push(pl);
  }
  G.geo = makeBoard(mode);
  G.robber = G.geo.hexes.findIndex(h => h.type === "desert");
  G.pirate = mode === "sf" ? G.geo.pirateStart : null;
  G.merchantHex = null; G.merchantOwner = null;
  G.dev = shuffle(DEV_BAG.slice());
  G.progDecks = { trade: [], politics: [], science: [] };
  Object.keys(PROG).forEach(k => {
    for (let i = 0; i < PROG[k].n; i++) G.progDecks[PROG[k].deck].push(k);
  });
  TRACKS.forEach(t => shuffle(G.progDecks[t]));
  G.barb = 0; G.barbAttacked = false;
  G.dice = [null, null]; G.eventDie = null;
  G.longestRoad = null; G.largestArmy = null;
  G.winner = null; G.log = []; G.aiSteps = 0; G.modalOpen = false;
  note(mode === "ck" ? "Cities & Knights — first to 13 points."
    : mode === "sf" ? "Seafarers, heading for new shores — first to 14 points."
    : "Catan — first to 10 points.", "hi");
  note("Place a settlement and a road each, then in reverse order " +
    (mode === "ck" ? "a city and a road." : "a second settlement and road."));
  if (mode === "sf") {
    note("Opening pieces go on the home island. A coastal link may be laid as a road or launched as a ship.");
    note("Two points wait on each smaller island for whoever settles it first.");
  }
  beginSetup();
}

/* ============================================================
   Computer opponents
   ============================================================ */

const AICFG = { delay: 480, maxStepsPerTurn: 70 };

function isAI(p) { return !!(p && p.ai); }
function pendingActor() {
  if (!G.pending) return null;
  return G.pending.actor !== undefined && G.pending.actor !== null ? G.pending.actor : G.cur;
}

/* baseline worth of each good to a bot */
const AI_VAL = { grain: 1.20, ore: 1.15, brick: 1.05, lumber: 1.00, wool: 0.95, paper: 1.25, cloth: 1.25, coin: 1.25 };
const pips = n => (n === null || n === undefined ? 0 : 6 - Math.abs(7 - n));

function bestOf(list, score) {
  let best = null, bestS = -Infinity;
  list.forEach(x => { const s = score(x); if (s > bestS) { bestS = s; best = x; } });
  return best;
}

/* ---------- board evaluation ---------- */
function vertexScore(vid) {
  const v = G.geo.vertices[vid];
  let s = 0;
  const kinds = {};
  v.hexes.forEach(hid => {
    const h = G.geo.hexes[hid], t = TERRAIN[h.type];
    if (t.gold) { s += pips(h.num) * 1.6; kinds.gold = 1; return; }
    if (!t.res) return;
    const w = pips(h.num);
    s += w * (AI_VAL[t.res] || 1);
    kinds[t.res] = 1;
    if (isCK() && t.com) s += w * 0.4;              // commodity land pays off once cities go up
  });
  s += Object.keys(kinds).length * 1.7;             // spread beats concentration
  if (v.port) s += v.port === "any" ? 1.1 : 1.7;
  if (isSF() && v.hexes.some(hid => {
    const h = G.geo.hexes[hid];
    return !h.water && h.island !== G.geo.mainIsland;
  })) s += 9;                                       // two points for landing there first
  return s;
}

/* ---------- seafaring ---------- */
function aiOtherIslands() {
  return G.geo.hexes.filter(h => !h.water && h.island !== G.geo.mainIsland);
}

function aiBestShip(p, spots) {
  const isles = aiOtherIslands();
  return bestOf(spots, eid => {
    const e = G.geo.edges[eid];
    let s = Math.random() * 0.5;
    [e.a, e.b].forEach(vid => {
      const v = G.geo.vertices[vid];
      if (vertexOnLand(v) && vertexOpen(vid) && !v.knight) s += vertexScore(vid) * 0.8;
    });
    if (isles.length) {
      const d = Math.min.apply(null, isles.map(h => Math.hypot(e.x - h.x, e.y - h.y)));
      s += Math.max(0, 300 - d) / 24;               // keep the prow pointed at open land
    }
    return s;
  });
}

function aiPirateHex(p, allowed) {
  return bestOf(allowed, hid => {
    let s = Math.random() * 0.4, mine = false;
    G.geo.hexes[hid].edges.forEach(eid => {
      const e = G.geo.edges[eid];
      if (e.road === null || !e.ship) return;
      if (e.road === p.id) mine = true;
      else s += 3 + (handCount(G.players[e.road]) > 3 ? 2 : 0);
    });
    if (mine) s -= 40;
    return s;
  });
}

function aiPickRaider(p, items) {
  const enemyShips = G.geo.edges.filter(e => e.road !== null && e.ship && e.road !== p.id).length;
  const want = enemyShips >= 2 && Math.random() < 0.45 ? "p" : "r";
  const hit = items.filter(i => i.value === want)[0];
  return hit ? hit.value : items[0].value;
}

function aiBestSettlement(p, spots) {
  return bestOf(spots, vid => vertexScore(vid) + Math.random() * 0.6);
}

function aiBestRoad(p, spots) {
  return bestOf(spots, eid => {
    const e = G.geo.edges[eid];
    let s = Math.random() * 0.4;
    [e.a, e.b].forEach(vid => {
      const v = G.geo.vertices[vid];
      if (vertexOpen(vid) && !v.knight) s += vertexScore(vid) * 0.6;
      v.adj.forEach(a => { if (vertexOpen(a)) s += vertexScore(a) * 0.18; });
    });
    return s;
  });
}

function aiRobberHex(p, allowed) {
  return bestOf(allowed, hid => {
    const h = G.geo.hexes[hid];
    let s = 0, mine = false;
    h.vertices.forEach(vid => {
      const v = G.geo.vertices[vid];
      if (!v.building) return;
      if (v.building.p === p.id) { mine = true; return; }
      const o = G.players[v.building.p];
      s += pips(h.num) * (v.building.type === "city" ? 2 : 1) * (1 + 0.18 * publicVP(o));
      if (handCount(o) > 3) s += 2;
    });
    if (mine) s -= 60;
    return s + Math.random() * 0.5;
  });
}

/* ---------- what a bot is saving up for ---------- */
function aiTargetCost(p) {
  if (legalCitySpots(p.id).length && p.citiesLeft > 0) return COST.city;
  if (p.settlementsLeft > 0 && legalSettlementSpots(p.id, false).length) return COST.settlement;
  if (isSF() && p.shipsLeft > 0 && legalShipSpots(p.id).length) return COST.ship;
  if (isCK() && ownsCity(p)) {
    const t = bestOf(TRACKS.filter(x => p.imp[x] < 5), x => 5 - p.imp[x]);
    if (t) { const c = {}; c[IMPROVE[t].com] = p.imp[t] + 1; return c; }
  }
  if (p.roadsLeft > 0 && legalRoadSpots(p.id).length) return COST.road;
  return COST.settlement;
}
function aiMissing(p, cost) {
  const miss = {};
  Object.keys(cost).forEach(k => { const d = cost[k] - hasCard(p, k); if (d > 0) miss[k] = d; });
  return miss;
}
/* cards a bot needs right now are worth more to it than the base rate */
function aiNeedWeight(p) {
  const w = {};
  ALLCARDS.forEach(k => { w[k] = 1; });
  Object.keys(aiMissing(p, aiTargetCost(p))).forEach(k => { w[k] = 1.65; });
  return w;
}

/* the cards a bot is least attached to */
function aiWorstCards(p, n) {
  const out = [], pool = {}, need = aiNeedWeight(p);
  ALLCARDS.forEach(k => { pool[k] = hasCard(p, k); });
  for (let i = 0; i < n; i++) {
    let pickK = null, worst = Infinity;
    ALLCARDS.forEach(k => {
      if (!pool[k]) return;
      const score = (AI_VAL[k] || 1) * need[k] - pool[k] * 0.35;   // shed what you are hoarding
      if (score < worst) { worst = score; pickK = k; }
    });
    if (!pickK) break;
    pool[pickK]--;
    out.push(pickK);
  }
  return out;
}
function aiScarcest(p, options) {
  return bestOf(options, k => -hasCard(p, k) * 2 + (AI_VAL[k] || 1) + Math.random() * 0.3);
}
function aiRichestAcrossOpponents(p, options) {
  return bestOf(options, k => {
    let n = 0;
    G.players.forEach(o => { if (o.id !== p.id) n += hasCard(o, k); });
    return n + Math.random() * 0.3;
  });
}

/* ---------- resolving board prompts on a bot's behalf ---------- */
function aiResolvePending() {
  const P = G.pending;
  const p = G.players[pendingActor()];
  const V = P.vertices || [], E = P.edges || [], H = P.hexes || [];
  if (!V.length && !E.length && !H.length) return clearPending();

  switch (P.kind) {
    case "setupBuilding":
    case "settlement":     return onVertexClick(aiBestSettlement(p, V));
    case "setupRoad":
    case "road":
    case "freeRoad":       return onEdgeClick(aiBestRoad(p, E));
    case "city":
    case "wall":
    case "metropolis":     return onVertexClick(bestOf(V, vid => vertexScore(vid)));
    case "pillage":        return onVertexClick(bestOf(V, vid => -vertexScore(vid)));  // give up the weakest
    case "knight":
    case "deserterPlace":  return onVertexClick(bestOf(V, vid => vertexScore(vid) * 0.4 + Math.random()));
    case "activate":       return onVertexClick(bestOf(V, vid => G.geo.vertices[vid].knight.str));
    case "promote":        return onVertexClick(bestOf(V, vid => -G.geo.vertices[vid].knight.str));
    case "knightPick": {
      const nearRobber = V.filter(vid => G.geo.vertices[vid].hexes.includes(G.robber));
      return onVertexClick(nearRobber.length ? nearRobber[0] : V[0]);
    }
    case "knightMove":
    case "knightDisplace":
    case "intrigue":
    case "retreat":        return onVertexClick(bestOf(V, vid => vertexScore(vid) + Math.random()));
    case "ship":
    case "shipDrop":       return onEdgeClick(aiBestShip(p, E));
    case "shipLift":       return onEdgeClick(E[Math.floor(Math.random() * E.length)]);
    case "movePirate":     return onHexClick(aiPirateHex(p, H));
    case "moveRobber":
    case "bishop":
    case "knightRobber":   return onHexClick(aiRobberHex(p, H));
    case "merchant":       return onHexClick(bestOf(H, hid => pips(G.geo.hexes[hid].num)));
    case "inventorA":
      return onHexClick(bestOf(H, hid => {
        const h = G.geo.hexes[hid];
        const mine = h.vertices.some(vid => ownsBuildingAt(G.geo.vertices[vid], p.id));
        return mine ? -pips(h.num) : pips(h.num);        // grab a good number I do not touch
      }));
    case "inventorB":
      return onHexClick(bestOf(H, hid => {
        const h = G.geo.hexes[hid];
        const mine = h.vertices.some(vid => ownsBuildingAt(G.geo.vertices[vid], p.id));
        return mine ? 10 - pips(h.num) : -10;            // and drop it on my own weak hex
      }));
    case "diplomat":
      return onEdgeClick(bestOf(E, eid => (G.geo.edges[eid].road === p.id ? -5 : 5) + Math.random()));
    default:
      if (V.length) return onVertexClick(V[0]);
      if (E.length) return onEdgeClick(E[0]);
      if (H.length) return onHexClick(H[0]);
      return clearPending();
  }
}

/* ---------- trading with the bank ---------- */
function aiTradeToward(p, cost) {
  if ((p.aiTrades || 0) >= 4) return false;
  const miss = aiMissing(p, cost);
  const need = Object.keys(miss);
  if (!need.length) return false;
  const rate = tradeRates(p);
  const goods = isCK() ? ALLCARDS : RES;
  for (const want of need) {
    for (const give of goods) {
      if (give === want) continue;
      const keep = cost[give] || 0;
      if (hasCard(p, give) - rate[give] < keep) continue;
      addCard(p, give, -rate[give]);
      addCard(p, want, 1);
      p.aiTrades = (p.aiTrades || 0) + 1;
      note(p.name + " trades " + rate[give] + " " + give + " for 1 " + want + " with the bank.");
      return true;
    }
  }
  return false;
}

/* ---------- trading with other players ---------- */
const bagText = o => ALLCARDS.filter(k => o[k]).map(k => o[k] + " " + k).join(", ");

/* would this bot take the deal? returns null to accept, or a reason to refuse */
function aiAcceptsTrade(o, give, get) {
  if (!ALLCARDS.every(k => (get[k] || 0) <= hasCard(o, k))) return "they do not hold those cards";
  const need = aiNeedWeight(o);
  const incoming = sum(ALLCARDS.map(k => (give[k] || 0) * (AI_VAL[k] || 1) * need[k]));
  const outgoing = sum(ALLCARDS.map(k =>
    (get[k] || 0) * (AI_VAL[k] || 1) * (hasCard(o, k) > 3 ? 0.75 : 1) * (need[k] > 1 ? 1.4 : 1)));
  if (outgoing === 0) return null;                        // a gift is always welcome
  if (incoming >= outgoing * 1.02) return null;
  return incoming < outgoing * 0.6 ? "that is far too one-sided" : "the deal is not quite worth it";
}

function execTrade(a, b, give, get) {
  ALLCARDS.forEach(k => {
    if (give[k]) { addCard(a, k, -give[k]); addCard(b, k, give[k]); }
    if (get[k])  { addCard(b, k, -get[k]);  addCard(a, k, get[k]); }
  });
  note(a.name + " trades " + bagText(give) + " to " + b.name + " for " + bagText(get) + ".");
}

function aiFindOffer(p) {
  const target = aiTargetCost(p);
  const wants = Object.keys(aiMissing(p, target));
  if (!wants.length) return null;
  const want = wants[0];
  const spare = ALLCARDS
    .filter(k => k !== want && hasCard(p, k) - (target[k] || 0) >= 2)
    .sort((a, b) => hasCard(p, b) - hasCard(p, a));
  if (!spare.length) return null;
  const giveK = spare[0];
  const give = {}, get = {};
  give[giveK] = hasCard(p, giveK) >= 5 ? 2 : 1;           // sweeten it when sitting on a pile
  get[want] = 1;
  return { give, get, want, giveK };
}

function offerTradeToHuman(bot, human, offer) {
  openModal(
    "<h2>" + esc(bot.name) + " wants to trade</h2>" +
    '<div class="body"><p>They give you <b>' + bagText(offer.give) +
    "</b> for your <b>" + bagText(offer.get) + "</b>.</p>" +
    '<p class="muted">You are holding ' + hasCard(human, offer.want) + " " + offer.want + ".</p></div>" +
    '<div class="foot"><button class="btn" id="no">Decline</button>' +
    '<button class="btn primary" id="yes">Accept</button></div>',
    m => {
      m.querySelector("#yes").addEventListener("click", () => {
        execTrade(bot, human, offer.give, offer.get);
        closeModal(); render();
      });
      m.querySelector("#no").addEventListener("click", () => {
        note(human.name + " turns down " + bot.name + "'s offer.");
        closeModal(); render();
      });
    });
}

function aiProposeTrade(p) {
  if (p.aiOffered) return false;
  p.aiOffered = true;                                     // one attempt per turn, whatever happens
  const offer = aiFindOffer(p);
  if (!offer) return false;
  const partners = G.players.filter(o => o.id !== p.id && hasCard(o, offer.want) > 0);
  if (!partners.length) return false;

  const human = partners.find(o => !isAI(o));
  const bots = partners.filter(isAI);
  const askBots = () => {
    for (const o of bots) {
      if (!aiAcceptsTrade(o, offer.give, offer.get)) { execTrade(p, o, offer.give, offer.get); return true; }
    }
    return false;
  };
  // let the person at the table see roughly half the offers
  if (human && Math.random() < 0.55) { offerTradeToHuman(p, human, offer); return true; }
  if (askBots()) return true;
  if (human) { offerTradeToHuman(p, human, offer); return true; }
  return false;
}

/* ---------- picking the dice with Alchemist ---------- */
function aiBestRoll(p) {
  let bestTotal = 8, bestVal = -1;
  for (let t = 2; t <= 12; t++) {
    if (t === 7) continue;
    let v = 0;
    G.geo.hexes.forEach(h => {
      if (h.num !== t || h.id === G.robber || !TERRAIN[h.type].res) return;
      h.vertices.forEach(vid => {
        const vx = G.geo.vertices[vid];
        if (vx.building && vx.building.p === p.id) v += vx.building.type === "city" ? 2 : 1;
      });
    });
    if (v > bestVal) { bestVal = v; bestTotal = t; }
  }
  const a = Math.max(1, bestTotal - 6);
  return { dice: [a, bestTotal - a], value: bestVal, total: bestTotal };
}

/* ---------- development cards (base game) ---------- */
function aiPlayDev(p) {
  if (p.devPlayedThisTurn) return false;
  const pd = playableDev(p);
  if (!pd.length) return false;
  const robberOnMe = G.geo.hexes[G.robber].vertices.some(vid => ownsBuildingAt(G.geo.vertices[vid], p.id));
  if (pd.includes("knight") && (robberOnMe || p.playedKnights >= 2 || Math.random() < 0.4)) {
    playDev("knight"); return true;
  }
  if (pd.includes("monopoly")) {
    let bestN = 0;
    RES.forEach(k => { let n = 0; G.players.forEach(o => { if (o.id !== p.id) n += o.res[k]; }); bestN = Math.max(bestN, n); });
    if (bestN >= 3) { playDev("monopoly"); return true; }
  }
  if (pd.includes("yearOfPlenty")) {
    const miss = Object.keys(aiMissing(p, aiTargetCost(p))).length;
    if (miss >= 1 && miss <= 2) { playDev("yearOfPlenty"); return true; }
  }
  if (pd.includes("roadBuilding") && p.roadsLeft >= 2 && legalRoadSpots(p.id).length) {
    playDev("roadBuilding"); return true;
  }
  return false;
}

/* ---------- progress cards (Cities & Knights) ---------- */
function aiAdjHexes(p, kind) {
  let n = 0;
  G.geo.hexes.forEach(h => {
    if (h.type !== kind) return;
    if (h.vertices.some(vid => ownsBuildingAt(G.geo.vertices[vid], p.id))) n++;
  });
  return n;
}
function aiUnwalledCities(p) {
  return G.geo.vertices.filter(v => v.building && v.building.p === p.id &&
    v.building.type === "city" && !v.building.wall);
}
function aiEnemyKnightsOnMyRoads(p) {
  return G.geo.vertices.filter(v => v.knight && v.knight.p !== p.id &&
    v.edges.some(e => G.geo.edges[e].road === p.id));
}

/* how much a bot rates a card in the position in front of it; 0 means do not play */
function aiProgWorth(p, c) {
  const opp = G.players.filter(o => o.id !== p.id);
  const myVP = totalVP(p);
  switch (c) {
    case "irrigation":       return aiAdjHexes(p, "fields") * 2;
    case "mining":           return aiAdjHexes(p, "mountains") * 2;
    case "resourceMonopoly": {
      let m = 0;
      RES.forEach(k => { let n = 0; opp.forEach(o => { n += Math.min(2, o.res[k]); }); m = Math.max(m, n); });
      return m;
    }
    case "tradeMonopoly": {
      let m = 0;
      COM.forEach(k => { let n = 0; opp.forEach(o => { if (o.com[k]) n++; }); m = Math.max(m, n); });
      return m * 1.5;
    }
    case "warlord":
      return knightsOf(p).filter(x => !x.k.active).length * (G.barb >= BARB_TRACK - 2 ? 3.5 : 1.2);
    case "smith":
      return knightsOf(p).filter(x => x.k.str < 3 && !(x.k.str === 2 && p.imp.politics < 3)).length * 2.2;
    case "engineer":       return aiUnwalledCities(p).length && p.wallsLeft > 0 ? 3.2 : 0;
    case "medicine":       return legalCitySpots(p.id).length && canPay(p, { ore: 2, grain: 1 }) ? 4.5 : 0;
    case "roadBuildingP":  return p.roadsLeft >= 1 && legalRoadSpots(p.id).length ? 3.2 : 0;
    case "crane":          return ownsCity(p) && TRACKS.some(t => p.imp[t] < 5) ? 2.6 : 0;
    case "wedding":        return opp.filter(o => totalVP(o) > myVP && handCount(o) > 0).length * 2.2;
    case "masterMerchant": return opp.some(o => totalVP(o) > myVP && handCount(o) > 1) ? 4 : 0;
    case "saboteur":       return opp.filter(o => totalVP(o) >= myVP && handCount(o) >= 6).length * 2;
    case "spy":            return opp.some(o => o.prog.length) ? 2.6 : 0;
    case "bishop":         return G.barbAttacked ? 3.2 : 0;   // robber is frozen before the first landing
    case "merchant":       return p.hasMerchant ? 0.4 : 3.4;
    case "merchantFleet":  return 1.2;
    case "deserter":       return opp.some(o => knightsOf(o).length) ? 2.6 : 0;
    case "intrigue":       return aiEnemyKnightsOnMyRoads(p).length ? 3.2 : 0;
    case "diplomat":       return openRoads().some(e => G.geo.edges[e].road !== p.id) ? 1.6 : 0;
    case "inventor":
      return G.geo.hexes.filter(h => h.num !== null && ![2, 6, 8, 12].includes(h.num)).length >= 2 ? 1.4 : 0;
    case "commercialHarbor":
      return sum(RES.map(r => p.res[r])) > 0 &&
             opp.some(o => sum(COM.map(k => o.com[k])) > 0) ? 2.2 : 0;
    default: return 0;                                        // alchemist is handled before the roll
  }
}

function aiPlayProgress(p) {
  if (!p.prog.length) return false;
  const ranked = p.prog
    .map((c, i) => ({ c, i, w: (p.aiSkip && p.aiSkip[c]) ? 0 : aiProgWorth(p, c) + Math.random() * 0.4 }))
    .filter(x => x.w > 0)
    .sort((a, b) => b.w - a.w);
  if (!ranked.length) return false;
  const top = ranked[0];
  // a full hand has to be spent or it costs you future draws; otherwise hold out for a strong play
  if (p.prog.length < 4 && top.w < 3) return false;
  const count = () => p.prog.filter(y => y === top.c).length;
  const before = count();
  playProgress(top.i);
  if (count() < before) return true;
  p.aiSkip = p.aiSkip || {};
  p.aiSkip[top.c] = true;                        // it refused to resolve; leave it alone this turn
  return false;
}

/* ---------- one action slot ---------- */
function aiOneAction(p) {
  const spotsCity = legalCitySpots(p.id);
  const spotsSettle = legalSettlementSpots(p.id, false);
  const spotsRoad = legalRoadSpots(p.id);

  if (isCK()) {
    // keep the island defended when the ship is closing in
    const danger = G.barb >= BARB_TRACK - 2;
    const idle = knightsOf(p).filter(x => !x.k.active);
    if (danger && idle.length && canPay(p, COST.activate)) { actActivateKnight(false); return true; }
    if (danger && !knightsOf(p).length && canPay(p, COST.knight) && legalKnightSpots(p.id).length) {
      actBuildKnight(); return true;
    }
    // improvements: chase the level 3 perks first, then a metropolis
    const track = bestOf(TRACKS.filter(t => !canImprove(p, t)),
      t => (p.imp[t] < 3 ? 3 - p.imp[t] : 0) + (p.imp[t] === 3 ? 2.5 : 0) + Math.random() * 0.4);
    if (track) { buyImprovement(track); return true; }
  }

  if (spotsCity.length && p.citiesLeft > 0 && canPay(p, COST.city)) { actBuildCity(false); return true; }
  if (spotsSettle.length && p.settlementsLeft > 0 && canPay(p, COST.settlement)) { actBuildSettlement(); return true; }

  if (isCK()) {
    if (knightCounts(p)[1] < 2 && knightsOf(p).length < 3 && canPay(p, COST.knight) && legalKnightSpots(p.id).length) {
      actBuildKnight(); return true;
    }
    if (canPay(p, COST.promote) && knightsOf(p).some(x => x.k.str === 1)) { actPromoteKnight(false); return true; }
    if (aiUnwalledCities(p).length && p.wallsLeft > 0 && p.res.brick >= 4) { actBuildWall(false); return true; }
    if (aiPlayProgress(p)) return true;
  } else {
    if (isSF() && p.shipsLeft > 0 && canPay(p, COST.ship) && !spotsSettle.length &&
        legalShipSpots(p.id).length) {
      actBuildShip(false); return true;                 // keep pushing toward the islands
    }
    if (aiPlayDev(p)) return true;
    if (G.dev.length && canPay(p, COST.dev) && (!spotsSettle.length || Math.random() < 0.45)) {
      actBuyDev(); return true;
    }
  }

  if (spotsRoad.length && p.roadsLeft > 0 && canPay(p, COST.road) && !spotsSettle.length) {
    actBuildRoad(false); return true;
  }

  if (aiProposeTrade(p)) return true;             // a player trade beats 4:1 at the bank

  const targets = [];
  if (spotsCity.length && p.citiesLeft > 0) targets.push(COST.city);
  if (p.settlementsLeft > 0 && spotsRoad.length) targets.push(COST.settlement);
  if (isCK() && ownsCity(p)) {
    const t = bestOf(TRACKS.filter(x => p.imp[x] < 5), x => (x < 3 ? 3 - p.imp[x] : 1));
    if (t) { const c = {}; c[IMPROVE[t].com] = p.imp[t] + 1; targets.push(c); }
  }
  if (isSF() && p.shipsLeft > 0 && legalShipSpots(p.id).length) targets.push(COST.ship);
  if (p.roadsLeft > 0) targets.push(COST.road);
  for (const t of targets) if (aiTradeToward(p, t)) return true;

  return false;
}

/* ---------- the driver ---------- */
let aiTimer = null;
function scheduleAI() {
  if (aiTimer) clearTimeout(aiTimer);
  aiTimer = setTimeout(aiStep, AICFG.delay);
}

/* cheap fingerprint of a bot's position, used to notice when it is spinning */
function aiSignature(p) {
  return [handCount(p), p.prog.length, p.dev.length, p.roadsLeft, p.shipsLeft, p.settlementsLeft,
    p.citiesLeft, p.wallsLeft, p.imp.trade, p.imp.politics, p.imp.science,
    p.knightsPlaced.length, knightStrengthOf(p.id), G.pending ? G.pending.kind : "-"].join(",");
}

function aiStep() {
  aiTimer = null;
  if (G.phase === "over" || G.modalOpen) return;
  const keepGoing = () => { if (!G.modalOpen && G.phase !== "over") render(); };

  if (G.pending) {
    const a = pendingActor();
    if (a !== null && isAI(G.players[a])) {
      try { aiResolvePending(); }
      catch (e) { note("The bot stumbled: " + e.message, "bad"); clearPending(); }
      keepGoing();
    }
    return;
  }

  const p = cur();
  if (!isAI(p)) return;

  G.aiSteps = (G.aiSteps || 0) + 1;
  if (G.aiSteps > AICFG.maxStepsPerTurn) { endTurn(); keepGoing(); return; }

  if (G.phase === "roll") {
    p.aiTrades = 0;
    p.aiSkip = {};
    p.aiOffered = false;
    if (!isCK() && aiPlayDev(p)) { keepGoing(); return; }
    if (isCK()) {
      const idx = p.prog.indexOf("alchemist");
      if (idx >= 0) {
        const plan = aiBestRoll(p);
        if (plan.value >= 3) {
          p.aiAlchemy = plan.dice;
          playAlchemist(idx);
          keepGoing();
          return;
        }
      }
    }
    ACTIONS.roll();
    keepGoing();
    return;
  }

  if (G.phase === "main") {
    const before = aiSignature(p);
    let acted = false;
    try { acted = aiOneAction(p); }
    catch (e) { note("The bot stumbled: " + e.message, "bad"); acted = false; }
    if (acted && aiSignature(p) === before && !G.modalOpen) {
      G.aiStuck = (G.aiStuck || 0) + 1;
      if (G.aiStuck > 3) acted = false;            // the move is not landing; stop trying
    } else {
      G.aiStuck = 0;
    }
    if (!acted) endTurn();
    keepGoing();
    return;
  }
  keepGoing();
}

/* ---------- boot ---------- */
newGameDialog();
</script>
