<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catan · Cities and Knights · Seafarers — Hot-seat Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=Archivo+Narrow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1f2b;
  --ink-2:#17303f;
  --ink-3:#1e3d50;
  --chart:#ece0c8;
  --chart-2:#dccdae;
  --chart-3:#c8b58f;
  --brown:#3f3020;
  --brown-2:#6b563c;
  --signal:#b3352a;
  --brass:#c99a2e;
  --sea:#123243;
  --rule:rgba(63,48,32,.28);

  --lumber:#3f6b4a;
  --wool:#8aa95c;
  --grain:#ddb44e;
  --brick:#b76a45;
  --ore:#8b8f99;
  --desert:#ddd0ac;

  --disp:"Alegreya SC","Palatino Linotype",Palatino,Georgia,serif;
  --ui:"Archivo Narrow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ink);color:var(--chart);
  font-family:var(--ui);font-size:15px;line-height:1.35;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;min-height:100vh}
header.bar{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:8px 16px;background:var(--ink-2);
  border-bottom:1px solid rgba(236,224,200,.16);
}
.brand{font-family:var(--disp);font-weight:700;letter-spacing:.08em;font-size:17px;color:var(--chart)}
.brand span{color:var(--brass)}
.mode-tag{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--brass);color:var(--brass);padding:2px 7px;border-radius:2px;
}
.bar .spacer{flex:1}
.turnbox{display:flex;align-items:center;gap:9px;font-weight:600}
.swatch{width:14px;height:14px;border-radius:2px;border:1px solid rgba(0,0,0,.5);display:inline-block;flex:none}

.speedbox{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--chart-3)}
.speedbox select{
  font-family:var(--ui);font-size:13px;letter-spacing:0;text-transform:none;
  background:var(--ink-3);color:var(--chart);border:1px solid rgba(236,224,200,.3);
  border-radius:3px;padding:4px 6px;
}

/* offer sheet */
.offer{display:flex;gap:14px;align-items:stretch;margin:12px 0}
.offer .side{flex:1;background:var(--chart-2);border:1px solid var(--rule);border-radius:3px;padding:9px 11px}
.offer .side h3{margin:0 0 6px;font-family:var(--disp);font-size:12px;letter-spacing:.12em;color:var(--brown-2)}
.offer .arrow{display:grid;place-items:center;font-size:20px;color:var(--brown-2)}

/* barbarian rail — the signature element */
.rail{display:flex;align-items:center;gap:8px}
.rail-label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--chart-3)}
.rail-track{display:flex;align-items:center;gap:3px}
.rail-node{
  width:15px;height:15px;border-radius:50%;
  border:1px solid rgba(236,224,200,.35);background:transparent;position:relative;
}
.rail-node.last{border-color:var(--signal);background:rgba(179,53,42,.22)}
.rail-node.on{background:var(--signal);border-color:var(--signal);box-shadow:0 0 0 3px rgba(179,53,42,.25)}
.rail-node.next{box-shadow:0 0 0 3px rgba(201,154,46,.45)}
.rail-strength{font-size:12px;color:var(--chart-3);white-space:nowrap}
.rail-strength b{color:var(--chart)}
.speed{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--chart-3);
  display:flex;align-items:center;gap:6px}
.speed select{font-family:var(--ui);font-size:12px;letter-spacing:0;text-transform:none;
  background:var(--ink-3);color:var(--chart);border:1px solid rgba(236,224,200,.3);
  border-radius:2px;padding:3px 5px}

/* ---------- main ---------- */
main{flex:1;display:flex;min-height:0}
.boardwrap{
  flex:1;min-width:0;position:relative;
  background:
    radial-gradient(circle at 50% 42%, #17394b 0%, var(--sea) 55%, #0d2432 100%);
  display:flex;align-items:center;justify-content:center;padding:10px;
}
#board{width:100%;height:100%;max-height:100%;display:block;touch-action:manipulation}

.hint{
  position:absolute;left:50%;transform:translateX(-50%);bottom:12px;
  background:var(--chart);color:var(--brown);font-weight:600;
  padding:7px 14px;border-radius:3px;box-shadow:0 3px 14px rgba(0,0,0,.45);
  display:none;align-items:center;gap:12px;max-width:92%;
}
.hint.show{display:flex}
.hint button{
  background:var(--brown);color:var(--chart);border:0;padding:3px 9px;border-radius:2px;font-weight:600;
}

/* ---------- side panel ---------- */
aside{
  width:352px;flex:none;background:var(--chart);color:var(--brown);
  display:flex;flex-direction:column;min-height:0;
  border-left:1px solid rgba(0,0,0,.35);
}
.pane{padding:10px 13px;border-bottom:1px solid var(--rule)}
.pane.grow{flex:1;min-height:0;display:flex;flex-direction:column}
.eyebrow{
  font-family:var(--disp);font-size:12px;letter-spacing:.14em;
  color:var(--brown-2);margin:0 0 7px;font-weight:700;
}

/* hand */
.cards{display:flex;flex-wrap:wrap;gap:5px}
.card{
  display:flex;align-items:center;gap:5px;
  background:var(--chart-2);border:1px solid var(--rule);border-radius:3px;
  padding:3px 7px;font-weight:600;font-size:13px;
}
.card .dot{width:10px;height:10px;border-radius:2px;flex:none}
.card.zero{opacity:.34}
.card.commodity{background:#e6dcc4;border-style:dashed}

/* actions */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts.one{grid-template-columns:1fr}
.act{
  text-align:left;background:var(--chart-2);border:1px solid var(--rule);
  border-radius:3px;padding:6px 8px;color:var(--brown);line-height:1.15;
}
.act:hover:not(:disabled){background:#e6d8ba;border-color:var(--brown-2)}
.act:disabled{opacity:.38;cursor:not-allowed}
.act b{display:block;font-size:13px}
.act small{font-size:11px;color:var(--brown-2);letter-spacing:.02em}
.act.primary{background:var(--brown);color:var(--chart);border-color:var(--brown)}
.act.primary small{color:var(--chart-3)}
.act.primary:hover:not(:disabled){background:#2e2317}
.act.danger{background:var(--signal);color:#fff;border-color:var(--signal)}
.act.danger small{color:rgba(255,255,255,.72)}

/* improvements */
.imps{display:flex;flex-direction:column;gap:5px}
.imp{display:flex;align-items:center;gap:8px}
.imp .nm{width:58px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown-2);flex:none}
.pips{display:flex;gap:3px;flex:1}
.pip{height:11px;flex:1;border:1px solid var(--rule);border-radius:1px;background:transparent}
.imp .cost{font-size:11px;color:var(--brown-2);width:34px;text-align:right;flex:none}

/* knights */
.knights{display:flex;flex-wrap:wrap;gap:5px}
.kn{
  display:flex;align-items:center;gap:5px;border:1px solid var(--rule);
  border-radius:3px;padding:3px 7px;background:var(--chart-2);font-size:12px;font-weight:600;
}
.kn.active{background:#dfe9d3;border-color:#5c7a4a}
.kn .st{font-family:var(--disp);font-weight:700}

/* barbarian muster (Cities & Knights) */
.muster{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;align-items:center;gap:7px;font-size:12px}
.mrow .nm{width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none;font-weight:600}
.mbar{flex:1;height:11px;background:#e3d6ba;border:1px solid var(--rule);border-radius:2px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%}
.mrow .val{width:16px;text-align:right;font-weight:700;flex:none;font-family:var(--disp)}
.mflag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;padding:1px 4px;flex:none;font-weight:700}
.mflag.def{background:#dfe9d3;color:#3d5c2d;border:1px solid #5c7a4a}
.mflag.risk{background:rgba(179,53,42,.15);color:var(--signal);border:1px solid var(--signal)}
.mnote{font-size:11px;color:var(--brown-2);margin:7px 0 0;line-height:1.3}
.mnote b{color:var(--brown)}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--brown-2);margin-bottom:7px}
.mhead .lead{font-family:var(--disp);font-size:15px;letter-spacing:.04em;color:var(--brown)}
.mhead .lead.bad{color:var(--signal)}

/* seafaring (Seafarers) */
.sea-list{display:flex;flex-direction:column;gap:5px;font-size:12px}
.sea-row{display:flex;align-items:center;gap:8px}
.sea-row .k{flex:1;color:var(--brown-2);letter-spacing:.02em}
.sea-row b{font-family:var(--disp);font-size:14px}
.isles{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.isle{border:1px solid var(--rule);border-radius:3px;padding:2px 7px;font-size:11px;
  background:var(--chart-2);font-weight:600;color:var(--brown-2)}
.isle.claimed{background:#dfe9d3;border-color:#5c7a4a;color:#3d5c2d}
.isle.mine{background:var(--brown);border-color:var(--brown);color:var(--chart)}

/* battle report */
.battle{display:flex;flex-direction:column;gap:7px;margin:11px 0}
.battle .side{display:flex;align-items:center;gap:9px}
.battle .side .lab{width:92px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown-2);flex:none}
.battle .side .bar{flex:1;height:16px;background:#e3d6ba;border:1px solid var(--rule);border-radius:2px;overflow:hidden;display:flex}
.battle .side .bar i{display:block;height:100%}
.battle .side .num{width:22px;text-align:right;font-family:var(--disp);font-weight:700;font-size:16px;flex:none}
.verdict{font-family:var(--disp);font-size:16px;letter-spacing:.05em;margin:12px 0 4px}
.verdict.win{color:#3d5c2d}
.verdict.lose{color:var(--signal)}

/* log */
.log{
  flex:1;overflow-y:auto;font-size:13px;
  background:#e3d6ba;border:1px solid var(--rule);border-radius:3px;padding:7px 9px;
}
.log p{margin:0 0 4px;padding-left:13px;text-indent:-13px}
.log p::before{content:"·  ";color:var(--brown-2)}
.log p.hi{font-weight:700}
.log p.bad{color:var(--signal);font-weight:600}

/* scoreboard */
.score{display:flex;flex-direction:column;gap:4px}
.row{
  display:flex;align-items:center;gap:8px;font-size:13px;
  padding:3px 5px;border-radius:3px;
}
.row.turn{background:var(--chart-2);font-weight:700}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mini{font-size:11px;color:var(--brown-2);letter-spacing:.03em}
.tag{font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--rule);
  border-radius:2px;padding:1px 4px;color:var(--brown-2);flex:none}
.row .vp{font-family:var(--disp);font-weight:700;font-size:15px;min-width:22px;text-align:right}

/* dice */
.dice{display:flex;align-items:center;gap:7px}
.die{
  width:34px;height:34px;border-radius:5px;display:grid;place-items:center;
  font-family:var(--disp);font-weight:700;font-size:19px;
  border:1px solid rgba(0,0,0,.35);
}
.die.yellow{background:#e6cf8a;color:#3f3020}
.die.red{background:#b3352a;color:#fff}
.die.event{background:#0f1f2b;color:#fff;font-size:12px;letter-spacing:.06em;text-align:center;line-height:1.05;padding:2px}
.die.event.trade{background:#c9a227;color:#2a2110}
.die.event.politics{background:#3d6fa8;color:#fff}
.die.event.science{background:#4a8a5c;color:#fff}

/* ---------- modal ---------- */
.scrim{
  position:fixed;inset:0;background:rgba(8,18,25,.78);
  display:none;align-items:center;justify-content:center;padding:16px;z-index:50;
}
.scrim.show{display:flex}
.modal{
  background:var(--chart);color:var(--brown);border-radius:4px;
  width:min(560px,100%);max-height:88vh;overflow-y:auto;
  box-shadow:0 18px 60px rgba(0,0,0,.6);
}
.modal h2{
  font-family:var(--disp);font-size:18px;letter-spacing:.06em;margin:0;
  padding:13px 17px;border-bottom:1px solid var(--rule);
}
.modal .body{padding:15px 17px}
.modal .foot{
  padding:11px 17px;border-top:1px solid var(--rule);
  display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;
}
.btn{
  background:var(--chart-2);border:1px solid var(--rule);color:var(--brown);
  padding:7px 14px;border-radius:3px;font-weight:600;
}
.btn:hover:not(:disabled){background:#e6d8ba}
.btn.primary{background:var(--brown);color:var(--chart);border-color:var(--brown)}
.btn.primary:hover:not(:disabled){background:#2e2317}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--brown-2);font-size:13px}

.picker{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
.pick{
  display:flex;align-items:center;gap:6px;background:var(--chart-2);
  border:1px solid var(--rule);border-radius:3px;padding:6px 10px;font-weight:600;
}
.pick:hover:not(:disabled){background:#e6d8ba}
.pick.sel{background:var(--brown);color:var(--chart);border-color:var(--brown)}
.pick:disabled{opacity:.35;cursor:not-allowed}

.counter{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.counter .lab{display:flex;align-items:center;gap:7px;font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{
  width:26px;height:26px;border-radius:3px;border:1px solid var(--rule);
  background:var(--chart-2);color:var(--brown);font-weight:700;line-height:1;
}
.stepper span{min-width:20px;text-align:center;font-weight:700}

.plist{display:flex;flex-direction:column;gap:6px}
.pbtn{
  display:flex;align-items:center;gap:9px;text-align:left;width:100%;
  background:var(--chart-2);border:1px solid var(--rule);border-radius:3px;padding:8px 11px;color:var(--brown);
}
.pbtn:hover:not(:disabled){background:#e6d8ba}
.pbtn:disabled{opacity:.35;cursor:not-allowed}
.pbtn .nm{flex:1;font-weight:700}

.pcards{display:flex;flex-direction:column;gap:7px}
.pcard{
  text-align:left;border:1px solid var(--rule);border-radius:3px;padding:9px 11px;
  background:var(--chart-2);color:var(--brown);width:100%;
}
.pcard:hover:not(:disabled){background:#e6d8ba}
.pcard b{display:block;font-family:var(--disp);letter-spacing:.05em;font-size:14px}
.pcard small{display:block;font-size:12px;color:var(--brown-2);margin-top:2px;line-height:1.3}
.pcard .flag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.pcard.trade .flag{color:#9a7716}
.pcard.politics .flag{color:#2f5985}
.pcard.science .flag{color:#3a6c48}
.pcard.dev .flag{color:var(--brown-2)}

.setup-grid{display:flex;flex-direction:column;gap:9px;margin:12px 0}
.setup-row{display:flex;align-items:center;gap:9px}
.setup-row .seg button{padding:5px 10px;font-size:12px}
.setup-row input[type=text]{
  flex:1;padding:6px 9px;border:1px solid var(--rule);border-radius:3px;
  background:#f2e9d6;color:var(--brown);font-family:inherit;font-size:14px;
}
.seg{display:flex;gap:0;border:1px solid var(--rule);border-radius:3px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--chart-2);border:0;padding:7px 13px;color:var(--brown);font-weight:600}
.seg button.on{background:var(--brown);color:var(--chart)}

.rulesbox{
  background:#e3d6ba;border:1px solid var(--rule);border-radius:3px;
  padding:9px 11px;font-size:13px;margin-top:10px;
}
.rulesbox a{color:#7a4a1e}

table.costs{width:100%;border-collapse:collapse;font-size:13px}
table.costs th,table.costs td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--rule)}
table.costs th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brown-2)}

/* ---------- responsive ---------- */
@media (max-width:900px){
  main{flex-direction:column}
  aside{width:100%;max-height:52vh;border-left:0;border-top:1px solid rgba(0,0,0,.35)}
  .boardwrap{min-height:44vh}
  header.bar{gap:10px;padding:7px 11px}
  .rail-label{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand" id="brand">CATAN</div>
    <div class="mode-tag" id="modeTag">BASE</div>
    <div class="turnbox"><span class="swatch" id="turnSwatch"></span><span id="turnName">—</span></div>
    <div class="dice" id="diceBox"></div>
    <div class="spacer"></div>
    <div class="rail" id="railBox"></div>
    <label class="speedbox" for="speed"><span>Bots</span>
      <select id="speed">
        <option value="900">Slow</option>
        <option value="480" selected>Normal</option>
        <option value="160">Fast</option>
        <option value="0">Instant</option>
      </select></label>
    <label class="speed" id="speedWrap">Bots
      <select id="botSpeed">
        <option value="900">Slow</option>
        <option value="480" selected>Normal</option>
        <option value="180">Fast</option>
        <option value="0">Instant</option>
      </select>
    </label>
    <button class="btn" id="btnRules" style="padding:5px 11px">Rules &amp; costs</button>
    <button class="btn" id="btnNew" style="padding:5px 11px">New game</button>
  </header>
  <main>
    <div class="boardwrap">
      <svg id="board" viewBox="0 0 820 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Catan board"></svg>
      <div class="hint" id="hint"><span id="hintText"></span><button id="hintCancel">Cancel</button></div>
    </div>
    <aside>
      <div class="pane">
        <p class="eyebrow" id="handTitle">HAND</p>
        <div class="cards" id="hand"></div>
      </div>
      <div class="pane" id="impPane">
        <p class="eyebrow">CITY IMPROVEMENTS</p>
        <div class="imps" id="imps"></div>
      </div>
      <div class="pane" id="knPane">
        <p class="eyebrow">KNIGHTS</p>
        <div class="knights" id="knights"></div>
      </div>
      <div class="pane" id="barbPane">
        <p class="eyebrow">BARBARIAN MUSTER</p>
        <div class="muster" id="muster"></div>
      </div>
      <div class="pane" id="seaPane">
        <p class="eyebrow">SEAFARING</p>
        <div class="sea-list" id="seaBox"></div>
      </div>
      <div class="pane">
        <p class="eyebrow">ACTIONS</p>
        <div class="acts" id="acts"></div>
      </div>
      <div class="pane grow">
        <p class="eyebrow">LOG</p>
        <div class="log" id="log"></div>
      </div>
      <div class="pane">
        <p class="eyebrow">STANDINGS</p>
        <div class="score" id="score"></div>
      </div>
    </aside>
  </main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<script>
"use strict";
/* ============================================================
   Catan + Cities & Knights — hot-seat implementation.
   Original code. Rules follow the official Catan and
   Cities & Knights rulebooks; no artwork or text is reproduced.
   ============================================================ */

/* ---------- static data ---------- */
const RES = ["lumber", "brick", "wool", "grain", "ore"];
const COM = ["paper", "cloth", "coin"];
const ALLCARDS = RES.concat(COM);

const CARDCOLOR = {
  lumber: "#3f6b4a", brick: "#b76a45", wool: "#8aa95c",
  grain: "#ddb44e", ore: "#8b8f99",
  paper: "#4a8a5c", cloth: "#c9a227", coin: "#3d6fa8"
};

const TERRAIN = {
  forest:    { res: "lumber", com: "paper", label: "Forest",    fill: "#3f6b4a" },
  hills:     { res: "brick",  com: null,    label: "Hills",     fill: "#b76a45" },
  pasture:   { res: "wool",   com: "cloth", label: "Pasture",   fill: "#8aa95c" },
  fields:    { res: "grain",  com: null,    label: "Fields",    fill: "#ddb44e" },
  mountains: { res: "ore",    com: "coin",  label: "Mountains", fill: "#8b8f99" },
  desert:    { res: null,     com: null,    label: "Desert",    fill: "#ddd0ac" },
  gold:      { res: null,     com: null,    label: "Gold Field",fill: "#e0b93f", gold: true },
  sea:       { res: null,     com: null,    label: "Sea",       fill: "#16394c", water: true }
};

const TILE_BAG = [
  "forest","forest","forest","forest",
  "pasture","pasture","pasture","pasture",
  "fields","fields","fields","fields",
  "hills","hills","hills",
  "mountains","mountains","mountains",

/* ---------- Seafarers: heading for new shores ----------
   A 7 x 9 field of open sea with the home island carved out of it and two
   small islands off the east coast. Rows alternate a half-hex offset, so the
   home island keeps the familiar 3-4-5-4-3 silhouette.                     */
const SF_ROWS = 7, SF_COLS = 9;
const SF_MAIN = { 1: [2,3,4], 2: [2,3,4,5], 3: [1,2,3,4,5], 4: [2,3,4,5], 5: [2,3,4] };
const SF_ISLES = [
  { name: "North Isle", cells: [[1,7],[2,7]], tiles: ["gold","mountains"], nums: [4,10] },
  { name: "South Isle", cells: [[4,7],[5,7]], tiles: ["gold","forest"],    nums: [5,9]  }
];
const SF_PIRATE_START = [3, 7];   // the strait between the two isles
const SHIPS_PER_PLAYER = 15;

/* ---------- helpers ---------- */
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const d6 = () => 1 + Math.floor(Math.random() * 6);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const sum = a => a.reduce((x, y) => x + y, 0);

/* ---------- board geometry ----------
   Pointy-top hexes laid out in rows of 3,4,5,4,3.
   Vertices and edges are derived from hex corners and de-duplicated,
   which yields the standard 54 intersections and 72 edges.        */
let HEX_R = 58;
let HEX_W = Math.sqrt(3) * HEX_R;
let HEX_VS = 1.5 * HEX_R;
let ART = 1;                       // drawing scale, 1 at the classic hex size
const BOARD_CX = 410, BOARD_CY = 360;

function setHexSize(r) {
  HEX_R = r;
  HEX_W = Math.sqrt(3) * r;
  HEX_VS = 1.5 * r;
  ART = r / 58;
}

function hexCorner(cx, cy, i) {
  const a = ((60 * i - 90) * Math.PI) / 180;
  return [cx + HEX_R * Math.cos(a), cy + HEX_R * Math.sin(a)];
}
const key = (x, y) => Math.round(x) + ":" + Math.round(y);

/* A cell is { row, col, x, y, water }; the geometry pass does the rest. */
function classicCells() {
  const rows = [3, 4, 5, 4, 3];
  const out = [];
  rows.forEach((n, r) => {
    const y = BOARD_CY + (r - 2) * HEX_VS;
    const x0 = BOARD_CX - ((n - 1) / 2) * HEX_W;
    for (let c = 0; c < n; c++) out.push({ row: r, col: c, x: x0 + c * HEX_W, y, water: false });
  });
  return out;
}

function seafarerCells() {
  const raw = [];
  for (let r = 0; r < SF_ROWS; r++) {
    const off = (r % 2) ? 0.5 : 0;
    for (let c = 0; c < SF_COLS; c++) {
      const land = (SF_MAIN[r] || []).indexOf(c) >= 0 ||
        SF_ISLES.some(i => i.cells.some(p => p[0] === r && p[1] === c));
      raw.push({ row: r, col: c, gx: c + off, gy: r, water: !land });
    }
  }
  const xs = raw.map(o => o.gx), ys = raw.map(o => o.gy);
  const mx = (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2;
  const my = (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2;
  raw.forEach(o => {
    o.x = BOARD_CX + (o.gx - mx) * HEX_W;
    o.y = BOARD_CY + (o.gy - my) * HEX_VS;
  });
  return raw;
}

function buildGeometry(cells) {
  const hexes = [];
  cells.forEach(c => hexes.push({
    id: hexes.length, row: c.row, col: c.col, x: c.x, y: c.y,
    type: c.water ? "sea" : null, water: !!c.water, island: null,
    num: null, vertices: [], edges: []
  }));

  const vmap = new Map(), vertices = [];
  const emap = new Map(), edges = [];

  hexes.forEach(h => {
    const corners = [];
    for (let i = 0; i < 6; i++) {
      const [x, y] = hexCorner(h.x, h.y, i);
      const k = key(x, y);
      let vi = vmap.get(k);
      if (vi === undefined) {
        vi = vertices.length;
        vmap.set(k, vi);
        vertices.push({ id: vi, x, y, hexes: [], edges: [], adj: [], building: null, knight: null, port: null });
      }
      corners.push(vi);
      if (!vertices[vi].hexes.includes(h.id)) vertices[vi].hexes.push(h.id);
      h.vertices.push(vi);
    }
    for (let i = 0; i < 6; i++) {
      const a = corners[i], b = corners[(i + 1) % 6];
      const k = a < b ? a + "-" + b : b + "-" + a;
      let ei = emap.get(k);
      if (ei === undefined) {
        ei = edges.length;
        emap.set(k, ei);
        edges.push({
          id: ei, a, b, road: null, hexes: [],
          x: (vertices[a].x + vertices[b].x) / 2,
          y: (vertices[a].y + vertices[b].y) / 2
        });
        vertices[a].edges.push(ei); vertices[b].edges.push(ei);
        if (!vertices[a].adj.includes(b)) vertices[a].adj.push(b);
        if (!vertices[b].adj.includes(a)) vertices[b].adj.push(a);
      }
      if (!edges[ei].hexes.includes(h.id)) edges[ei].hexes.push(h.id);
      h.edges.push(ei);
    }
  });

  return { hexes, vertices, edges };
}

/* Land hexes sharing an edge form an island; every land hex gets a label. */
function labelIslands(geo) {
  let next = 0;
  geo.hexes.forEach(h => {
    if (h.water || h.island !== null) return;
    const id = next++;
    const stack = [h];
    h.island = id;
    while (stack.length) {
      const cur = stack.pop();
      cur.edges.forEach(ei => {
        geo.edges[ei].hexes.forEach(hid => {
          const n = geo.hexes[hid];
          if (n.water || n.island !== null) return;
          n.island = id;
          stack.push(n);
        });
      });
    }
  });
  geo.islandCount = next;
  const size = {};
  geo.hexes.forEach(h => { if (!h.water) size[h.island] = (size[h.island] || 0) + 1; });
  let main = 0;
  Object.keys(size).forEach(k => { if (size[k] > (size[main] || 0)) main = +k; });
  geo.mainIsland = main;
  return geo;
}

/* Edges with land on exactly one side — the coastline. */
function coastEdges(geo, islandId) {
  return geo.edges.filter(e => {
    const land = e.hexes.map(h => geo.hexes[h]).filter(h => !h.water);
    if (land.length !== 1) return false;
    return islandId === undefined || land[0].island === islandId;
  });
}

/* Coastal edges ordered around an island, used to seat the harbors. */
function perimeterEdges(geo, islandId) {
  const outer = coastEdges(geo, islandId);
  let cx = BOARD_CX, cy = BOARD_CY;
  if (islandId !== undefined) {
    const land = geo.hexes.filter(h => !h.water && h.island === islandId);
    cx = sum(land.map(h => h.x)) / land.length;
    cy = sum(land.map(h => h.y)) / land.length;
  }
  outer.sort((p, q) => Math.atan2(p.y - cy, p.x - cx) - Math.atan2(q.y - cy, q.x - cx));
  return outer;
}

/* Nine harbour seats spread around a coastline. */
function seatPorts(geo, ring) {
  const gaps = [3, 3, 4, 3, 3, 4, 3, 4, 3];
  const bag = shuffle(PORT_BAG.slice());
  const ports = [];
  let idx = 0;
  for (let i = 0; i < 9; i++) {
    const e = ring[idx % ring.length];
    const kind = bag[i];
    ports.push({ edge: e.id, kind, x: e.x, y: e.y });
    geo.vertices[e.a].port = kind;
    geo.vertices[e.b].port = kind;
    idx += gaps[i];
  }
  geo.ports = ports;
  return geo;
}

function makeBoard(mode) {
  if (mode === "sf") return makeSeaBoard();
  setHexSize(58);
  const geo = labelIslands(buildGeometry(classicCells()));
  const tiles = shuffle(TILE_BAG.slice());
  const nums = shuffle(NUMBER_BAG.slice());
  let ni = 0;
  geo.hexes.forEach((h, i) => {
    h.type = tiles[i];
    h.num = h.type === "desert" ? null : nums[ni++];
  });
  geo.isles = [];
  return seatPorts(geo, perimeterEdges(geo));
}

/* The Seafarers board: home island, open sea, two small islands. */
function makeSeaBoard() {
  setHexSize(42);
  const geo = labelIslands(buildGeometry(seafarerCells()));
  const at = (r, c) => geo.hexes.filter(h => h.row === r && h.col === c)[0];

  const home = geo.hexes.filter(h => !h.water && h.island === geo.mainIsland);
  const tiles = shuffle(TILE_BAG.slice());
  const nums = shuffle(NUMBER_BAG.slice());
  let ni = 0;
  home.forEach((h, i) => {
    h.type = tiles[i];
    h.num = h.type === "desert" ? null : nums[ni++];
  });

  geo.isles = [];
  SF_ISLES.forEach(spec => {
    const t = shuffle(spec.tiles.slice()), n = shuffle(spec.nums.slice());
    let id = null, cx = 0, cy = 0;
    spec.cells.forEach((rc, j) => {
      const h = at(rc[0], rc[1]);
      h.type = t[j];
      h.num = n[j];
      id = h.island;
      cx += h.x; cy += h.y;
    });
    geo.isles.push({ name: spec.name, island: id, x: cx / spec.cells.length, y: cy / spec.cells.length });
  });

  const pirate = at(SF_PIRATE_START[0], SF_PIRATE_START[1]);
  geo.pirateStart = pirate ? pirate.id : geo.hexes.filter(h => h.water)[0].id;
  return seatPorts(geo, perimeterEdges(geo, geo.mainIsland));
}

function makePlayer(i, name) {
  return {
    id: i,
    name: name || "Player " + (i + 1),
    color: PLAYER_COLORS[i].hex,

    res: { lumber: 0, brick: 0, wool: 0, grain: 0, ore: 0 },
    com: { paper: 0, cloth: 0, coin: 0 },
    roadsLeft: 15, shipsLeft: SHIPS_PER_PLAYER,
    settlementsLeft: 5, citiesLeft: 4, wallsLeft: 3,
    dev: [], devBoughtThisTurn: [], playedKnights: 0, devPlayedThisTurn: false,
    prog: [],
    vpCards: 0,          // Defender of Catan + Printer + Constitution
    imp: { trade: 0, politics: 0, science: 0 },
    metros: [],          // list of track names owned

    knightUsedPromote: [],
    hasMerchant: false,
    turnFlags: {}
  };
}

   Game state and rule helpers
   ============================================================ */

const G = {
  mode: "base",           // "base" | "ck" | "sf"
  players: [],
  cur: 0,
  phase: "setup1",        // setup1 | setup2 | roll | main | over
  geo: null,
  robber: null,
  pirate: null,
  merchantHex: null,
  merchantOwner: null,
  dev: [],
  progDecks: { trade: [], politics: [], science: [] },
  barb: 0,
  barbAttacked: false,
  dice: [null, null],
  eventDie: null,
  longestRoad: null,
  largestArmy: null,
  setupOrder: [],
  setupStep: 0,
  setupPlaced: null,
  pending: null,          // { kind, ... } — awaiting a board click
  log: [],
  winner: null,
  target: 10
};

/* ---------- mode, terrain and coastline helpers ---------- */
const isCK = () => G.mode === "ck";
const isSF = () => G.mode === "sf";

function robberTargets() { return G.geo.hexes.filter(h => !h.water && h.id !== G.robber).map(h => h.id); }
function pirateTargets() { return G.geo.hexes.filter(h => h.water && h.id !== G.pirate).map(h => h.id); }
function edgeHasLand(e) { return e.hexes.some(hid => !G.geo.hexes[hid].water); }
function edgeHasSea(e)  { return e.hexes.some(hid => G.geo.hexes[hid].water); }
function vertexOnLand(v) { return v.hexes.some(hid => !G.geo.hexes[hid].water); }
function routeWord() { return isSF() ? "longest trade route" : "longest road"; }
function isleName(id) {
  const m = (G.geo.isles || []).filter(i => i.island === id)[0];
  return m ? m.name : "the home island";
}
/* islands, other than the home island, where a player has a building */
function newIslandsOf(p) {
  const out = [];
  G.geo.vertices.forEach(v => {
    if (!v.building || v.building.p !== p.id) return;
    v.hexes.forEach(hid => {
      const h = G.geo.hexes[hid];
      if (h.water || h.island === G.geo.mainIsland) return;
      if (out.indexOf(h.island) < 0) out.push(h.island);
    });
  });
  return out;
}

/* ---------- card bookkeeping ---------- */
function hasCard(p, k) { return (k in p.res) ? p.res[k] : p.com[k]; }
function addCard(p, k, n) {
  if (n === undefined) n = 1;
  if (k in p.res) p.res[k] = Math.max(0, p.res[k] + n);
  else p.com[k] = Math.max(0, p.com[k] + n);
}
function handCount(p) { return sum(RES.map(r => p.res[r])) + sum(COM.map(c => p.com[c])); }
function handList(p) {
  const a = [];
  RES.forEach(r => { for (let i = 0; i < p.res[r]; i++) a.push(r); });
  COM.forEach(c => { for (let i = 0; i < p.com[c]; i++) a.push(c); });
  return a;
}
function canPay(p, cost) { return Object.keys(cost).every(k => hasCard(p, k) >= cost[k]); }
function pay(p, cost) { Object.keys(cost).forEach(k => addCard(p, k, -cost[k])); }
function costText(cost) {
  return Object.keys(cost).map(k => cost[k] + " " + k).join(", ");
}

function handLimit(p) {
  if (G.mode !== "ck") return 7;
  let walls = 0;
  G.geo.vertices.forEach(v => {
    if (v.building && v.building.p === p.id && v.building.wall) walls++;
  });
  return 7 + walls * 2;
}

/* ---------- victory points ---------- */
function publicVP(p) {
  let vp = 0;
  G.geo.vertices.forEach(v => {
    if (!v.building || v.building.p !== p.id) return;
    vp += v.building.type === "city" ? 2 : 1;
    if (v.building.metro) vp += 2;
  });
  if (G.longestRoad === p.id) vp += 2;
  if (!isCK() && G.largestArmy === p.id) vp += 2;
  if (isCK()) {
    vp += p.vpCards;
    if (p.hasMerchant) vp += 1;
  }
  if (isSF()) vp += 2 * newIslandsOf(p).length;   // first settlement on each new island
  return vp;
}
function totalVP(p) {
  let vp = publicVP(p);
  if (!isCK()) vp += p.dev.filter(d => d === "vp").length;
  return vp;
}

/* ---------- board queries ---------- */
function ownsBuildingAt(v, pid) { return v.building && v.building.p === pid; }

function vertexOpen(vid) {
  const v = G.geo.vertices[vid];
  if (v.building) return false;
  return v.adj.every(a => !G.geo.vertices[a].building);
}

function playerTouchesVertex(vid, pid) {
  const v = G.geo.vertices[vid];
  if (ownsBuildingAt(v, pid)) return true;
  return v.edges.some(e => G.geo.edges[e].road === pid);
}

function legalSettlementSpots(pid, setup) {
  const out = [];
  G.geo.vertices.forEach(v => {
    if (!vertexOpen(v.id)) return;
    if (v.knight) return;
    if (isSF()) {
      if (!vertexOnLand(v)) return;                       // no settling open water
      // the opening pieces are placed on the home island
      if (setup && !v.hexes.some(hid => {
        const h = G.geo.hexes[hid];
        return !h.water && h.island === G.geo.mainIsland;
      })) return;
    }
    if (!setup) {
      const linked = v.edges.some(e => G.geo.edges[e].road === pid);
      if (!linked) return;
    }
    out.push(v.id);
  });
  return out;
}

function legalRoadSpots(pid, fromVertex) {
  const out = [];
  G.geo.edges.forEach(e => {
    if (e.road !== null) return;
    if (isSF() && !edgeHasLand(e)) return;                // roads keep to the land
    if (fromVertex !== undefined && fromVertex !== null) {
      if (e.a === fromVertex || e.b === fromVertex) out.push(e.id);
      return;
    }
    const ok = [e.a, e.b].some(v => {
      const vx = G.geo.vertices[v];
      if (vx.building && vx.building.p === pid) return true;
      if (vx.building && vx.building.p !== pid) return false;
      if (vx.knight && vx.knight.p !== pid) return false;
      return vx.edges.some(ei => G.geo.edges[ei].road === pid);
    });
    if (ok) out.push(e.id);
  });
  return out;
}

/* Ships run along any edge touching water, out from your own coastal
   buildings or from the end of a shipping route you already own.       */
function legalShipSpots(pid, fromVertex) {
  if (!isSF()) return [];
  const out = [];
  G.geo.edges.forEach(e => {
    if (e.road !== null) return;
    if (!edgeHasSea(e)) return;
    if (G.pirate !== null && e.hexes.indexOf(G.pirate) >= 0) return;
    if (fromVertex !== undefined && fromVertex !== null) {
      if (e.a === fromVertex || e.b === fromVertex) out.push(e.id);
      return;
    }
    const ok = [e.a, e.b].some(vid => {
      const v = G.geo.vertices[vid];
      if (v.building) return v.building.p === pid;        // routes change hands at a building
      if (v.knight && v.knight.p !== pid) return false;
      return v.edges.some(ei => G.geo.edges[ei].road === pid && G.geo.edges[ei].ship);
    });
    if (ok) out.push(e.id);
  });
  return out;
}

/* An open ship sits at the loose end of a route and may be re-sailed. */
function openShipsOf(pid) {
  return G.geo.edges.filter(e => {
    if (e.road !== pid || !e.ship || e.newShip) return false;
    return [e.a, e.b].some(vid => {
      const v = G.geo.vertices[vid];
      if (v.building && v.building.p === pid) return false;
      return !v.edges.some(ei => ei !== e.id && G.geo.edges[ei].road === pid && G.geo.edges[ei].ship);
    });
  }).map(e => e.id);
}

function legalCitySpots(pid) {
  return G.geo.vertices
    .filter(v => v.building && v.building.p === pid && v.building.type === "settlement")
    .map(v => v.id);
}

function legalKnightSpots(pid) {
  const out = [];
  G.geo.vertices.forEach(v => {
    if (v.building || v.knight) return;
    const linked = v.edges.some(e => G.geo.edges[e].road === pid);
    if (linked) out.push(v.id);
  });
  return out;
}

/* Vertices reachable along a player's own roads, stopping at blockers. */
function roadReachable(pid, startV) {
  const seen = new Set([startV]);
  const stack = [startV];
  const out = [];
  while (stack.length) {
    const cur = stack.pop();
    G.geo.vertices[cur].edges.forEach(ei => {
      const e = G.geo.edges[ei];
      if (e.road !== pid) return;
      const nxt = e.a === cur ? e.b : e.a;
      if (seen.has(nxt)) return;
      seen.add(nxt);
      out.push(nxt);
      const v = G.geo.vertices[nxt];
      const blocked = (v.building && v.building.p !== pid) || (v.knight && v.knight.p !== pid);
      if (!blocked) stack.push(nxt);
    });
  }
  return out;
}

/* ---------- longest road ---------- */
function longestRoadFor(pid) {
  const owned = G.geo.edges.filter(e => e.road === pid);
  if (!owned.length) return 0;
  let best = 0;
  const blockedAt = v => {
    const vx = G.geo.vertices[v];
    if (vx.building && vx.building.p !== pid) return true;
    if (vx.knight && vx.knight.p !== pid) return true;
    return false;
  };
  /* In Seafarers a route may only change between road and ship at one of
     your own settlements or cities, so carry the last leg's type along. */
  const walk = (v, used, wasShip) => {
    if (used.size > best) best = used.size;
    if (blockedAt(v)) return;
    const vx = G.geo.vertices[v];
    const junction = !!(vx.building && vx.building.p === pid);
    vx.edges.forEach(ei => {
      const e = G.geo.edges[ei];
      if (e.road !== pid || used.has(ei)) return;
      if (isSF() && !!e.ship !== wasShip && !junction) return;
      used.add(ei);
      walk(e.a === v ? e.b : e.a, used, !!e.ship);
      used.delete(ei);
    });
  };
  owned.forEach(e => {
    walk(e.a, new Set([e.id]), !!e.ship);
    walk(e.b, new Set([e.id]), !!e.ship);
  });
  return best;
}

function refreshLongestRoad() {
  const lens = G.players.map(p => longestRoadFor(p.id));
  const best = Math.max.apply(null, lens);
  const holder = G.longestRoad;
  if (best < 5) {
    if (holder !== null) { G.longestRoad = null; note("The " + routeWord() + " falls below 5 and is vacant."); }
    return;
  }
  const leaders = lens.map((l, i) => [l, i]).filter(x => x[0] === best).map(x => x[1]);
  if (holder !== null && leaders.includes(holder)) return;   // holder keeps it on a tie
  if (leaders.length === 1) {
    G.longestRoad = leaders[0];
    note(G.players[leaders[0]].name + " takes the " + routeWord() + " (" + best + ").", "hi");
  } else if (holder !== null) {
    G.longestRoad = null;
    note("The " + routeWord() + " is tied and goes unclaimed.");
  }
}

function refreshLargestArmy() {
  if (isCK()) return;
  let best = 2, who = G.largestArmy;
  if (who !== null) best = G.players[who].playedKnights;
  G.players.forEach(p => {
    if (p.playedKnights >= 3 && p.playedKnights > best) { best = p.playedKnights; who = p.id; }
  });
  if (who !== G.largestArmy) {
    G.largestArmy = who;
    note(G.players[who].name + " takes the largest army (" + best + ").", "hi");
  }
}

/* ---------- production ---------- */
function produce(total) {
  const gained = G.players.map(() => ({}));
  const gold = G.players.map(() => 0);
  G.geo.hexes.forEach(h => {
    if (h.num !== total) return;
    if (h.id === G.robber) return;
    const t = TERRAIN[h.type];
    if (t.gold) {
      h.vertices.forEach(vid => {
        const v = G.geo.vertices[vid];
        if (!v.building) return;
        gold[v.building.p] += v.building.type === "city" ? 2 : 1;
      });
      return;
    }
    if (!t.res) return;
    h.vertices.forEach(vid => {
      const v = G.geo.vertices[vid];
      if (!v.building) return;
      const p = G.players[v.building.p];
      const bag = gained[p.id];
      const give = (k, n) => { bag[k] = (bag[k] || 0) + n; addCard(p, k, n); };
      if (v.building.type === "settlement") {
        give(t.res, 1);
      } else {
        if (isCK()) {
          if (t.com) { give(t.res, 1); give(t.com, 1); }
          else give(t.res, 2);
        } else {
          give(t.res, 2);
        }
      }
    });
  });
  G.players.forEach(p => {
    const bag = gained[p.id];
    const keys = Object.keys(bag);
    if (keys.length) {
      note(p.name + " collects " + keys.map(k => bag[k] + " " + k).join(", ") + ".");
    } else if (isCK() && p.imp.science >= 3 && !gold[p.id]) {
      p.aqueductDue = true;
    }
  });
  return { gained, gold };
}

/* Gold fields pay out in whatever the owner asks for. */
function runGoldQueue(gold, done) {
  const queue = [];
  for (let i = 0; i < G.players.length; i++) {
    const p = G.players[(G.cur + i) % G.players.length];
    if (gold[p.id] > 0) queue.push(p);
  }
  const step = () => {
    if (!queue.length) { done(); return; }
    const p = queue.shift();
    const n = gold[p.id];
    pickCards("Gold field — " + p.name,
      "Your gold fields pay out. Take any " + n + " resource" + (n > 1 ? "s" : "") + " from the bank.",
      RES, n, picked => {
        picked.forEach(k => addCard(p, k, 1));
        note(p.name + " pans " + picked.join(", ") + " from the gold fields.");
        step();
      }, { actor: p });
  };
  step();
}

/* ---------- log ---------- */
function note(text, cls) {
  G.log.push({ text, cls: cls || "" });
  if (G.log.length > 300) G.log.shift();
}
/* ============================================================
   Rendering
   ============================================================ */
const SVGNS = "http://www.w3.org/2000/svg";
const el = (n, attrs, parent) => {
  const e = document.createElementNS(SVGNS, n);
  if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const $ = id => document.getElementById(id);

function pipDots(n) {
  const p = 6 - Math.abs(7 - n);
  return "•".repeat(p);
}

    t1.textContent = pt.kind === "any" ? "3:1" : "2:1";
    if (pt.kind !== "any") {
      const t2 = el("text", { x: px, y: py + 8 * ART, "text-anchor": "middle", "font-size": 7 * ART, fill: CARDCOLOR[pt.kind], "letter-spacing": ".5" }, gPorts);
      t2.textContent = pt.kind.slice(0, 4).toUpperCase();

    poly.addEventListener("click", () => onHexClick(h.id));

    if (h.water) {

          fill: "none", stroke: "rgba(236,224,200,.13)", "stroke-width": 1.2
        }, gHex);

    }

             " L" + gx + "," + (gy + 5 * ART) + " L" + (gx - 4 * ART) + "," + gy + " Z",

    }, gHex);

    if (h.num !== null) {

      }, gHex);
      pp.textContent = pipDots(h.num);
    }

    if (G.robber === h.id) {
      const g = el("g", { transform: "translate(" + (h.x - 22 * ART) + "," + (h.y - 4 * ART) + ") scale(" + ART + ")" }, gHex);
      el("ellipse", { cx: 0, cy: 12, rx: 9, ry: 4, fill: "rgba(0,0,0,.3)" }, g);
      el("path", { d: "M0,-14 C7,-14 9,-7 8,0 C7,7 6,11 0,11 C-6,11 -7,7 -8,0 C-9,-7 -7,-14 0,-14 Z", fill: "#181818", stroke: "#000", "stroke-width": 1 }, g);
      el("circle", { cx: -3, cy: -6, r: 1.4, fill: "#d9c8a5" }, g);
      el("circle", { cx: 3, cy: -6, r: 1.4, fill: "#d9c8a5" }, g);
    }
    if (isCK() && G.merchantHex === h.id) {
      const owner = G.merchantOwner !== null ? G.players[G.merchantOwner].color : "#fff";
      const g = el("g", { transform: "translate(" + (h.x + 22 * ART) + "," + (h.y + 2 * ART) + ") scale(" + ART + ")" }, gHex);
      el("path", { d: "M0,-13 L8,10 L-8,10 Z", fill: owner, stroke: "#0e2029", "stroke-width": 1.4 }, g);
      const tm = el("text", { y: 6, "text-anchor": "middle", "font-size": 9, "font-weight": 700, fill: "#0e2029" }, g);
      tm.textContent = "M";
    }
  });

  // ---- island names and the pirate (Seafarers) ----
  if (isSF()) {
    (G.geo.isles || []).forEach(i => {
      const t = el("text", {
        x: i.x, y: i.y - HEX_R * 1.5, "text-anchor": "middle",
        "font-size": 11, "letter-spacing": 2.4, "font-family": "var(--disp)",
        fill: "rgba(236,224,200,.62)"
      }, gHex);
      t.textContent = i.name.toUpperCase();
    });
    if (G.pirate !== null) {
      const h = G.geo.hexes[G.pirate];
      const g = el("g", { transform: "translate(" + h.x + "," + h.y + ") scale(" + ART + ")" }, gHex);
      el("ellipse", { cx: 0, cy: 17, rx: 21, ry: 5, fill: "rgba(0,0,0,.35)" }, g);
      el("path", { d: "M-20,5 L20,5 L14,16 L-14,16 Z", fill: "#141414", stroke: "#000", "stroke-width": 1.2, "stroke-linejoin": "round" }, g);
      el("line", { x1: 0, y1: 5, x2: 0, y2: -24, stroke: "#141414", "stroke-width": 2.6 }, g);
      el("path", { d: "M0,-24 L17,-15 L0,-6 Z", fill: "#141414", stroke: "#3a3a3a", "stroke-width": 1 }, g);
      el("circle", { cx: 6, cy: -16, r: 2.6, fill: "#e8e2d4" }, g);
      const t = el("text", { y: 32, "text-anchor": "middle", "font-size": 9, "letter-spacing": 1.6, fill: "rgba(236,224,200,.7)" }, g);
      t.textContent = "PIRATE";
    }
  }

  // ---- barbarian approach lane (Cities & Knights) ----
  if (isCK()) drawBarbarianLane(svg);

  // ---- roads and shipping lanes ----
  G.geo.edges.forEach(e => {
    const a = G.geo.vertices[e.a], b = G.geo.vertices[e.b];
    if (e.road === null) return;
    const c = G.players[e.road].color;
    if (e.ship) {
      el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "rgba(236,224,200,.28)",
        "stroke-width": 2 * ART, "stroke-dasharray": (5 * ART) + " " + (4 * ART), "stroke-linecap": "round" }, gEdge);
      let ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      if (ang > 90) ang -= 180;
      if (ang < -90) ang += 180;
      const g = el("g", {
        transform: "translate(" + ((a.x + b.x) / 2) + "," + ((a.y + b.y) / 2) +

      }, gEdge);

      el("path", { d: "M0.8,-13 L10,-1 L0.8,-1 Z", fill: "#f2e9d6", stroke: "#0e2029", "stroke-width": 1.1, "stroke-linejoin": "round" }, g);
      return;

    el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#0e2029", "stroke-width": 11 * ART, "stroke-linecap": "round" }, gEdge);
    el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: c, "stroke-width": 7 * ART, "stroke-linecap": "round" }, gEdge);
  });

  // ---- buildings and knights ----
  G.geo.vertices.forEach(v => {
    if (v.building) {
      const c = G.players[v.building.p].color;
      const g = el("g", { transform: "translate(" + v.x + "," + v.y + ") scale(" + ART + ")" }, gVert);
      if (v.building.wall) {

      }
      if (v.building.type === "settlement") {
        el("path", { d: "M-9,4 L-9,-3 L0,-10 L9,-3 L9,4 Z", fill: c, stroke: "#0e2029", "stroke-width": 1.6, "stroke-linejoin": "round" }, g);
      } else {
        el("path", { d: "M-13,6 L-13,-4 L-5,-10 L-5,-3 L13,-3 L13,6 Z", fill: c, stroke: "#0e2029", "stroke-width": 1.6, "stroke-linejoin": "round" }, g);
      }
      if (v.building.metro) {
        el("path", { d: "M-9,-8 L-9,-16 L-5,-16 L-5,-12 L-2,-12 L-2,-16 L2,-16 L2,-12 L5,-12 L5,-16 L9,-16 L9,-8 Z", fill: IMPROVE[v.building.metro].color, stroke: "#0e2029", "stroke-width": 1.3, "stroke-linejoin": "round" }, g);
      }

    if (v.knight) {

      const g = el("g", { transform: "translate(" + v.x + "," + v.y + ") scale(" + ART + ")" }, gVert);
      el("circle", { r: 11, fill: c, stroke: v.knight.active ? "#f2e9d6" : "#0e2029", "stroke-width": v.knight.active ? 2.6 : 1.6 }, g);
      el("circle", { r: 7, fill: "none", stroke: "rgba(14,32,41,.55)", "stroke-width": 1 }, g);
      const t = el("text", { y: 4, "text-anchor": "middle", "font-size": 11, "font-weight": 700, "font-family": "var(--disp)", fill: "#0e2029" }, g);
      t.textContent = v.knight.str;
      if (!v.knight.active) {
        el("line", { x1: -11, y1: 11, x2: 11, y2: -11, stroke: "rgba(14,32,41,.45)", "stroke-width": 2 }, g);
      }
    }
  });

  // ---- pending-action highlights ----
  const P = G.pending;
  if (P) {
    (P.vertices || []).forEach(vid => {
      const v = G.geo.vertices[vid];
      const c = el("circle", { cx: v.x, cy: v.y, r: 13 * ART, fill: "rgba(201,154,46,.28)", stroke: "#c99a2e", "stroke-width": 2.5 }, gHi);
      c.style.cursor = "pointer";
      c.addEventListener("click", ev => { ev.stopPropagation(); onVertexClick(vid); });
    });
    (P.edges || []).forEach(eid => {
      const e = G.geo.edges[eid];
      const a = G.geo.vertices[e.a], b = G.geo.vertices[e.b];
      const l = el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#c99a2e", "stroke-width": 9 * ART, "stroke-linecap": "round", opacity: ".62" }, gHi);
      l.style.cursor = "pointer";
      l.addEventListener("click", ev => { ev.stopPropagation(); onEdgeClick(eid); });
    });
    (P.hexes || []).forEach(hid => {
      const h = G.geo.hexes[hid];
      const pts = [];
      for (let i = 0; i < 6; i++) pts.push(hexCorner(h.x, h.y, i).map(v => v.toFixed(1)).join(","));
      const poly = el("polygon", { points: pts.join(" "), fill: "rgba(201,154,46,.3)", stroke: "#c99a2e", "stroke-width": 3 }, gHi);
      poly.style.cursor = "pointer";
      poly.addEventListener("click", ev => { ev.stopPropagation(); onHexClick(hid); });
    });
  }
}
