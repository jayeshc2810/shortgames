  el("line", {
    x1: x, y1: y0 - 24, x2: x, y2: y0 + gap * 6 + 26,
    stroke: "rgba(236,224,200,.2)", "stroke-width": 1.2, "stroke-dasharray": "4 6"
  }, g);

  for (let i = 1; i <= BARB_TRACK; i++) {
    const cy = y0 + (i - 1) * gap;
    const reached = i <= G.barb;
    const shore = i === BARB_TRACK;
    el("circle", {
      cx: x, cy, r: shore ? 13 : 9,
      fill: reached ? "#b3352a" : "rgba(10,26,36,.7)",
      stroke: shore ? "#b3352a" : "rgba(236,224,200,.38)",
      "stroke-width": shore ? 2.4 : 1.3
    }, g);
    if (shore) {
      const t = el("text", {
        x, y: cy + 4, "text-anchor": "middle", "font-size": 12,
        "font-weight": 700, "font-family": "var(--disp)", fill: reached ? "#fff" : "#b3352a"
      }, g);
      t.textContent = "!";
    }
  }

  const sy = G.barb === 0 ? y0 - 38 : y0 + (G.barb - 1) * gap;
  const ship = el("g", { transform: "translate(" + x + "," + sy + ")" }, g);
  el("path", { d: "M-15,3 L15,3 L10,12 L-10,12 Z", fill: "#141414", stroke: "#000", "stroke-width": 1.2, "stroke-linejoin": "round" }, ship);
  el("line", { x1: 0, y1: 3, x2: 0, y2: -17, stroke: "#141414", "stroke-width": 2.2 }, ship);
  el("path", { d: "M0,-17 L13,-8 L0,-2 Z", fill: "#b3352a", stroke: "#0e2029", "stroke-width": 1, "stroke-linejoin": "round" }, ship);

  if (G.barb === BARB_TRACK - 1) {
    const w = el("text", {
      x, y: y0 + gap * 6 + 46, "text-anchor": "middle", "font-size": 9,
      "letter-spacing": 1.4, "font-weight": 700, fill: "#b3352a"
    }, g);
    w.textContent = "ONE SHIP FROM LANDFALL";
  }

  const atk = barbarianStrength(), def = knightStrengthTotal();
  [["ATTACK", atk, "#b3352a"], ["KNIGHTS", def, def >= atk ? "#7fb069" : "#c99a2e"]]
    .forEach((row, i) => {
      const yy = y0 + gap * 6 + 70 + i * 18;
      const a = el("text", { x: x - 4, y: yy, "text-anchor": "end", "font-size": 9, "letter-spacing": 1.3, fill: "var(--chart-3)" }, g);
      a.textContent = row[0];
      const b = el("text", { x: x + 6, y: yy, "font-size": 14, "font-weight": 700, "font-family": "var(--disp)", fill: row[2] }, g);
      b.textContent = row[1];
    });
}

/* ---------- side panel ---------- */
function cardChip(k, n, commodity) {
  return '<span class="card' + (n ? "" : " zero") + (commodity ? " commodity" : "") + '">' +
    '<span class="dot" style="background:' + CARDCOLOR[k] + '"></span>' + cap(k) + " " + n + "</span>";
}

function drawPanel() {
  const p = G.players[G.cur];
  $("brand").innerHTML = isCK() ? 'CATAN <span>&amp;</span> CITIES AND KNIGHTS'
    : isSF() ? 'CATAN <span>&amp;</span> SEAFARERS' : "CATAN";
  $("modeTag").textContent = isCK() ? "CITIES & KNIGHTS" : isSF() ? "SEAFARERS" : "BASE GAME";
  $("turnSwatch").style.background = p.color;
  $("turnName").textContent = p.name + (isAI(p) ? " (bot)" : "") + " · " + totalVP(p) + " VP";
  $("handTitle").textContent = "HAND — " + p.name.toUpperCase() +
    " (" + handCount(p) + "/" + handLimit(p) + ")";

  let h = RES.map(r => cardChip(r, p.res[r], false)).join("");
  if (isCK()) h += COM.map(c => cardChip(c, p.com[c], true)).join("");
  if (!isCK()) {
    const vpN = p.dev.filter(d => d === "vp").length;
    const playN = playableDev(p).length;
    const held = p.dev.length;
    h += '<span class="card" style="background:#e9dcc0;border-style:dashed">Dev cards ' + held +
      (vpN ? " · " + vpN + " VP" : "") +
      (held ? " · " + playN + " playable" : "") + "</span>";
  }
  $("hand").innerHTML = h;

  // dice
  let dh = "";
  if (G.dice[0]) {
    dh += '<div class="die yellow">' + G.dice[0] + "</div>";
    dh += '<div class="die red">' + G.dice[1] + "</div>";
  }
  if (isCK() && G.eventDie) {
    const lab = G.eventDie === "barbarian" ? "SHIP" : G.eventDie.slice(0, 4).toUpperCase();
    dh += '<div class="die event ' + (G.eventDie === "barbarian" ? "" : G.eventDie) + '">' + lab + "</div>";
  }
  $("diceBox").innerHTML = dh;

  // barbarian rail
  if (isCK()) {
    let nodes = "";
    for (let i = 1; i <= BARB_TRACK; i++) {
      nodes += '<div class="rail-node' + (i === BARB_TRACK ? " last" : "") +
        (i <= G.barb ? " on" : "") + (i === G.barb + 1 ? " next" : "") + '"></div>';
    }
    const str = G.geo ? barbarianStrength() : 0;
    const def = G.geo ? knightStrengthTotal() : 0;
    $("railBox").innerHTML =
      '<span class="rail-label">Barbarians</span>' +
      '<div class="rail-track">' + nodes + "</div>" +
      '<span class="rail-strength">attack <b>' + str + "</b> · knights <b>" + def + "</b></span>";
  } else {
    $("railBox").innerHTML = "";
  }

  // improvements
  $("barbPane").style.display = isCK() ? "" : "none";
  $("seaPane").style.display = isSF() ? "" : "none";
  if (isCK()) drawMuster();
  if (isSF()) drawSeaPane();
  if (isCK()) {
    $("impPane").style.display = "";
    $("knPane").style.display = "";
    $("imps").innerHTML = TRACKS.map(t => {
      const lvl = p.imp[t];
      let pips = "";
      for (let i = 1; i <= 5; i++) {
        pips += '<div class="pip" style="background:' + (i <= lvl ? IMPROVE[t].color : "transparent") + '"></div>';
      }
      const nextCost = lvl < 5 ? lvl + 1 + " " + IMPROVE[t].com : "max";
      const owns = p.metros.includes(t) ? " ★" : "";
      return '<div class="imp"><span class="nm">' + IMPROVE[t].label + owns + '</span>' +
        '<div class="pips">' + pips + "</div>" +
        '<span class="cost">' + nextCost + "</span></div>";
    }).join("");

    const ks = p.knightsPlaced.map(vid => {
      const k = G.geo.vertices[vid].knight;
      if (!k) return "";
      const nm = k.str === 1 ? "Basic" : k.str === 2 ? "Strong" : "Mighty";
      return '<span class="kn' + (k.active ? " active" : "") + '"><span class="st">' + k.str + "</span>" +
        nm + (k.active ? " · ready" : " · idle") + "</span>";
    }).join("");
    $("knights").innerHTML = ks || '<span class="muted">No knights on the board.</span>';
  } else {
    $("impPane").style.display = "none";
    $("knPane").style.display = "none";
  }

  $("speedWrap").style.display = G.players.some(isAI) ? "" : "none";

  drawActions();

  $("log").innerHTML = G.log.slice(-90).map(l => '<p class="' + l.cls + '">' + esc(l.text) + "</p>").join("");
  $("log").scrollTop = $("log").scrollHeight;

  $("score").innerHTML = G.players.map(pl => {
    const bits = [];
    if (G.longestRoad === pl.id) bits.push(routeWord());
    if (!isCK() && G.largestArmy === pl.id) bits.push("largest army");
    if (isCK() && pl.hasMerchant) bits.push("merchant");
    if (isCK() && pl.metros.length) bits.push(pl.metros.length + " metropolis");
    if (isCK() && pl.vpCards) bits.push(pl.vpCards + " VP card" + (pl.vpCards > 1 ? "s" : ""));
    if (isSF()) {
      const isl = newIslandsOf(pl).length;
      if (isl) bits.push(isl + " new island" + (isl > 1 ? "s" : ""));
    }
    const cards = isCK() ? pl.prog.length + " progress" : pl.dev.length + " dev";
    return '<div class="row' + (pl.id === G.cur ? " turn" : "") + '">' +
      '<span class="swatch" style="background:' + pl.color + '"></span>' +
      '<span class="nm">' + pl.name + (isAI(pl) ? ' <span class="tag">bot</span>' : "") + '<span class="mini"> — ' + handCount(pl) + " cards, " + cards +
      (bits.length ? " · " + bits.join(", ") : "") + "</span></span>" +
      '<span class="vp">' + publicVP(pl) + "</span></div>";
  }).join("");

  // hint bar
  if (G.pending && G.pending.hint) {
    $("hintText").textContent = G.pending.hint;
    $("hint").classList.add("show");
    $("hintCancel").style.display = G.pending.mandatory ? "none" : "";
  } else {
    $("hint").classList.remove("show");
  }
}

/* Who is holding the line, and who the barbarians would take a city from. */
function drawMuster() {
  const atk = barbarianStrength();
  const per = G.players.map(pl => knightStrengthOf(pl.id));
  const def = sum(per);
  const best = Math.max.apply(null, per);
  const held = def >= atk;
  const sackable = G.players.filter(pl => G.geo.vertices.some(v =>
    v.building && v.building.p === pl.id && v.building.type === "city" && !v.building.metro)).map(pl => pl.id);
  const low = sackable.length ? Math.min.apply(null, sackable.map(id => per[id])) : -1;
  const scale = Math.max(atk, def, 1);

  let h = '<div class="mhead"><span>attack ' + atk + " · defence " + def + "</span>" +
    '<span class="lead' + (held ? "" : " bad") + '">' + (held ? "Catan holds" : "Catan falls") + "</span></div>";

  h += G.players.map((pl, i) => {
    const flag = held
      ? (per[i] === best && best > 0 && per.filter(x => x === best).length === 1
          ? '<span class="mflag def">defender</span>' : "")
      : (sackable.indexOf(pl.id) >= 0 && per[i] === low ? '<span class="mflag risk">at risk</span>' : "");
    return '<div class="mrow"><span class="swatch" style="background:' + pl.color + '"></span>' +
      '<span class="nm">' + esc(pl.name) + "</span>" +
      '<span class="mbar"><i style="width:' + Math.round(per[i] / scale * 100) + '%;background:' + pl.color + '"></i></span>' +
      flag + '<span class="val">' + per[i] + "</span></div>";
  }).join("");

  h += '<p class="mnote">The ship moves one berth on every barbarian face and lands on the ' + BARB_TRACK +
    "th. Attack strength is <b>one per city on the board</b>; defence counts <b>active knights only</b>. " +
    (held
      ? "The single strongest court is named Defender of Catan; a tie draws progress cards instead."
      : "The weakest court loses a city to the sack — a city carrying a metropolis is spared.") + "</p>";
  $("muster").innerHTML = h;
}

/* Ships, lanes, the pirate and the race for the smaller islands. */
function drawSeaPane() {
  const p = cur();
  const blocked = G.pirate === null ? 0 :
    G.geo.hexes[G.pirate].edges.filter(eid => edgeHasSea(G.geo.edges[eid])).length;
  const rows = [
    ["Ships in reserve", p.shipsLeft + " of " + SHIPS_PER_PLAYER],
    ["Roads in reserve", p.roadsLeft + " of 15"],
    ["Ship may still sail", p.turnFlags.shipMoved ? "spent this turn" : (openShipsOf(p.id).length ? "yes" : "no open ship")],
    ["Longest trade route", G.longestRoad === null ? "unclaimed" : esc(G.players[G.longestRoad].name)],
    ["Pirate", G.pirate === null ? "off the board" : blocked + " lanes closed"]
  ];
  let h = rows.map(r => '<div class="sea-row"><span class="k">' + r[0] + "</span><b>" + r[1] + "</b></div>").join("");

  const chips = (G.geo.isles || []).map(i => {
    const owners = G.players.filter(pl => newIslandsOf(pl).indexOf(i.island) >= 0);
    const mine = owners.some(o => o.id === p.id);
    const cls = mine ? "isle mine" : owners.length ? "isle claimed" : "isle";
    return '<span class="' + cls + '">' + esc(i.name) + " · " +
      (owners.length ? esc(owners.map(o => o.name).join(", ")) : "open") + "</span>";
  }).join("");
  if (chips) h += '<div class="isles">' + chips + "</div>";
  h += '<p class="mnote">A ship costs ' + costText(COST.ship) +
    " and runs on water only. Roads and shipping lanes join into one trade route, but they may only " +
    "change over at your own settlement or city. Your <b>first settlement on each smaller island is worth 2 extra points</b>.</p>";
  $("seaBox").innerHTML = h;
}

function render() { drawBoard(); drawPanel(); scheduleAI(); }
/* ============================================================
   Turn flow and player actions
   ============================================================ */

function cur() { return G.players[G.cur]; }

function setPending(obj) { G.pending = obj; render(); }
function clearPending() { G.pending = null; render(); }

/* ---------- setup ---------- */
function beginSetup() {
  const n = G.players.length;
  const fwd = [], back = [];
  for (let i = 0; i < n; i++) { fwd.push(i); back.push(n - 1 - i); }
  G.setupOrder = fwd.concat(back);
  G.setupStep = 0;
  G.phase = "setup1";
  nextSetupPlacement();
}

function nextSetupPlacement() {
  if (G.setupStep >= G.setupOrder.length) {
    G.phase = "roll";
    G.cur = G.setupOrder[G.setupOrder.length - 1];
    note("Setup complete. " + cur().name + " opens the game.", "hi");
    clearPending();
    return;
  }
  G.cur = G.setupOrder[G.setupStep];
  const second = G.setupStep >= G.players.length;
  G.phase = second ? "setup2" : "setup1";
  const what = (G.mode === "ck" && second) ? "city" : "settlement";
  setPending({
    kind: "setupBuilding", actor: G.cur,
    what,
    vertices: legalSettlementSpots(G.cur, true),
    hint: cur().name + ": place your " + (second ? "second " : "first ") + what + ".",
    mandatory: true
  });
}

function placeSetupBuilding(vid) {
  const p = cur();
  const second = G.phase === "setup2";
  const type = (G.mode === "ck" && second) ? "city" : "settlement";
  const v = G.geo.vertices[vid];
  v.building = { p: p.id, type, wall: false, metro: null };
  if (type === "city") { p.citiesLeft--; } else { p.settlementsLeft--; }
  note(p.name + " places a " + type + ".");

  if (second) {
    const bag = {};
    v.hexes.forEach(hid => {
      const h = G.geo.hexes[hid];
      const t = TERRAIN[h.type];
      if (!t.res) return;
      bag[t.res] = (bag[t.res] || 0) + 1;
      addCard(p, t.res, 1);
    });
    const keys = Object.keys(bag);
    if (keys.length) note(p.name + " collects " + keys.map(k => bag[k] + " " + k).join(", ") + ".");
  }

  const links = legalRoadSpots(p.id, vid).concat(legalShipSpots(p.id, vid));
  setPending({
    kind: "setupRoad", actor: p.id,
    from: vid,
    edges: links.filter((x, i) => links.indexOf(x) === i),
    hint: p.name + (isSF() ? ": attach a road or a ship to it." : ": place the road attached to it."),
    mandatory: true
  });
}

function placeSetupRoad(eid) {
  const p = cur();
  const e = G.geo.edges[eid];
  const settle = ship => {
    e.road = p.id;
    e.ship = !!ship;
    if (ship) p.shipsLeft--; else p.roadsLeft--;
    note(p.name + (ship ? " launches a ship." : " lays a road."));
    refreshLongestRoad();
    G.setupStep++;
    nextSetupPlacement();
  };
  if (isSF() && edgeHasLand(e) && edgeHasSea(e)) {
    chooseOption("Road or ship", "That stretch runs along the coast — it can carry either.", [
      { label: "Lay a road", sub: "Stays on land, links to your inland network", value: 0 },
      { label: "Launch a ship", sub: "Heads out to sea toward the smaller islands", value: 1 }
    ], v => settle(v === 1), true, { actor: p, aiPick: its => (Math.random() < 0.3 ? 1 : 0) });
    return;
  }
  settle(isSF() && !edgeHasLand(e));
}

/* ---------- rolling ---------- */
function rollDice(forced) {
  const p = cur();
  const a = forced ? forced[0] : d6();
  const b = forced ? forced[1] : d6();
  G.dice = [a, b];
  const total = a + b;

  if (G.mode === "ck") {
    G.eventDie = EVENT_FACES[Math.floor(Math.random() * 6)];
    note(p.name + " rolls " + a + " + " + b + " = " + total + " · event: " +
      (G.eventDie === "barbarian" ? "barbarian ship" : G.eventDie + " gate"), "hi");
    resolveEventDie(() => resolveProduction(total));
  } else {
    note(p.name + " rolls " + a + " + " + b + " = " + total + ".", "hi");
    resolveProduction(total);
  }
}

function resolveProduction(total) {
  G.players.forEach(pl => { pl.aqueductDue = false; });
  if (total === 7) {
    G.phase = "main";
    startDiscards(() => {
      if (isCK() && !G.barbAttacked) {
        note("The robber stays put — the barbarians have not yet landed.");
        render();
        return;
      }
      if (isSF()) { chooseRaider(); return; }
      setPending({
        kind: "moveRobber",
        hexes: robberTargets(),
        hint: cur().name + ": move the robber.",
        mandatory: true
      });
    });
    return;
  }
  const yield_ = produce(total);
  G.phase = "main";
  if (isSF()) { runGoldQueue(yield_.gold, () => render()); return; }
  if (!isCK()) { render(); return; }

  const queue = [];
  for (let i = 0; i < G.players.length; i++) {
    const p = G.players[(G.cur + i) % G.players.length];
    if (p.aqueductDue) queue.push(p);
  }
  const step = () => {
    if (!queue.length) { render(); return; }
    const p = queue.shift();
    p.aqueductDue = false;
    pickCards("Aqueduct — " + p.name, "Your holdings produced nothing. Take any 1 resource from the bank.", RES, 1, picked => {
      addCard(p, picked[0], 1);
      note(p.name + " draws 1 " + picked[0] + " from the aqueduct.");
      step();
    }, { actor: p });
  };
  step();
}

/* ---------- discards on a 7 ---------- */
function startDiscards(done) {
  const queue = G.players.filter(p => handCount(p) > handLimit(p)).map(p => p.id);
  const step = () => {
    if (!queue.length) { done(); return; }
    const p = G.players[queue.shift()];
    const n = Math.floor(handCount(p) / 2);
    discardDialog(p, n, step);
  };
  step();
}

/* ---------- robber ---------- */
function moveRobberTo(hid, stealAll) {
  G.robber = hid;
  note(cur().name + " moves the robber to the " + TERRAIN[G.geo.hexes[hid].type].label.toLowerCase() + ".");
  const victims = [];
  G.geo.hexes[hid].vertices.forEach(vid => {
    const v = G.geo.vertices[vid];
    if (v.building && v.building.p !== G.cur && !victims.includes(v.building.p)) victims.push(v.building.p);
  });
  const withCards = victims.filter(id => handCount(G.players[id]) > 0);
  clearPending();
  if (!withCards.length) { render(); return; }

  if (stealAll) {
    withCards.forEach(id => stealRandom(G.players[id], cur()));
    render();
    return;
  }
  if (withCards.length === 1) { stealRandom(G.players[withCards[0]], cur()); render(); return; }
  choosePlayer("Steal a card", "Take 1 random card from one neighbour.",
    withCards, id => { stealRandom(G.players[id], cur()); render(); });
}

/* Seafarers: a seven sends either the robber ashore or the pirate to sea. */
function chooseRaider() {
  const p = cur();
  chooseOption("Robber or pirate", "Seven is rolled. Send one of them somewhere new.", [
    { label: "Move the robber", sub: "Shut down a land hex and steal from a neighbour", value: "r" },
    { label: "Move the pirate", sub: "Close a stretch of sea and raid a ship alongside", value: "p" }
  ], v => {
    if (v === "p") {
      setPending({ kind: "movePirate", hexes: pirateTargets(), hint: p.name + ": move the pirate.", mandatory: true });
    } else {
      setPending({ kind: "moveRobber", hexes: robberTargets(), hint: p.name + ": move the robber.", mandatory: true });
    }
  }, true, { aiPick: its => aiPickRaider(p, its) });
}

function movePirateTo(hid) {
  G.pirate = hid;
  note(cur().name + " sails the pirate into open water — no ship may be laid alongside it.");
  const victims = [];
  G.geo.hexes[hid].edges.forEach(eid => {
    const e = G.geo.edges[eid];
    if (e.road === null || !e.ship || e.road === G.cur) return;
    if (victims.indexOf(e.road) < 0) victims.push(e.road);
  });
  const withCards = victims.filter(id => handCount(G.players[id]) > 0);
  clearPending();
  if (!withCards.length) { note("No laden ship is within reach."); render(); return; }
  if (withCards.length === 1) { stealRandom(G.players[withCards[0]], cur()); render(); return; }
  choosePlayer("Raid a ship", "Take 1 random card from one of the ships alongside.",
    withCards, id => { stealRandom(G.players[id], cur()); render(); });
}

function stealRandom(from, to) {
  const list = handList(from);
  if (!list.length) return;
  const k = list[Math.floor(Math.random() * list.length)];
  addCard(from, k, -1);
  addCard(to, k, 1);
  note(to.name + " takes 1 " + k + " from " + from.name + ".", "bad");
}

/* ---------- building ---------- */
function actBuildRoad(free) {
  const p = cur();
  const spots = legalRoadSpots(p.id);
  if (!spots.length) { toast("No legal road placement."); return; }
  setPending({
    kind: "road", free: !!free, edges: spots,
    hint: free ? "Place a free road." : "Place a road (" + costText(COST.road) + ")."
  });
}
function doBuildRoad(eid, free) {
  const p = cur();
  if (!free) pay(p, COST.road);
  G.geo.edges[eid].road = p.id;
  p.roadsLeft--;
  note(p.name + " builds a road.");
  refreshLongestRoad();
  clearPending();
  checkWin();
}

/* ---------- ships ---------- */
function actBuildShip(free) {
  const p = cur();
  if (p.shipsLeft <= 0) { toast("Every ship you own is already at sea."); return; }
  const spots = legalShipSpots(p.id);
  if (!spots.length) { toast("No open water reaches your coast or your shipping route."); return; }
  setPending({
    kind: "ship", free: !!free, edges: spots,
    hint: free ? "Launch a ship at no cost." : "Launch a ship (" + costText(COST.ship) + ")."
  });
}
function doBuildShip(eid, free) {
  const p = cur();
  if (!free) pay(p, COST.ship);
  const e = G.geo.edges[eid];
  e.road = p.id; e.ship = true; e.newShip = true;
  p.shipsLeft--;
  note(p.name + " launches a ship.");
  refreshLongestRoad();
  clearPending();
  checkWin();
}

function actMoveShip() {
  const p = cur();
  if (p.turnFlags.shipMoved) { toast("Only one ship may be re-sailed per turn."); return; }
  const open = openShipsOf(p.id);
  if (!open.length) { toast("No ship is free to move — only the loose end of a route can sail on."); return; }
  setPending({ kind: "shipLift", edges: open, hint: "Choose the ship you want to re-sail." });
}
function doLiftShip(eid) {
  const p = cur();
  const e = G.geo.edges[eid];
  e.road = null; e.ship = false;
  const spots = legalShipSpots(p.id).filter(x => x !== eid);
  if (!spots.length) {
    e.road = p.id; e.ship = true;
    toast("That ship has nowhere better to go.");
    clearPending();
    return;
  }
  setPending({ kind: "shipDrop", from: eid, edges: spots, hint: "Where should the ship sail to?", mandatory: true });
}
function doDropShip(eid, from) {
  const p = cur();
  const e = G.geo.edges[eid];
  e.road = p.id; e.ship = true; e.newShip = true;
  p.turnFlags.shipMoved = true;
  note(p.name + " re-sails a ship.");
  refreshLongestRoad();
  clearPending();
  checkWin();
}

function actBuildSettlement() {
  const p = cur();
  const spots = legalSettlementSpots(p.id, false);
  if (!spots.length) { toast("No legal settlement spot on your network."); return; }
  setPending({ kind: "settlement", vertices: spots, hint: "Place a settlement (" + costText(COST.settlement) + ")." });
}
function doBuildSettlement(vid) {
  const p = cur();
  pay(p, COST.settlement);
  G.geo.vertices[vid].building = { p: p.id, type: "settlement", wall: false, metro: null };
  p.settlementsLeft--;
  note(p.name + " builds a settlement.");
  refreshLongestRoad();
  clearPending();
  checkWin();
}

function actBuildCity(discount) {
  const p = cur();
  const spots = legalCitySpots(p.id);
  if (!spots.length) { toast("You have no settlement to upgrade."); return; }
  setPending({ kind: "city", discount: !!discount, vertices: spots,
    hint: "Upgrade a settlement to a city (" + costText(discount ? { ore: 2, grain: 1 } : COST.city) + ")." });
}
function doBuildCity(vid, discount) {
  const p = cur();
  pay(p, discount ? { ore: 2, grain: 1 } : COST.city);
  G.geo.vertices[vid].building.type = "city";
  p.citiesLeft--; p.settlementsLeft++;
  note(p.name + " upgrades to a city.");
  clearPending();
  checkWin();
}

/* ---------- bank & port trading ---------- */
function tradeRates(p) {
  const rate = {};
  ALLCARDS.forEach(k => { rate[k] = 4; });
  const owned = new Set();
  G.geo.vertices.forEach(v => {
    if (v.building && v.building.p === p.id && v.port) owned.add(v.port);
  });
  if (owned.has("any")) ALLCARDS.forEach(k => { rate[k] = Math.min(rate[k], 3); });
  RES.forEach(r => { if (owned.has(r)) rate[r] = Math.min(rate[r], 2); });
  if (isCK()) {
    if (p.imp.trade >= 3) COM.forEach(c => { rate[c] = Math.min(rate[c], 2); });
    if (p.hasMerchant && G.merchantHex !== null) {
      const t = TERRAIN[G.geo.hexes[G.merchantHex].type];
      if (t.res) rate[t.res] = Math.min(rate[t.res], 2);
    }
    if (p.turnFlags.fleet) rate[p.turnFlags.fleet] = Math.min(rate[p.turnFlags.fleet], 2);
  }
  return rate;
}

/* ---------- development cards (base game) ---------- */
function actBuyDev() {
  const p = cur();
  if (!G.dev.length) { toast("The development deck is empty."); return; }
  pay(p, COST.dev);
  const c = G.dev.pop();
  p.dev.push(c);
  p.devBoughtThisTurn.push(c);
  note(p.name + " buys a development card.");
  if (c === "vp") note("It is a victory point card — kept hidden until the end.");
  checkWin();
}

function playableDev(p) {
  const bought = p.devBoughtThisTurn.slice();
  return p.dev.filter(c => {
    if (c === "vp") return false;
    const i = bought.indexOf(c);
    if (i >= 0) { bought.splice(i, 1); return false; }
    return true;
  });
}

function playDev(kind) {
  const p = cur();
  p.dev.splice(p.dev.indexOf(kind), 1);
  p.devPlayedThisTurn = true;
  note(p.name + " plays " + DEV_INFO[kind].title + ".", "hi");
  if (kind === "knight") {
    p.playedKnights++;
    refreshLargestArmy();
    setPending({
      kind: "moveRobber",
      hexes: robberTargets(),
      hint: "Move the robber.", mandatory: true
    });
  } else if (kind === "roadBuilding") {
    freeRoads(2);
  } else if (kind === "yearOfPlenty") {
    pickCards("Year of Plenty", "Take any 2 resources from the bank.", RES, 2, picked => {
      picked.forEach(k => addCard(p, k, 1));
      note(p.name + " takes " + picked.join(" and ") + ".");
      render();
    });
  } else if (kind === "monopoly") {
    pickCards("Monopoly", "Name a resource. Every opponent hands over all of it.", RES, 1, picked => {
      const k = picked[0];
      let got = 0;
      G.players.forEach(o => {
        if (o.id === p.id) return;
        const n = hasCard(o, k);
        if (n) { addCard(o, k, -n); got += n; }
      });
      addCard(p, k, got);
      note(p.name + " monopolises " + k + " and collects " + got + ".", "bad");
      render();
    }, { aiPick: o => aiRichestAcrossOpponents(p, o.map(x => x.value !== undefined ? x.value : x)) });
  }
  checkWin();
}

function freeRoads(n) {
  const p = cur();
  const step = left => {
    if (left <= 0) { clearPending(); checkWin(); return; }
    const spots = legalRoadSpots(p.id);
    if (!spots.length || p.roadsLeft <= 0) { clearPending(); return; }
    setPending({
      kind: "freeRoad", left, edges: spots,
      hint: "Place a free road (" + left + " remaining).", mandatory: false,
      after: () => step(left - 1)
    });
  };
  step(n);
}

/* ---------- end of turn ---------- */
function endTurn() {
  const p = cur();
  p.devBoughtThisTurn = [];
  p.devPlayedThisTurn = false;
  p.turnFlags = {};
  if (isSF()) G.geo.edges.forEach(e => { if (e.road === p.id) e.newShip = false; });
  p.knightUsedPromote = [];
  if (G.mode === "ck") {
    p.knightsPlaced.forEach(vid => {
      const k = G.geo.vertices[vid].knight;
      if (k) { k.actedThisTurn = false; k.activatedThisTurn = false; k.bornTurn = false; }
    });
  }
  p.aiTrades = 0;
  p.aiOffered = false;
  p.aiSkip = {};
  G.aiSteps = 0;
  G.aiStuck = 0;
  G.cur = (G.cur + 1) % G.players.length;
  G.dice = [null, null];
  G.eventDie = null;
  G.phase = "roll";
  const q = cur();
  q.turnFlags = {};
  q.knightUsedPromote = [];
  note("— " + q.name + "'s turn —");
  clearPending();
}

function checkWin() {
  const p = cur();
  if (totalVP(p) >= G.target) {
    G.winner = p.id;
    G.phase = "over";
    note(p.name + " reaches " + totalVP(p) + " victory points and wins.", "hi");
    render();
    winDialog(p);
    return true;
  }
  render();
  return false;
}
/* ============================================================
   Cities & Knights systems
   ============================================================ */

/* ---------- event die ---------- */
function resolveEventDie(after) {
  if (G.eventDie === "barbarian") {
    G.barb++;
    if (G.barb >= BARB_TRACK) { barbarianAttack(after); return; }
    note("The barbarian ship advances to space " + G.barb + " of " + BARB_TRACK + ".");
    after();
    return;
  }
  const track = G.eventDie;
  const red = G.dice[1];
  const order = [];
  for (let i = 0; i < G.players.length; i++) order.push(G.players[(G.cur + i) % G.players.length]);
  const eligible = order.filter(p => p.imp[track] >= 1 && red <= p.imp[track] + 1);
  if (!eligible.length) { note("No one has enough " + track + " development to draw a card."); after(); return; }
  const step = () => {
    if (!eligible.length) { after(); return; }
    drawProgress(eligible.shift(), track, step);
  };
  step();
}

function drawProgress(p, track, done) {
  const deck = G.progDecks[track];
  if (!deck.length) { note("The " + track + " deck is exhausted."); done(); return; }
  const card = deck.pop();
  if (VP_PROG.includes(card)) {
    p.vpCards++;
    note(p.name + " reveals " + PROG[card].title + " — 1 victory point.", "hi");
    render();
    done();
    return;
  }
  p.prog.push(card);
  note(p.name + " draws a " + track + " progress card.");
  if (p.prog.length > 4) {
    chooseProgToDiscard(p, done);
  } else { render(); done(); }
}

function chooseProgToDiscard(p, done) {
  chooseOption("Hand limit — " + p.name, "You may hold only 4 progress cards. Return one to the bottom of its deck.",
    p.prog.map((c, i) => ({ label: PROG[c].title, sub: PROG[c].text, value: i, deck: PROG[c].deck })),
    idx => {
      const c = p.prog.splice(idx, 1)[0];
      G.progDecks[PROG[c].deck].unshift(c);
      note(p.name + " returns " + PROG[c].title + " to the deck.");
      render();
      done();
    }, true, { actor: p });
}

/* ---------- barbarians ---------- */
function barbarianStrength() {
  let n = 0;
  G.geo.vertices.forEach(v => { if (v.building && v.building.type === "city") n++; });
  return n;
}
function knightStrengthOf(pid) {
  let n = 0;
  G.geo.vertices.forEach(v => { if (v.knight && v.knight.p === pid && v.knight.active) n += v.knight.str; });
  return n;
}
function knightStrengthTotal() { return sum(G.players.map(p => knightStrengthOf(p.id))); }

function barbarianAttack(after) {
  const strength = barbarianStrength();
  const defence = knightStrengthTotal();
  const per = G.players.map(p => knightStrengthOf(p.id));
  note("The barbarians land! Attack " + strength + " against knights " + defence + ".", "bad");
  battleReport(strength, defence, per, () => resolveBarbarians(strength, defence, per, after));
}

/* The landing, laid out before anything changes hands. */
function battleReport(strength, defence, per, done) {
  if (!G.players.some(pl => !isAI(pl))) { done(); return; }
  const scale = Math.max(strength, defence, 1);
  const held = defence >= strength;
  const bar = (n, colour) => '<span class="bar"><i style="width:' +
    Math.round(n / scale * 100) + "%;background:" + colour + '"></i></span><span class="num">' + n + "</span>";
  const list = G.players.map((pl, i) =>
    '<div class="mrow"><span class="swatch" style="background:' + pl.color + '"></span>' +
    '<span class="nm">' + esc(pl.name) + "</span>" +
    '<span class="mbar"><i style="width:' + Math.round(per[i] / scale * 100) + '%;background:' + pl.color + '"></i></span>' +
    '<span class="val">' + per[i] + "</span></div>").join("");

  openModal(
    "<h2>The barbarians land</h2><div class=\"body\">" +
    '<div class="battle">' +
    '<div class="side"><span class="lab">Barbarians</span>' + bar(strength, "#b3352a") + "</div>" +
    '<div class="side"><span class="lab">Knights</span>' + bar(defence, "#5c7a4a") + "</div>" +
    "</div>" +
    '<p class="verdict ' + (held ? "win" : "lose") + '">' +
    (held ? "Catan holds the shore." : "The shore is overrun.") + "</p>" +
    '<p class="muted">' + (held
      ? "The single strongest court is named Defender of Catan and takes a victory point. Courts tied at the top draw a progress card each instead."
      : "The weakest court on the field loses a city to the sack. A city carrying a metropolis is spared.") + "</p>" +
    '<p class="eyebrow" style="color:var(--brown-2);margin-top:15px">KNIGHTS IN THE FIELD</p>' + list +
    "</div>" +
    '<div class="foot"><button class="btn primary" id="ok">' +
    (held ? "Claim the field" : "See what it costs") + "</button></div>",
    m => m.querySelector("#ok").addEventListener("click", () => { closeModal(); done(); }));
}

function resolveBarbarians(strength, defence, per, after) {
  const finish = () => {
    G.barb = 0;
    G.barbAttacked = true;
    G.geo.vertices.forEach(v => { if (v.knight) v.knight.active = false; });
    note("The barbarians sail home. Every knight is now idle.");
    render();
    after();
  };

  if (defence >= strength) {
    const best = Math.max.apply(null, per);
    const winners = per.map((s, i) => [s, i]).filter(x => x[0] === best && best > 0).map(x => x[1]);
    if (!winners.length) { note("Catan holds, but no knight took the field."); finish(); return; }
    if (winners.length === 1) {
      G.players[winners[0]].vpCards++;
      note(G.players[winners[0]].name + " is Defender of Catan — 1 victory point.", "hi");
      finish();
      return;
    }
    note("Defence is tied. Each leading player draws a progress card of their choice.");
    const order = [];
    for (let i = 0; i < G.players.length; i++) {
      const id = (G.cur + i) % G.players.length;
      if (winners.includes(id)) order.push(G.players[id]);
    }
    const step = () => {
      if (!order.length) { finish(); return; }
      const p = order.shift();
      chooseOption("Defender's reward — " + p.name, "Choose a progress deck to draw from.",
        TRACKS.map(t => ({ label: IMPROVE[t].label, sub: G.progDecks[t].length + " cards left", value: t, deck: t, disabled: !G.progDecks[t].length })),
        t => drawProgress(p, t, step), true, { actor: p });
    };
    step();
    return;
  }

  // barbarians win — weakest defenders are pillaged
  const eligible = [];
  G.players.forEach(p => {
    const cities = G.geo.vertices.filter(v => v.building && v.building.p === p.id && v.building.type === "city" && !v.building.metro);
    if (cities.length) eligible.push(p.id);
  });
  if (!eligible.length) { note("The barbarians find nothing worth sacking."); finish(); return; }
  const low = Math.min.apply(null, eligible.map(id => per[id]));
  const losers = eligible.filter(id => per[id] === low);
  const step = () => {
    if (!losers.length) { finish(); return; }
    const p = G.players[losers.shift()];
    const cities = G.geo.vertices.filter(v => v.building && v.building.p === p.id && v.building.type === "city" && !v.building.metro);
    if (!cities.length) { step(); return; }
    if (cities.length === 1) { pillage(cities[0].id, p); step(); return; }
    const savedCur = G.cur;
    setPending({
      kind: "pillage", owner: p.id, actor: p.id, after: step,
      vertices: cities.map(v => v.id),
      hint: p.name + ": the barbarians sack one of your cities — choose which.",
      mandatory: true, savedCur
    });
  };
  step();
}

function pillage(vid, p) {
  const v = G.geo.vertices[vid];
  v.building.type = "settlement";
  if (v.building.wall) { v.building.wall = false; p.wallsLeft++; note(p.name + "'s city wall is torn down.", "bad"); }
  p.citiesLeft++; p.settlementsLeft--;
  note(p.name + " loses a city to the barbarians.", "bad");
}

/* ---------- city improvements ---------- */
function improvementCost(p, track) {
  let c = p.imp[track] + 1;
  if (p.turnFlags.crane) c = Math.max(0, c - 1);
  return c;
}
function ownsCity(p) {
  return G.geo.vertices.some(v => v.building && v.building.p === p.id && v.building.type === "city");
}
function freeMetroCities(p) {
  return G.geo.vertices.filter(v => v.building && v.building.p === p.id && v.building.type === "city" && !v.building.metro);
}
function metroHolder(track) {
  let who = null;
  G.players.forEach(p => { if (p.metros.includes(track)) who = p.id; });
  return who;
}
function canImprove(p, track) {
  if (p.imp[track] >= 5) return "Already at the top level.";
  if (!ownsCity(p)) return "You need at least one city.";
  const next = p.imp[track] + 1;
  if (next >= 4 && !p.metros.includes(track) && !freeMetroCities(p).length)
    return "You need a city free to carry a metropolis.";
  if (next === 4 && metroHolder(track) !== null) {
    // level 4 is still allowed, it just cannot claim an occupied metropolis
  }
  if (hasCard(p, IMPROVE[track].com) < improvementCost(p, track))
    return "Costs " + improvementCost(p, track) + " " + IMPROVE[track].com + ".";
  return null;
}

function buyImprovement(track) {
  const p = cur();
  const bad = canImprove(p, track);
  if (bad) { toast(bad); return; }
  const cost = improvementCost(p, track);
  addCard(p, IMPROVE[track].com, -cost);
  if (p.turnFlags.crane) p.turnFlags.crane = false;
  p.imp[track]++;
  const lvl = p.imp[track];
  note(p.name + " builds the " + IMPROVE[track].names[lvl - 1] + " (" + IMPROVE[track].label + " " + lvl + ").", "hi");
  if (lvl === 3) {
    const perk = track === "trade" ? "commodities now trade 2:1"
      : track === "politics" ? "strong knights may be promoted to mighty"
      : "an empty production roll now yields 1 resource";
    note("Special ability unlocked: " + perk + ".");
  }
  if (lvl >= 4) tryMetropolis(p, track, lvl);
  else { clearPending(); checkWin(); }
}

function tryMetropolis(p, track, lvl) {
  const holder = metroHolder(track);
  if (holder === p.id) { clearPending(); checkWin(); return; }
  if (holder !== null) {
    const other = G.players[holder];
    if (lvl < 5 || other.imp[track] >= 5) {
      note("The " + track + " metropolis stays with " + other.name + ".");
      clearPending(); checkWin(); return;
    }
    // take it
    G.geo.vertices.forEach(v => { if (v.building && v.building.metro === track) v.building.metro = null; });
    other.metros = other.metros.filter(t => t !== track);
    note(p.name + " seizes the " + track + " metropolis from " + other.name + ".", "bad");
  }
  const cities = freeMetroCities(p);
  if (!cities.length) { note("No free city to carry the metropolis."); clearPending(); checkWin(); return; }
  if (cities.length === 1) { placeMetro(cities[0].id, p, track); return; }
  setPending({
    kind: "metropolis", track,
    vertices: cities.map(v => v.id),
    hint: p.name + ": choose the city that becomes your " + track + " metropolis.",
    mandatory: true
  });
}
function placeMetro(vid, p, track) {
  G.geo.vertices[vid].building.metro = track;
  p.metros.push(track);
  note(p.name + " raises the " + track + " metropolis — 2 extra victory points.", "hi");
  clearPending();
  checkWin();
}

/* ---------- city walls ---------- */
function actBuildWall(free) {
  const p = cur();
  if (p.wallsLeft <= 0) { toast("All 3 walls are already on the board."); return; }
  const spots = G.geo.vertices.filter(v => v.building && v.building.p === p.id && v.building.type === "city" && !v.building.wall);
  if (!spots.length) { toast("No unwalled city available."); return; }
  setPending({ kind: "wall", free: !!free, vertices: spots.map(v => v.id),
    hint: free ? "Place a free city wall." : "Build a city wall (2 brick)." });
}
function doBuildWall(vid, free) {
  const p = cur();
  if (!free) pay(p, COST.wall);
  G.geo.vertices[vid].building.wall = true;
  p.wallsLeft--;
  note(p.name + " walls a city. Safe hand size is now " + handLimit(p) + ".");
  clearPending();
  render();
}

/* ---------- knights ---------- */
function knightCounts(p) {
  const c = { 1: 0, 2: 0, 3: 0 };
  p.knightsPlaced.forEach(vid => {
    const k = G.geo.vertices[vid].knight;
    if (k) c[k.str]++;
  });
  return c;
}
function actBuildKnight() {
  const p = cur();
  if (knightCounts(p)[1] >= 2) { toast("Both basic knights are already on the board."); return; }
  const spots = legalKnightSpots(p.id);
  if (!spots.length) { toast("No free intersection on your road network."); return; }
  setPending({ kind: "knight", vertices: spots, hint: "Place a knight (" + costText(COST.knight) + ")." });
}
function doBuildKnight(vid) {
  const p = cur();
  pay(p, COST.knight);
  G.geo.vertices[vid].knight = { p: p.id, str: 1, active: false, bornTurn: true, actedThisTurn: false };
  p.knightsPlaced.push(vid);
  note(p.name + " hires a knight.");
  refreshLongestRoad();
  clearPending();
}

function knightsOf(p) {
  return p.knightsPlaced.map(vid => ({ vid, k: G.geo.vertices[vid].knight })).filter(x => x.k);
}

function actActivateKnight(free) {
  const p = cur();
  const list = knightsOf(p).filter(x => !x.k.active);
  if (!list.length) { toast("Every knight is already active."); return; }
  if (!free && !canPay(p, COST.activate)) { toast("Activating costs 1 grain."); return; }
  setPending({
    kind: "activate", free: !!free,
    vertices: list.map(x => x.vid),
    hint: free ? "Choose a knight to activate for free." : "Activate a knight (1 grain)."
  });
}
function doActivate(vid, free) {
  const p = cur();
  if (!free) pay(p, COST.activate);
  const k = G.geo.vertices[vid].knight;
  k.active = true;
  k.activatedThisTurn = true;
  note(p.name + " activates a knight.");
  clearPending();
}

function actPromoteKnight(free) {
  const p = cur();
  const list = knightsOf(p).filter(x =>
    x.k.str < 3 &&
    !(x.k.str === 2 && p.imp.politics < 3) &&
    !p.knightUsedPromote.includes(x.vid) &&
    knightCounts(p)[x.k.str + 1] < 2);
  if (!list.length) { toast("No knight can be promoted right now."); return; }
  if (!free && !canPay(p, COST.promote)) { toast("Promotion costs " + costText(COST.promote) + "."); return; }
  setPending({
    kind: "promote", free: !!free,
    vertices: list.map(x => x.vid),
    hint: free ? "Promote a knight for free." : "Promote a knight (" + costText(COST.promote) + ")."
  });
}
function doPromote(vid, free) {
  const p = cur();
  if (!free) pay(p, COST.promote);
  const k = G.geo.vertices[vid].knight;
  k.str++;
  p.knightUsedPromote.push(vid);
  note(p.name + " promotes a knight to strength " + k.str + ".");
  clearPending();
}

function knightCanAct(p, x) {
  return x.k.active && !x.k.activatedThisTurn && !x.k.actedThisTurn;
}

function actKnightAction() {
  const p = cur();
  const list = knightsOf(p).filter(x => knightCanAct(p, x));
  if (!list.length) { toast("No knight is ready to act this turn."); return; }
  setPending({
    kind: "knightPick",
    vertices: list.map(x => x.vid),
    hint: "Choose the knight that will act."
  });
}

function knightOptions(vid) {
  const p = cur();
  const k = G.geo.vertices[vid].knight;
  const reach = roadReachable(p.id, vid);
  const moves = reach.filter(v => {
    const vx = G.geo.vertices[v];
    return !vx.building && !vx.knight;
  });
  const displaces = reach.filter(v => {
    const vx = G.geo.vertices[v];
    return vx.knight && vx.knight.p !== p.id && vx.knight.str < k.str && !vx.building;
  });
  const robberAdjacent = G.geo.vertices[vid].hexes.includes(G.robber) && G.barbAttacked;
  return { moves, displaces, robberAdjacent };
}

function openKnightMenu(vid) {
  const opts = knightOptions(vid);
  const items = [];
  if (opts.moves.length) items.push({ label: "Move the knight", sub: opts.moves.length + " reachable intersections", value: "move" });
  if (opts.displaces.length) items.push({ label: "Displace an enemy knight", sub: opts.displaces.length + " weaker knights in reach", value: "displace" });
  if (opts.robberAdjacent) items.push({ label: "Chase away the robber", sub: "Move it and steal from a neighbour", value: "robber" });
  if (!items.length) { toast("That knight has nothing to do."); clearPending(); return; }
  chooseOption("Knight action", "The knight goes idle afterwards.", items, choice => {
    if (choice === "move") {
      setPending({ kind: "knightMove", from: vid, vertices: opts.moves, hint: "Move your knight along your roads." });
    } else if (choice === "displace") {
      setPending({ kind: "knightDisplace", from: vid, vertices: opts.displaces, hint: "Choose the knight to push aside." });
    } else {
      setPending({
        kind: "knightRobber", from: vid,
        hexes: robberTargets(),
        hint: "Send the robber to a new hex.", mandatory: true
      });
    }
  });
}

function moveKnight(from, to) {
  const v1 = G.geo.vertices[from], v2 = G.geo.vertices[to];
  const p = G.players[v1.knight.p];
  v2.knight = v1.knight;
  v1.knight = null;
  p.knightsPlaced = p.knightsPlaced.map(x => (x === from ? to : x));
  refreshLongestRoad();
}

function doKnightMove(from, to) {
  moveKnight(from, to);
  G.geo.vertices[to].knight.active = false;
  G.geo.vertices[to].knight.actedThisTurn = true;
  note(cur().name + " marches a knight.");
  clearPending();
}

function doKnightDisplace(from, target, viaCard) {
  const victimKnight = G.geo.vertices[target].knight;
  const owner = G.players[victimKnight.p];
  const dests = roadReachable(owner.id, target).filter(v => {
    const vx = G.geo.vertices[v];
    return !vx.building && !vx.knight && v !== target;
  });
  const settle = () => {
    if (from !== null) {
      moveKnight(from, target);
      G.geo.vertices[target].knight.active = false;
      G.geo.vertices[target].knight.actedThisTurn = true;
    }
    refreshLongestRoad();
    clearPending();
  };
  // remove the displaced knight from its square first
  G.geo.vertices[target].knight = null;
  owner.knightsPlaced = owner.knightsPlaced.filter(v => v !== target);
  note(cur().name + " displaces a knight of " + owner.name + (viaCard ? " with Intrigue." : "."), "bad");

  if (!dests.length) {
    note(owner.name + " has nowhere to retreat — the knight is lost.", "bad");
    settle();
    return;
  }
  if (dests.length === 1) {
    G.geo.vertices[dests[0]].knight = victimKnight;
    owner.knightsPlaced.push(dests[0]);
    note(owner.name + "'s knight retreats.");
    settle();
    return;
  }
  setPending({
    kind: "retreat", knight: victimKnight, owner: owner.id, actor: owner.id,
    vertices: dests, mandatory: true,
    hint: owner.name + ": retreat your displaced knight.",
    after: settle
  });
}

/* ---------- progress cards ---------- */
function playProgress(idx) {
  const p = cur();
  const card = p.prog[idx];
  const info = PROG[card];
  const consume = () => {
    p.prog.splice(p.prog.indexOf(card), 1);
    G.progDecks[info.deck].unshift(card);
  };
  note(p.name + " plays " + info.title + ".", "hi");

  switch (card) {
    case "crane":
      consume(); p.turnFlags.crane = true; render(); break;

    case "medicine": {
      if (!legalCitySpots(p.id).length) { toast("You have no settlement to upgrade."); return; }
      if (!canPay(p, { ore: 2, grain: 1 })) { toast("You need 2 ore and 1 grain."); return; }
      consume(); actBuildCity(true); break;
    }

    case "engineer":
      consume(); actBuildWall(true); break;

    case "roadBuildingP":
      consume(); freeRoads(2); break;

    case "smith": {
      consume();
      let left = 2;
      const step = () => {
        const list = knightsOf(p).filter(x =>
          x.k.str < 3 && !(x.k.str === 2 && p.imp.politics < 3) &&
          !p.knightUsedPromote.includes(x.vid) && knightCounts(p)[x.k.str + 1] < 2);
        if (!left || !list.length) { clearPending(); render(); return; }
        setPending({
          kind: "promote", free: true, vertices: list.map(x => x.vid),
          hint: "Smith: promote a knight free (" + left + " left).",
          after: () => { left--; step(); }
        });
      };
      step();
      break;
    }

    case "irrigation":
    case "mining": {
      consume();
      const want = card === "irrigation" ? "fields" : "mountains";
      const res = card === "irrigation" ? "grain" : "ore";
      let n = 0;
      G.geo.hexes.forEach(h => {
        if (h.type !== want) return;
        if (h.vertices.some(vid => ownsBuildingAt(G.geo.vertices[vid], p.id))) n += 2;
      });
      addCard(p, res, n);
      note(p.name + " gains " + n + " " + res + ".");
      render();
      break;
    }

    case "inventor": {
      const swappable = G.geo.hexes.filter(h => h.num !== null && ![2, 6, 8, 12].includes(h.num)).map(h => h.id);
      if (swappable.length < 2) { toast("Not enough tokens can be swapped."); return; }
      consume();
      setPending({ kind: "inventorA", hexes: swappable, hint: "Inventor: pick the first number token." });
      break;
    }

    case "alchemist":
      toast("Alchemist must be played before you roll.");
      break;

    case "printer":
    case "constitution":
      consume(); p.vpCards++; checkWin(); break;

    case "warlord": {
      consume();
      knightsOf(p).forEach(x => { if (!x.k.active) { x.k.active = true; x.k.activatedThisTurn = true; } });
      note(p.name + " calls every knight to arms.");
      render();
      break;
    }

    case "bishop":
      if (!G.barbAttacked) {
        toast("The robber cannot be moved until the barbarians have landed once.");
        return;
      }
      consume();
      setPending({
        kind: "bishop",
        hexes: robberTargets(),
        hint: "Bishop: move the robber.", mandatory: true
      });
      break;

    case "deserter": {
      const targets = G.players.filter(o => o.id !== p.id && knightsOf(o).length).map(o => o.id);
      if (!targets.length) { toast("No opponent has a knight."); return; }
      consume();
      choosePlayer("Deserter", "Which court loses a knight?", targets, oid => {
        const o = G.players[oid];
        const list = knightsOf(o);
        chooseOption("Deserter — " + o.name, "Choose which of your knights walks away.",
          list.map(x => ({ label: "Strength " + x.k.str + (x.k.active ? " (active)" : " (idle)"), sub: "", value: x.vid })),
          vid => {
            const k = G.geo.vertices[vid].knight;
            const wasStr = k.str, wasActive = k.active;
            G.geo.vertices[vid].knight = null;
            o.knightsPlaced = o.knightsPlaced.filter(v => v !== vid);
            note(o.name + " loses a knight of strength " + wasStr + ".", "bad");
            refreshLongestRoad();
            let str = wasStr;
            if (knightCounts(p)[str] >= 2) str = 1;
            if (knightCounts(p)[str] >= 2) { note(p.name + " has no spare knight to send."); render(); return; }
            const spots = legalKnightSpots(p.id);
            if (!spots.length) { note("Nowhere to place the new knight."); render(); return; }
            setPending({
              kind: "deserterPlace", str, active: wasActive, vertices: spots,
              hint: "Place your free knight of strength " + str + "."
            });
          }, true, { actor: o, aiPick: its => bestOf(its, it => -G.geo.vertices[it.value].knight.str).value });
      });
      break;
    }

    case "intrigue": {
      const targets = [];
      G.geo.vertices.forEach(v => {
        if (!v.knight || v.knight.p === p.id) return;
        if (v.edges.some(e => G.geo.edges[e].road === p.id)) targets.push(v.id);
      });
      if (!targets.length) { toast("No enemy knight sits on your road network."); return; }
      consume();
      setPending({ kind: "intrigue", vertices: targets, hint: "Intrigue: choose the knight to displace." });
      break;
    }

    case "diplomat": {
      const open = openRoads();
      if (!open.length) { toast("There is no open road to remove."); return; }
      consume();
      setPending({ kind: "diplomat", edges: open, hint: "Diplomat: remove an open road." });
      break;
    }

    case "saboteur": {
      consume();
      const mine = totalVP(p);
      const victims = G.players.filter(o => o.id !== p.id && totalVP(o) >= mine && handCount(o) > 1);
      if (!victims.length) { note("No one is rich or proud enough to suffer."); render(); break; }
      const step = () => {
        if (!victims.length) { render(); return; }
        const o = victims.shift();
        discardDialog(o, Math.floor(handCount(o) / 2), step);
      };
      step();
      break;
    }

    case "spy": {
      const targets = G.players.filter(o => o.id !== p.id && o.prog.length).map(o => o.id);
      if (!targets.length) { toast("No opponent holds a progress card."); return; }
      consume();
      choosePlayer("Spy", "Whose hand will you read?", targets, oid => {
        const o = G.players[oid];
        chooseOption("Spy — " + o.name + "'s cards", "Take one for yourself.",
          o.prog.map((c, i) => ({ label: PROG[c].title, sub: PROG[c].text, value: i, deck: PROG[c].deck })),
          i => {
            const c = o.prog.splice(i, 1)[0];
            p.prog.push(c);
            note(p.name + " lifts " + PROG[c].title + " from " + o.name + ".", "bad");
            if (p.prog.length > 4) chooseProgToDiscard(p, render); else render();
          }, true);
      });
      break;
    }

    case "wedding": {
      consume();
      const mine = totalVP(p);
      const givers = G.players.filter(o => o.id !== p.id && totalVP(o) > mine && handCount(o) > 0);
      if (!givers.length) { note("No one outranks you — the wedding gifts nothing."); render(); break; }
      const step = () => {
        if (!givers.length) { render(); return; }
        const o = givers.shift();
        const n = Math.min(2, handCount(o));
        chooseCardsFromHand(o, n, "Wedding gift — " + o.name, "Hand " + n + " card" + (n > 1 ? "s" : "") + " to " + p.name + ".",
          list => {
            list.forEach(k => { addCard(o, k, -1); addCard(p, k, 1); });
            note(o.name + " gives " + list.join(", ") + " to " + p.name + ".", "bad");
            step();
          }, { actor: o });
      };
      step();
      break;
    }

    case "masterMerchant": {
      const mine = totalVP(p);
      const targets = G.players.filter(o => o.id !== p.id && totalVP(o) > mine && handCount(o) > 0).map(o => o.id);
      if (!targets.length) { toast("No richer opponent to rob."); return; }
      consume();
      choosePlayer("Master Merchant", "Choose an opponent ahead of you on points.", targets, oid => {
        const o = G.players[oid];
        const n = Math.min(2, handCount(o));
        chooseCardsFromHand(o, n, "Master Merchant", "You are looking at " + o.name + "'s hand. Take " + n + ".",
          list => {
            list.forEach(k => { addCard(o, k, -1); addCard(p, k, 1); });
            note(p.name + " takes " + list.join(", ") + " from " + o.name + ".", "bad");
            render();
          }, { actor: p });
      });
      break;
    }

    case "commercialHarbor": {
      const givers = G.players.filter(o => o.id !== p.id && sum(COM.map(c => o.com[c])) > 0);
      if (!givers.length) { toast("No opponent holds a commodity."); return; }
      if (!sum(RES.map(r => p.res[r]))) { toast("You need resources to offer."); return; }
      consume();
      const step = () => {
        if (!givers.length) { render(); return; }
        const o = givers.shift();
        const mineRes = RES.filter(r => p.res[r] > 0);
        if (!mineRes.length) { render(); return; }
        pickCards("Commercial Harbor", "Offer " + o.name + " one resource.", mineRes, 1, sel => {
          const give = sel[0];
          const theirs = COM.filter(c => o.com[c] > 0);
          pickCards("Commercial Harbor — " + o.name, "Return a commodity of your choice.", theirs, 1, back => {
            addCard(p, give, -1); addCard(o, give, 1);
            addCard(o, back[0], -1); addCard(p, back[0], 1);
            note(p.name + " trades " + give + " to " + o.name + " for " + back[0] + ".");
            step();
          }, { actor: o });
        });
      };
      step();
      break;
    }

    case "merchant": {
      const spots = G.geo.hexes.filter(h => TERRAIN[h.type].res &&
        h.vertices.some(vid => ownsBuildingAt(G.geo.vertices[vid], p.id))).map(h => h.id);
      if (!spots.length) { toast("No land hex next to your buildings."); return; }
      consume();
      setPending({ kind: "merchant", hexes: spots, hint: "Place the merchant beside one of your buildings.", mandatory: true });
      break;
    }

    case "merchantFleet":
      consume();
      pickCards("Merchant Fleet", "Choose the good you will trade 2:1 for the rest of this turn.", ALLCARDS, 1, sel => {
        p.turnFlags.fleet = sel[0];
        note(p.name + " opens a 2:1 line in " + sel[0] + " for this turn.");
        render();
      });
      break;

    case "resourceMonopoly":
      consume();
      pickCards("Resource Monopoly", "Name a resource. Each opponent gives you 2.", RES, 1, sel => {
        const k = sel[0];
        let got = 0;
        G.players.forEach(o => {
          if (o.id === p.id) return;
          const take = Math.min(2, hasCard(o, k));
          if (take) { addCard(o, k, -take); got += take; }
        });
        addCard(p, k, got);
        note(p.name + " corners the " + k + " market and takes " + got + ".", "bad");
        render();
      }, { aiPick: o => aiRichestAcrossOpponents(p, o.map(x => x.value !== undefined ? x.value : x)) });
      break;

    case "tradeMonopoly":
      consume();
      pickCards("Trade Monopoly", "Name a commodity. Each opponent gives you 1.", COM, 1, sel => {
        const k = sel[0];
        let got = 0;
        G.players.forEach(o => {
          if (o.id === p.id) return;
          if (hasCard(o, k)) { addCard(o, k, -1); got++; }
        });
        addCard(p, k, got);
        note(p.name + " taxes " + k + " and collects " + got + ".", "bad");
        render();
      }, { aiPick: o => aiRichestAcrossOpponents(p, o.map(x => x.value !== undefined ? x.value : x)) });
      break;
  }
}

function openRoads() {
  const out = [];
  G.geo.edges.forEach(e => {
    if (e.road === null) return;
    const free = [e.a, e.b].some(vid => {
      const v = G.geo.vertices[vid];
      if (v.building && v.building.p === e.road) return false;
      if (v.knight && v.knight.p === e.road) return false;
      const others = v.edges.filter(ei => ei !== e.id && G.geo.edges[ei].road === e.road);
      return others.length === 0;
    });
    if (free) out.push(e.id);
  });
  return out;
}

function playAlchemist(idx) {
  const p = cur();
  chooseOption("Alchemist", "Set the two production dice.", [1, 2, 3, 4, 5, 6].map(n => ({ label: "Yellow die: " + n, value: n })),
    a => {
      chooseOption("Alchemist", "And the red die.", [1, 2, 3, 4, 5, 6].map(n => ({ label: "Red die: " + n, value: n })),
        b => {
          const card = p.prog[idx];
          p.prog.splice(idx, 1);
          G.progDecks[PROG[card].deck].unshift(card);
          note(p.name + " plays Alchemist and fixes the dice at " + a + " and " + b + ".", "hi");
          p.aiAlchemy = null;
          rollDice([a, b]);
        }, true, { aiPick: () => (p.aiAlchemy ? p.aiAlchemy[1] : 4) });
    }, true, { aiPick: () => (p.aiAlchemy ? p.aiAlchemy[0] : 4) });
}

   Dialogs, input handling and wiring

let modalStack = 0;
function openModal(html, mount) {
  $("modal").innerHTML = html;
  $("scrim").classList.add("show");
  G.modalOpen = true;
  modalStack++;
  if (mount) mount($("modal"));
  const f = $("modal").querySelector("button:not(:disabled)");
  if (f) f.focus();
}
function closeModal() {
  $("scrim").classList.remove("show");
  $("modal").innerHTML = "";
  G.modalOpen = false;
  modalStack = 0;
  scheduleAI();
}

let toastTimer = null;
function toast(msg) {
  let t = $("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    t.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:#b3352a;color:#fff;" +
      "padding:9px 16px;border-radius:3px;font-weight:600;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:80%";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 2600);
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ---------- generic pickers ---------- */
function chooseOption(title, text, items, cb, mandatory, opts) {
  opts = opts || {};
  const actor = opts.actor !== undefined ? opts.actor : cur();
  if (isAI(actor)) {
    const live = items.filter(i => !i.disabled);
    if (!live.length) { clearPending(); return; }
    cb(opts.aiPick ? opts.aiPick(live) : live[0].value);
    return;
  }
  const body = items.map((it, i) =>
    '<button class="pcard ' + (it.deck || "") + '" data-i="' + i + '"' + (it.disabled ? " disabled" : "") + ">" +
    (it.deck ? '<span class="flag">' + esc(it.deck) + "</span>" : "") +
    "<b>" + esc(it.label) + "</b>" +
    (it.sub ? "<small>" + esc(it.sub) + "</small>" : "") +
    "</button>").join("");
  openModal(
    "<h2>" + esc(title) + '</h2><div class="body">' +
    (text ? '<p class="muted" style="margin-top:0">' + esc(text) + "</p>" : "") +
    '<div class="pcards">' + body + "</div></div>" +
    (mandatory ? "" : '<div class="foot"><button class="btn" id="mCancel">Cancel</button></div>'),
    m => {
      m.querySelectorAll(".pcard").forEach(b => b.addEventListener("click", () => {
        const it = items[+b.dataset.i];
        closeModal();
        cb(it.value);
      }));
      const c = m.querySelector("#mCancel");
      if (c) c.addEventListener("click", () => { closeModal(); render(); });
    });
}

function choosePlayer(title, text, ids, cb, opts) {
  const items = ids.map(id => {
    const p = G.players[id];
    return { label: p.name, sub: handCount(p) + " cards · " + publicVP(p) + " VP", value: id };
  });
  chooseOption(title, text, items, cb, true, opts);
}

function pickCards(title, text, options, count, cb, opts) {
  opts = opts || {};
  const actor = opts.actor !== undefined ? opts.actor : cur();
  if (isAI(actor)) {
    if (!options.length) { clearPending(); return; }
    const out = [];
    for (let i = 0; i < count; i++) {
      out.push(opts.aiPick ? opts.aiPick(options.map(k => ({ value: k }))) : aiScarcest(actor, options));
    }
    cb(out);
    return;
  }
  const chosen = [];
  const draw = () => {
    const opts = options.map(k =>
      '<button class="pick" data-k="' + k + '"><span class="dot" style="width:11px;height:11px;border-radius:2px;background:' +
      CARDCOLOR[k] + '"></span>' + cap(k) + "</button>").join("");
    openModal(
      "<h2>" + esc(title) + '</h2><div class="body">' +
      '<p class="muted" style="margin-top:0">' + esc(text) + "</p>" +
      '<div class="picker">' + opts + "</div>" +
      (count > 1 ? '<p class="muted">Chosen: ' + (chosen.join(", ") || "—") + " (" + chosen.length + "/" + count + ")</p>" : "") +
      "</div>",
      m => {
        m.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => {
          chosen.push(b.dataset.k);
          if (chosen.length >= count) { closeModal(); cb(chosen); }
          else draw();
        }));
      });
  };
  draw();
}

/* Choose exactly n cards out of a player's own hand. */
function chooseCardsFromHand(p, n, title, text, cb, opts) {
  if (n <= 0) { cb([]); return; }
  opts = opts || {};
  const actor = opts.actor !== undefined ? opts.actor : p;
  if (isAI(actor)) { cb(aiWorstCards(p, n)); return; }
  const sel = {};
  ALLCARDS.forEach(k => { sel[k] = 0; });
  const total = () => sum(ALLCARDS.map(k => sel[k]));
  const draw = () => {
    const rows = ALLCARDS.filter(k => hasCard(p, k) > 0).map(k =>
      '<div class="counter"><span class="lab"><span class="dot" style="width:11px;height:11px;border-radius:2px;background:' +
      CARDCOLOR[k] + '"></span>' + cap(k) + ' <span class="muted">(' + hasCard(p, k) + ")</span></span>" +
      '<span class="stepper"><button data-m="' + k + '">−</button><span id="c_' + k + '">' + sel[k] +
      '</span><button data-p="' + k + '">+</button></span></div>').join("");
    openModal(
      "<h2>" + esc(title) + '</h2><div class="body">' +
      '<p class="muted" style="margin-top:0">' + esc(text) + "</p>" + rows +
      '<p class="muted" id="tot">Selected ' + total() + " of " + n + "</p></div>" +
      '<div class="foot"><button class="btn primary" id="ok"' + (total() === n ? "" : " disabled") + ">Confirm</button></div>",
      m => {
        m.querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
          const k = b.dataset.p;
          if (sel[k] < hasCard(p, k) && total() < n) { sel[k]++; draw(); }
        }));
        m.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
          const k = b.dataset.m;
          if (sel[k] > 0) { sel[k]--; draw(); }
        }));
        m.querySelector("#ok").addEventListener("click", () => {
          const list = [];
          ALLCARDS.forEach(k => { for (let i = 0; i < sel[k]; i++) list.push(k); });
          closeModal();
          cb(list);
        });
      });
  };
  draw();
}

function discardDialog(p, n, done) {
  chooseCardsFromHand(p, n, "Discard — " + p.name,
    "You are over the safe hand size. Return " + n + " card" + (n > 1 ? "s" : "") + " to the bank.",
    list => {
      list.forEach(k => addCard(p, k, -1));
      note(p.name + " discards " + n + " card" + (n > 1 ? "s" : "") + ".", "bad");
      render();
      done();
    }, { actor: p });
}

/* a bot asking a person for a swap */
function aiTradeOffer(bot, human, give, get) {
  const chips = obj => ALLCARDS.filter(k => obj[k]).map(k =>
    '<span class="card"><span class="dot" style="background:' + CARDCOLOR[k] + '"></span>' +
    obj[k] + " " + cap(k) + "</span>").join("");
  const canPayIt = ALLCARDS.every(k => (get[k] || 0) <= hasCard(human, k));
  openModal(
    "<h2>" + esc(bot.name) + " offers a trade</h2>" +
    '<div class="body">' +
    '<p class="muted" style="margin-top:0">You would receive</p>' +
    '<div class="cards">' + chips(give) + "</div>" +
    '<p class="muted" style="margin-top:13px">You would hand over</p>' +
    '<div class="cards">' + chips(get) + "</div>" +
    (canPayIt ? "" : '<p class="muted" style="margin-top:13px">You do not hold that card.</p>') +
    "</div>" +
    '<div class="foot"><button class="btn" id="no">Decline</button>' +
    '<button class="btn primary" id="yes"' + (canPayIt ? "" : " disabled") + ">Accept</button></div>",
    m => {
      m.querySelector("#no").addEventListener("click", () => {
        note(human.name + " declines " + bot.name + "'s offer.");
        closeModal();
        render();
      });
      m.querySelector("#yes").addEventListener("click", () => {
        ALLCARDS.forEach(k => {
          if (give[k]) { addCard(bot, k, -give[k]); addCard(human, k, give[k]); }
          if (get[k]) { addCard(human, k, -get[k]); addCard(bot, k, get[k]); }
        });
        const fmt = o => ALLCARDS.filter(k => o[k]).map(k => o[k] + " " + k).join(", ");
        note(bot.name + " trades " + fmt(give) + " to " + human.name + " for " + fmt(get) + ".");
        closeModal();
        render();
      });
    });
}

/* ---------- board click dispatch ---------- */
function onVertexClick(vid) {
  const P = G.pending;
  if (!P) return;
  switch (P.kind) {
    case "setupBuilding": placeSetupBuilding(vid); break;
    case "settlement": doBuildSettlement(vid); break;
    case "city": doBuildCity(vid, P.discount); break;
    case "wall": doBuildWall(vid, P.free); break;
    case "knight": doBuildKnight(vid); break;
    case "activate": doActivate(vid, P.free); break;
    case "promote": {
      const after = P.after;
      doPromote(vid, P.free);
      if (after) after();
      break;
    }
    case "knightPick": openKnightMenu(vid); break;
    case "knightMove": doKnightMove(P.from, vid); break;
    case "knightDisplace": doKnightDisplace(P.from, vid, false); break;
    case "intrigue": doKnightDisplace(null, vid, true); break;
    case "retreat": {
      G.geo.vertices[vid].knight = P.knight;
      G.players[P.owner].knightsPlaced.push(vid);
      note(G.players[P.owner].name + "'s knight retreats.");
      const after = P.after;
      G.pending = null;
      if (after) after(); else render();
      break;
    }
    case "pillage": {
      pillage(vid, G.players[P.owner]);
      const after = P.after;
      G.pending = null;
      if (after) after(); else render();
      break;
    }
    case "metropolis": placeMetro(vid, cur(), P.track); break;
    case "deserterPlace": {
      const p = cur();
      G.geo.vertices[vid].knight = { p: p.id, str: P.str, active: P.active, actedThisTurn: false };
      p.knightsPlaced.push(vid);
      note(p.name + " welcomes the deserter as a knight of strength " + P.str + ".");
      refreshLongestRoad();
      clearPending();
      break;
    }
  }
}

function onEdgeClick(eid) {
  const P = G.pending;
  if (!P) return;
  switch (P.kind) {
    case "setupRoad": placeSetupRoad(eid); break;
    case "road": doBuildRoad(eid, false); break;
    case "ship": doBuildShip(eid, P.free); break;
    case "shipLift": doLiftShip(eid); break;
    case "shipDrop": doDropShip(eid, P.from); break;
    case "freeRoad": {
      const p = cur();
      G.geo.edges[eid].road = p.id;
      p.roadsLeft--;
      note(p.name + " lays a free road.");
      refreshLongestRoad();
      const after = P.after;
      G.pending = null;
      if (after) after(); else render();
      break;
    }
    case "diplomat": {
      const e = G.geo.edges[eid];
      const owner = e.road;
      e.road = null;
      G.players[owner].roadsLeft++;
      note(cur().name + " has an open road of " + G.players[owner].name + " torn up.", "bad");
      refreshLongestRoad();
      if (owner === G.cur) {
        const spots = legalRoadSpots(G.cur);
        if (spots.length) {
          setPending({ kind: "freeRoad", left: 1, edges: spots, hint: "Rebuild your road somewhere else.", after: () => clearPending() });
          break;
        }
      }
      clearPending();
      break;
    }
  }
}

function onHexClick(hid) {
  const P = G.pending;
  if (!P || !P.hexes || !P.hexes.includes(hid)) return;
  switch (P.kind) {
    case "moveRobber": moveRobberTo(hid, false); break;
    case "movePirate": movePirateTo(hid); break;
    case "bishop": moveRobberTo(hid, true); break;
    case "knightRobber": {
      const k = G.geo.vertices[P.from].knight;
      k.active = false; k.actedThisTurn = true;
      moveRobberTo(hid, false);
      break;
    }
    case "merchant": {
      const p = cur();
      G.players.forEach(o => { o.hasMerchant = false; });
      p.hasMerchant = true;
      G.merchantHex = hid;
      G.merchantOwner = p.id;
      note(p.name + " sets up the merchant on the " + TERRAIN[G.geo.hexes[hid].type].label.toLowerCase() + ".");
      clearPending();
      checkWin();
      break;
    }
    case "inventorA":
      setPending({ kind: "inventorB", first: hid, hexes: P.hexes.filter(h => h !== hid), hint: "Inventor: pick the token to swap it with." });
      break;
    case "inventorB": {
      const a = G.geo.hexes[P.first], b = G.geo.hexes[hid];
      const t = a.num; a.num = b.num; b.num = t;
      note(cur().name + " swaps the " + b.num + " and the " + a.num + " tokens.");
      clearPending();
      break;
    }
  }
}

/* ---------- action panel ---------- */
function btn(label, sub, fn, disabled, cls) {
  return '<button class="act ' + (cls || "") + '"' + (disabled ? " disabled" : "") +
    ' data-fn="' + fn + '"><b>' + esc(label) + "</b>" + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</button>";
}

const ACTIONS = {};
function drawActions() {
  const p = cur();
  const box = $("acts");
  box.classList.remove("one");
  if (G.phase === "over") {
    box.innerHTML = btn("New game", "Start again", "newGame", false, "primary");
    bindActions();
    return;
  }
  if (G.pending) {
    box.classList.add("one");
    box.innerHTML = '<p class="muted">' + esc(G.pending.hint || "Make the highlighted choice on the board.") +
      (G.pending.mandatory ? "" : " You can cancel from the bar under the board.") + "</p>";
    return;
  }
  if (isAI(p)) {
    box.classList.add("one");
    box.innerHTML = '<p class="muted">' + esc(p.name) + " is taking their turn…</p>";
    return;
  }
  if (G.phase === "setup1" || G.phase === "setup2") {
    box.classList.add("one");
    box.innerHTML = '<p class="muted">Follow the prompt on the board to place your opening pieces.</p>';
    return;
  }

  let h = "";
  if (G.phase === "roll") {
    h += btn("Roll the dice", isCK() ? "2 production dice + event die" : "2 dice", "roll", false, "primary");
    if (isCK()) {
      const alch = p.prog.findIndex(c => c === "alchemist");
      if (alch >= 0) h += btn("Play Alchemist", "Set the dice yourself", "alchemist");
    } else {
      const pd = playableDev(p);
      if (pd.length && !p.devPlayedThisTurn) h += btn("Play a card", pd.length + " available", "cards");
    }
  } else {
    const canRoad = canPay(p, COST.road) && p.roadsLeft > 0;
    const canSet = canPay(p, COST.settlement) && p.settlementsLeft > 0;
    const canCity = canPay(p, COST.city) && p.citiesLeft > 0;
    h += btn("Road", costText(COST.road), "road", !canRoad);
    h += btn("Settlement", costText(COST.settlement), "settlement", !canSet);
    h += btn("City", costText(COST.city), "city", !canCity);
    if (!isCK()) {
      h += btn("Development card", costText(COST.dev), "dev", !(canPay(p, COST.dev) && G.dev.length));
      if (isSF()) {
        h += btn("Ship", costText(COST.ship), "ship",
          !(canPay(p, COST.ship) && p.shipsLeft > 0 && legalShipSpots(p.id).length));
        h += btn("Re-sail a ship", p.turnFlags.shipMoved ? "already done this turn" : "move one open ship", "moveShip",
          !!p.turnFlags.shipMoved || !openShipsOf(p.id).length);
      }
    } else {
      h += btn("City wall", costText(COST.wall), "wall", !(canPay(p, COST.wall) && p.wallsLeft > 0));
      h += btn("Improve a city", "Spend commodities", "improve");
      h += btn("Knights", "Hire · activate · promote · act", "knights");
    }
    h += btn("Trade with bank", "Ports and ratios", "bank");
    h += btn("Trade with a player", "Agree it aloud first", "swap", G.players.length < 2);
    const cards = isCK() ? p.prog.length : playableDev(p).length;
    h += btn(isCK() ? "Progress cards" : "Play a card", cards + " in hand", "cards", !cards);
    h += btn("End turn", "Pass to the next player", "end", false, "primary");
  }
  box.innerHTML = h;
  bindActions();
}

function bindActions() {
  $("acts").querySelectorAll(".act").forEach(b => {
    b.addEventListener("click", () => ACTIONS[b.dataset.fn] && ACTIONS[b.dataset.fn]());
  });
}

ACTIONS.roll = () => { if (G.phase === "roll") rollDice(null); };
ACTIONS.alchemist = () => {
  const i = cur().prog.findIndex(c => c === "alchemist");
  if (i >= 0) playAlchemist(i);
};
ACTIONS.road = () => actBuildRoad(false);
ACTIONS.ship = () => actBuildShip(false);
ACTIONS.moveShip = () => actMoveShip();
ACTIONS.settlement = () => actBuildSettlement();
ACTIONS.city = () => actBuildCity(false);
ACTIONS.dev = () => actBuyDev();
ACTIONS.wall = () => actBuildWall(false);
ACTIONS.end = () => endTurn();
ACTIONS.newGame = () => newGameDialog();

ACTIONS.improve = () => {
  const p = cur();
  chooseOption("City improvements", "Each level raises your chance of drawing that colour of progress card.",
    TRACKS.map(t => {
      const bad = canImprove(p, t);
      const lvl = p.imp[t];
      return {
        label: IMPROVE[t].label + " " + (lvl >= 5 ? "— complete" : "→ level " + (lvl + 1) + (lvl < 5 ? ": " + IMPROVE[t].names[lvl] : "")),
        sub: (lvl >= 5 ? "Nothing more to build." : "Costs " + improvementCost(p, t) + " " + IMPROVE[t].com +
          " · you hold " + hasCard(p, IMPROVE[t].com)) + (bad ? " — " + bad : ""),

      };
