<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siege — hold the wall for ten waves</title>
<style>
  :root{
    --stone-deep:#161B22;
    --stone:#232B36;
    --slate:#39434F;
    --slate-hi:#4E5A69;
    --limewash:#E7E1D1;
    --limewash-dim:#BDB6A4;
    --verdigris:#4FA091;
    --rust:#B04531;
    --gilt:#C9A227;
    --ink:#171A1F;

    --display: "Hoefler Text","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --ui: "Trebuchet MS","Lucida Grande",Verdana,sans-serif;

    --gap:clamp(8px,1.6vw,16px);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(120% 80% at 50% -10%, #2C3644 0%, var(--stone-deep) 62%),
      var(--stone-deep);
    color:var(--limewash);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}

  #app{
    height:100%;
    display:flex;flex-direction:column;
    max-width:1080px;margin:0 auto;
    padding:var(--gap);
    gap:var(--gap);
  }

  /* ---------- header ---------- */
  header{display:flex;align-items:baseline;gap:14px;flex:0 0 auto}
  .mark{
    font-family:var(--display);
    font-size:clamp(19px,3.2vw,28px);
    letter-spacing:.34em;text-transform:uppercase;
    color:var(--limewash);margin:0;
  }
  .wave-label{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--limewash-dim);
  }
  .wave-label b{color:var(--gilt);font-weight:700}
  .header-right{margin-left:auto;display:flex;gap:10px;align-items:center}
  .ghost-btn{
    font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--limewash-dim);border:1px solid var(--slate);
    padding:6px 11px;border-radius:2px;
  }
  .ghost-btn:hover{color:var(--limewash);border-color:var(--slate-hi)}

  /* ---------- field ---------- */
  .field{
    flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;justify-content:flex-end;
    gap:var(--gap);
  }
  .attackers{
    display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;
    gap:clamp(6px,1.4vw,14px);
    min-height:132px;
  }

  .foe{
    width:clamp(88px,13vw,118px);
    background:linear-gradient(180deg,var(--slate) 0%,var(--stone) 100%);
    border:1px solid #4A5563;
    border-radius:2px 2px 0 0;
    padding:8px 8px 9px;
    text-align:center;
    position:relative;
    box-shadow:0 8px 18px rgba(0,0,0,.4);
    transition:transform .12s ease, box-shadow .12s ease, opacity .3s ease;
  }
  .foe .glyph{font-size:clamp(24px,4vw,30px);line-height:1.1;display:block}
  .foe .fname{
    font-family:var(--display);font-size:12px;letter-spacing:.08em;
    margin:3px 0 6px;color:var(--limewash);
  }
  .hpbar{height:5px;background:#141920;border:1px solid #0E1218;overflow:hidden}
  .hpbar span{display:block;height:100%;background:var(--rust);transition:width .25s ease}
  .hpnum{font-size:10px;letter-spacing:.06em;color:var(--limewash-dim);margin-top:4px}
  .intent{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    background:var(--rust);color:#fff;
    font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:2px 8px;border-radius:2px;white-space:nowrap;
    box-shadow:0 2px 6px rgba(0,0,0,.45);
  }
  .intent.sap{background:#7A4A9E}
  .badges{display:flex;gap:4px;justify-content:center;margin-top:5px;min-height:14px}
  .badge{font-size:9px;letter-spacing:.06em;text-transform:uppercase;
    padding:1px 5px;border:1px solid var(--slate-hi);color:var(--limewash-dim)}
  .badge.burn{color:#E08A3C;border-color:#7A4A22}
  .foe.targetable{cursor:crosshair;border-color:var(--gilt);box-shadow:0 0 0 1px var(--gilt),0 8px 18px rgba(0,0,0,.4)}
  .foe.targetable:hover{transform:translateY(-5px)}
  .foe.hurt{animation:jolt .22s ease}
  .foe.dying{opacity:0;transform:translateY(14px) scale(.9)}
  @keyframes jolt{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ---------- the wall (signature) ---------- */
  .rampart{flex:0 0 auto}
  .battlement{display:flex;gap:3px;align-items:flex-end;height:26px}
  .merlon{
    flex:1 1 0;height:26px;
    background:linear-gradient(180deg,#8E8878 0%,#635E52 100%);
    border-radius:1px 1px 0 0;
    transition:height .3s ease, background .3s ease, opacity .3s ease;
  }
  .merlon.broken{
    height:9px;
    background:linear-gradient(180deg,#4A4A46 0%,#33332F 100%);
    clip-path:polygon(0 100%,0 42%,22% 66%,44% 22%,68% 62%,88% 30%,100% 74%,100% 100%);
  }
  .curtain{
    height:clamp(30px,5vh,46px);
    background:
      repeating-linear-gradient(90deg,#5C5749 0 var(--bw,54px),#4B473C var(--bw,54px) calc(var(--bw,54px) + 2px)),
      repeating-linear-gradient(0deg,#5C5749 0 18px,#443F36 18px 20px);
    border-top:2px solid #6E6857;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 12px;
  }
  .wall-name{
    font-family:var(--display);font-size:11px;letter-spacing:.34em;
    text-transform:uppercase;color:#1E1B15;text-shadow:0 1px 0 rgba(255,255,255,.14);
  }
  .wall-num{font-weight:700;font-size:15px;color:#1E1B15;text-shadow:0 1px 0 rgba(255,255,255,.14)}
  .rampart.shake{animation:shake .3s ease}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-4px,2px)}
    45%{transform:translate(4px,-2px)}
    70%{transform:translate(-3px,1px)}
  }

  /* ---------- status strip ---------- */
  .strip{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-top:2px;
  }
  .pips{display:flex;gap:4px;align-items:center}
  .pip{width:13px;height:13px;border-radius:50%;border:1px solid var(--verdigris);background:transparent}
  .pip.full{background:var(--verdigris);box-shadow:0 0 8px rgba(79,160,145,.5)}
  .stat{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--limewash-dim)}
  .stat b{color:var(--limewash);font-size:13px;letter-spacing:.04em}
  .stat.guard b{color:var(--verdigris)}
  .end-btn{
    margin-left:auto;
    background:var(--rust);color:#FBF3EA;
    padding:9px 20px;border-radius:2px;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;
    box-shadow:0 3px 0 #7A2E20;
  }
  .end-btn:hover{filter:brightness(1.1)}
  .end-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7A2E20}
  .end-btn[disabled]{opacity:.4;cursor:default;box-shadow:none}

  /* ---------- hand ---------- */
  .hand{
    flex:0 0 auto;
    display:flex;justify-content:center;align-items:flex-end;
    gap:clamp(4px,1vw,10px);
    min-height:168px;
    padding-bottom:2px;
  }
  .card{
    width:clamp(96px,12.5vw,124px);
    height:clamp(140px,20vh,166px);
    background:linear-gradient(170deg,#F1ECDD 0%,var(--limewash) 45%,#D6CFBC 100%);
    color:var(--ink);
    border:1px solid #9A927E;
    border-radius:3px;
    padding:8px 8px 7px;
    display:flex;flex-direction:column;
    text-align:left;
    position:relative;
    box-shadow:0 10px 20px rgba(0,0,0,.45);
    transition:transform .14s ease, box-shadow .14s ease, filter .14s ease;
  }
  .card:hover:not(.unaffordable){transform:translateY(-14px);box-shadow:0 18px 28px rgba(0,0,0,.5)}
  .card.selected{transform:translateY(-18px);box-shadow:0 0 0 2px var(--gilt),0 18px 28px rgba(0,0,0,.5)}
  .card.unaffordable{filter:grayscale(.75) brightness(.72);cursor:not-allowed}
  .card .cost{
    position:absolute;top:-8px;left:-8px;
    width:26px;height:26px;border-radius:50%;
    background:var(--verdigris);color:#08211D;
    font-weight:700;font-size:14px;
    display:grid;place-items:center;
    border:1px solid #2E6B60;
  }
  .card .cname{
    font-family:var(--display);font-size:12.5px;line-height:1.15;
    letter-spacing:.02em;margin:12px 0 0;padding-bottom:6px;
    border-bottom:1px solid #B3AB96;
  }
  .card .ctype{
    font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
    color:#6E6857;margin-top:5px;
  }
  .card .ctext{font-size:11px;line-height:1.32;margin-top:auto;color:#2C2E31}
  .card .ctext em{color:var(--rust);font-style:normal;font-weight:700}
  .card .kbd{
    position:absolute;bottom:4px;right:6px;font-size:9px;color:#8B8471;letter-spacing:.1em;
  }

  /* ---------- log ---------- */
  .log{
    position:fixed;right:10px;top:56px;width:min(230px,42vw);
    max-height:38vh;overflow:hidden;
    font-size:10.5px;line-height:1.5;color:var(--limewash-dim);
    text-align:right;pointer-events:none;
    display:flex;flex-direction:column-reverse;gap:1px;
  }
  .log div{opacity:.85}
  .log div:first-child{color:var(--limewash);opacity:1}

  /* ---------- overlay ---------- */
  .veil{
    position:fixed;inset:0;background:rgba(12,15,20,.9);
    display:grid;place-items:center;padding:20px;z-index:20;
    backdrop-filter:blur(3px);
  }
  .veil.hidden{display:none}
  .panel{max-width:760px;width:100%;text-align:center}
  .panel h2{
    font-family:var(--display);font-size:clamp(22px,4.4vw,36px);
    letter-spacing:.24em;text-transform:uppercase;margin:0 0 6px;
  }
  .panel p{color:var(--limewash-dim);font-size:13px;line-height:1.6;margin:0 auto 22px;max-width:52ch}
  .choices{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
  .choices .card{cursor:pointer}
  .primary{
    background:var(--gilt);color:#231C05;font-weight:700;
    padding:11px 26px;border-radius:2px;
    font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    box-shadow:0 3px 0 #8E7217;
  }
  .primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8E7217}
  .rules{text-align:left;max-width:56ch;margin:0 auto 22px;color:var(--limewash-dim);font-size:12.5px;line-height:1.65}
  .rules b{color:var(--limewash)}

  @media (max-width:640px){
    .log{display:none}
    .hand{min-height:150px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 4px 6px}
    .card{flex:0 0 auto}
    .mark{letter-spacing:.2em}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="mark">Siege</h1>
    <span class="wave-label">Wave <b id="waveNum">1</b> of 10</span>
    <div class="header-right">
      <button class="ghost-btn" id="deckBtn">Deck <span id="deckCount">10</span></button>
      <button class="ghost-btn" id="howBtn">How to play</button>
    </div>
  </header>

  <div class="field">
    <div class="attackers" id="attackers"></div>
  </div>

  <div class="rampart" id="rampart">
    <div class="battlement" id="battlement"></div>
    <div class="curtain">
      <span class="wall-name">The Wall</span>
      <span class="wall-num"><span id="wallNow">45</span> / <span id="wallMax">45</span></span>
    </div>
  </div>

  <div class="strip">
    <span class="stat">Supply</span>
    <div class="pips" id="pips"></div>
    <span class="stat guard">Guard <b id="guardNum">0</b></span>
    <span class="stat">Draw <b id="drawNum">0</b> · Spent <b id="discardNum">0</b></span>
    <button class="end-btn" id="endBtn">End turn</button>
  </div>

  <div class="hand" id="hand"></div>
</div>

<div class="log" id="log"></div>

<div class="veil" id="veil">
  <div class="panel" id="panel"></div>
</div>

<script>
"use strict";

/* ============================ card library ============================ */
const CARDS = {
  arrow:   {name:"Arrow Shot",     cost:1, type:"Volley",  target:true,  text:"Deal <em>5</em> damage."},
  barricade:{name:"Barricade",     cost:1, type:"Works",   target:false, text:"Gain <em>5</em> guard."},
  repair:  {name:"Repair Crew",    cost:1, type:"Works",   target:false, text:"Restore <em>4</em> wall."},

  oil:     {name:"Boiling Oil",    cost:2, type:"Volley",  target:false, text:"Deal <em>6</em> to every attacker."},
  ballista:{name:"Ballista Bolt",  cost:2, type:"Engine",  target:true,  text:"Deal <em>12</em> damage."},
  shieldwall:{name:"Shield Wall",  cost:2, type:"Works",   target:false, text:"Gain <em>12</em> guard."},
  muster:  {name:"Muster",         cost:0, type:"Order",   target:false, text:"Draw <em>2</em> cards."},
  quarter: {name:"Quartermaster",  cost:1, type:"Order",   target:false, text:"Gain <em>2</em> supply. Draw 1."},
  pitch:   {name:"Pitch & Fire",   cost:1, type:"Volley",  target:true,  text:"Set alight: <em>4</em> damage at the start of each of your turns."},
  caltrop: {name:"Caltrops",       cost:1, type:"Works",   target:true,  text:"That attacker strikes for <em>3</em> less, for good."},
  masons:  {name:"Masons' Guild",  cost:2, type:"Works",   target:false, text:"Restore <em>10</em> wall."},
  longbow: {name:"Longbowmen",     cost:2, type:"Volley",  target:true,  text:"Deal <em>5</em> damage twice."},
  treb:    {name:"Trebuchet",      cost:3, type:"Engine",  target:false, text:"Deal <em>9</em> to every attacker."},
  sortie:  {name:"Sortie",         cost:1, type:"Order",   target:true,  text:"Deal <em>9</em>. The wall takes 3."},
  sand:    {name:"Hot Sand",       cost:0, type:"Volley",  target:true,  text:"Deal <em>3</em> damage."},
  palisade:{name:"Palisade",       cost:0, type:"Works",   target:false, text:"Gain <em>4</em> guard."},
  watch:   {name:"Watchtower",     cost:1, type:"Works",   target:false, text:"Gain <em>4</em> guard. Draw 1."},
  portcullis:{name:"Portcullis",   cost:2, type:"Works",   target:false, text:"Gain <em>8</em> guard. Guard keeps through the night."},
  horn:    {name:"War Horn",       cost:1, type:"Order",   target:false, text:"Deal <em>3</em> to every attacker. Gain 3 guard."}
};
const REWARD_POOL = ["oil","ballista","shieldwall","muster","quarter","pitch","caltrop","masons",
                     "longbow","treb","sortie","sand","palisade","watch","portcullis","horn"];

/* ============================ enemy library ============================ */
const FOES = {
  raider:   {name:"Raider",       glyph:"⚔",  hp:11, atk:5,  armor:0},
  sapper:   {name:"Sapper",       glyph:"⛏",  hp:8,  atk:4,  armor:0, sap:true},
  shieldman:{name:"Shieldman",    glyph:"🛡", hp:18, atk:5,  armor:2},
  ram:      {name:"Battering Ram",glyph:"🪵", hp:34, atk:11, armor:1, boss:true},
  warlord:  {name:"The Warlord",  glyph:"👑", hp:60, atk:11, armor:1, boss:true, rage:2}
};
const WAVES = [
  ["raider","raider"],
  ["raider","raider","sapper"],
  ["shieldman","sapper","sapper"],
  ["raider","raider","raider","shieldman"],
  ["ram","raider","raider"],
  ["shieldman","shieldman","sapper","sapper"],
  ["raider","raider","raider","raider","shieldman"],
  ["ram","shieldman","shieldman"],
  ["sapper","sapper","sapper","shieldman","shieldman"],
  ["warlord","shieldman","shieldman"]
];

/* ============================ state ============================ */
const MERLONS = 16;
let S = null;
let selected = null;   // index in hand awaiting a target
let busy = false;

const $ = id => document.getElementById(id);

function newGame(){
  S = {
    wave:1, wallMax:45, wall:45, guard:0, keepGuard:false,
    supplyMax:4, supply:4,
    deck:[], hand:[], discard:[],
    foes:[], log:[], over:false
  };
  const start = ["arrow","arrow","arrow","arrow","arrow","barricade","barricade","barricade","barricade","repair"];
  S.deck = shuffle(start.map(mk));
  startWave();
}
let uid = 0;
const mk = key => ({key, uid:++uid});

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

function startWave(){
  const scale = 1 + 0.045*(S.wave-1);
  S.foes = WAVES[S.wave-1].map((k,i)=>{
    const b = FOES[k];
    return {id:"f"+(++uid), key:k, name:b.name, glyph:b.glyph,
            hp:Math.round(b.hp*scale), max:Math.round(b.hp*scale),
            atk:Math.round(b.atk*(1+0.035*(S.wave-1))), armor:b.armor||0,
            sap:!!b.sap, rage:b.rage||0, burn:0, alive:true};
  });
  S.discard = S.discard.concat(S.hand); S.hand = [];
  S.guard = 0; S.keepGuard = false;
  say(`Wave ${S.wave}. ${S.foes.length} at the gate.`);
  startTurn(true);
}

function startTurn(first){
  S.supply = S.supplyMax;
  if(!S.keepGuard) S.guard = 0;
  S.keepGuard = false;
  // fires burn
  S.foes.forEach(f=>{ if(f.alive && f.burn>0){ hurt(f, f.burn, true); say(`${f.name} burns for ${f.burn}.`);} });
  cleanup();
  if(!S.foes.some(f=>f.alive)){ waveCleared(); return; }
  draw(5);
  render();
}

function draw(n){
  for(let i=0;i<n;i++){
    if(!S.deck.length){
      if(!S.discard.length) break;
      S.deck = shuffle(S.discard); S.discard = [];
    }
    S.hand.push(S.deck.pop());
  }
}

function say(t){ S.log.unshift(t); if(S.log.length>14) S.log.pop(); }

/* ============================ combat maths ============================ */
function hurt(f, amount, ignoreArmor){
  const dmg = Math.max(0, ignoreArmor ? amount : amount - f.armor);
  f.hp -= dmg;
  flash(f.id);
  if(f.hp<=0){ f.hp=0; f.alive=false; }
  return dmg;
}
function cleanup(){
  const dead = S.foes.filter(f=>!f.alive && !f.gone);
  dead.forEach(f=>{ f.gone=true; say(`${f.name} falls.`); });
}
function damageWall(n, ignoreGuard){
  let left = n;
  if(!ignoreGuard){
    const absorbed = Math.min(S.guard, left);
    S.guard -= absorbed; left -= absorbed;
  }
  if(left>0){
    S.wall = Math.max(0, S.wall - left);
    const r = $("rampart"); r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake");
  }
  return left;
}

/* ============================ playing cards ============================ */
function playCard(i, foe){
  const c = S.hand[i]; if(!c) return;
  const def = CARDS[c.key];
  if(def.cost > S.supply) return;
  if(def.target && !foe) return;

  S.supply -= def.cost;
  S.hand.splice(i,1); S.discard.push(c);
  selected = null;

  switch(c.key){
    case "arrow":    say(`Arrows find ${foe.name} — ${hurt(foe,5)}.`); break;
    case "sand":     say(`Hot sand — ${hurt(foe,3)}.`); break;
    case "ballista": say(`Bolt strikes ${foe.name} — ${hurt(foe,12)}.`); break;
    case "longbow":  { const a=hurt(foe,5), b=foe.alive?hurt(foe,5):0; say(`Longbowmen loose — ${a+b}.`); break; }
    case "sortie":   say(`Sortie! ${hurt(foe,9)} dealt, 3 taken.`); damageWall(3,true); break;
    case "pitch":    foe.burn += 4; say(`${foe.name} is alight.`); break;
    case "caltrop":  foe.atk = Math.max(0, foe.atk-3); say(`${foe.name} is slowed.`); break;

    case "oil":      S.foes.forEach(f=>f.alive&&hurt(f,6)); say("Oil pours over the parapet."); break;
    case "treb":     S.foes.forEach(f=>f.alive&&hurt(f,9)); say("The trebuchet answers."); break;
    case "horn":     S.foes.forEach(f=>f.alive&&hurt(f,3)); S.guard+=3; say("The horn sounds."); break;

    case "barricade":  S.guard+=5;  say("Guard 5."); break;
    case "palisade":   S.guard+=4;  say("Guard 4."); break;
    case "shieldwall": S.guard+=12; say("Shields locked."); break;
    case "watch":      S.guard+=4;  draw(1); say("Watchtower manned."); break;
    case "portcullis": S.guard+=8;  S.keepGuard=true; say("Portcullis lowered."); break;
    case "repair":     S.wall=Math.min(S.wallMax,S.wall+4); say("Wall repaired."); break;
    case "masons":     S.wall=Math.min(S.wallMax,S.wall+10); say("The masons work fast."); break;
    case "muster":     draw(2); say("Muster."); break;
    case "quarter":    S.supply+=2; draw(1); say("Supplies brought up."); break;
  }
  cleanup();
  render();
  if(!S.foes.some(f=>f.alive)) setTimeout(waveCleared, 450);
}

/* ============================ the enemy turn ============================ */
async function endTurn(){
  if(busy || S.over) return;
  busy = true; selected = null;
  S.discard = S.discard.concat(S.hand); S.hand = [];
  render();

  const living = S.foes.filter(f=>f.alive);
  for(const f of living){
    await wait(360);
    const through = damageWall(f.atk, f.sap);
    say(f.sap ? `${f.name} undermines for ${f.atk}.`
              : `${f.name} strikes for ${f.atk}${through<f.atk?" (guard holds some)":""}.`);
    if(f.rage){ f.atk += f.rage; }
    render();
    if(S.wall<=0){ busy=false; return lose(); }
  }
  await wait(320);
  busy = false;
  startTurn(false);
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

/* ============================ wave end ============================ */
function waveCleared(){
  if(S.over) return;
  if(S.wave >= WAVES.length) return win();
  S.wave++;
  if(S.wave===3||S.wave===7) S.supplyMax++;
  S.wall = Math.min(S.wallMax, S.wall+8);
  offerReward();
}

function offerReward(){
  const pool = shuffle(REWARD_POOL.slice()).slice(0,3);
  const panel = $("panel");
  panel.innerHTML = `
    <h2>The line holds</h2>
    <p>Between assaults, the wall is patched for 8 and word goes out for reinforcements.
       Take one into your deck.</p>
    <div class="choices" id="choices"></div>
    <p style="margin-top:22px"><button class="ghost-btn" id="skipBtn">Take nothing</button></p>`;
  const box = $("choices");
  pool.forEach(k=>{
    const el = cardEl(k, -1);
    el.onclick = ()=>{ S.discard.push(mk(k)); say(`${CARDS[k].name} joins the garrison.`); closeVeil(); startWave(); };
    box.appendChild(el);
  });
  $("skipBtn").onclick = ()=>{ closeVeil(); startWave(); };
  openVeil();
}

function lose(){
  S.over = true;
  $("panel").innerHTML = `
    <h2>The wall is breached</h2>
    <p>You held ${S.wave-1} full ${S.wave-1===1?"wave":"waves"} before the stone gave way on wave ${S.wave}.</p>
    <button class="primary" id="againBtn">Hold it again</button>`;
  $("againBtn").onclick = ()=>{ closeVeil(); newGame(); };
  openVeil(); render();
}
function win(){
  S.over = true;
  $("panel").innerHTML = `
    <h2>The siege lifts</h2>
    <p>Ten waves broken against your wall, with ${S.wall} of ${S.wallMax} still standing.
       The Warlord's banners are pulling back over the ridge.</p>
    <button class="primary" id="againBtn">Play again</button>`;
  $("againBtn").onclick = ()=>{ closeVeil(); newGame(); };
  openVeil(); render();
}

function openVeil(){ $("veil").classList.remove("hidden"); }
function closeVeil(){ $("veil").classList.add("hidden"); }

/* ============================ rendering ============================ */
function cardEl(key, handIndex){
  const d = CARDS[key];
  const el = document.createElement(handIndex>=0 ? "button" : "div");
  el.className = "card";
  const poor = handIndex>=0 && d.cost > S.supply;
  if(poor) el.classList.add("unaffordable");
  if(selected===handIndex && handIndex>=0) el.classList.add("selected");
  el.innerHTML = `
    <span class="cost">${d.cost}</span>
    <span class="cname">${d.name}</span>
    <span class="ctype">${d.type}</span>
    <span class="ctext">${d.text}</span>
    ${handIndex>=0 && handIndex<9 ? `<span class="kbd">${handIndex+1}</span>` : ""}`;
  if(handIndex>=0){
    el.onclick = ()=>{
      if(busy || poor) return;
      if(d.target){ selected = (selected===handIndex) ? null : handIndex; render(); }
      else playCard(handIndex, null);
    };
  }
  return el;
}

function foeEl(f){
  const el = document.createElement("div");
  el.className = "foe";
  el.id = f.id;
  if(!f.alive) el.classList.add("dying");
  const canTarget = selected!==null && f.alive && !busy;
  if(canTarget){ el.classList.add("targetable"); el.tabIndex = 0;
    el.onclick = ()=>playCard(selected, f);
    el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();playCard(selected,f);} };
  }
  el.innerHTML = `
    <span class="intent ${f.sap?"sap":""}">${f.sap?"⛏":"⚔"} ${f.atk}</span>
    <span class="glyph">${f.glyph}</span>
    <span class="fname">${f.name}</span>
    <div class="hpbar"><span style="width:${Math.max(0,f.hp/f.max*100)}%"></span></div>
    <div class="hpnum">${f.hp} / ${f.max}</div>
    <div class="badges">
      ${f.armor?`<span class="badge">armor ${f.armor}</span>`:""}
      ${f.burn?`<span class="badge burn">fire ${f.burn}</span>`:""}
    </div>`;
  return el;
}

function flash(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.remove("hurt"); void el.offsetWidth; el.classList.add("hurt");
}

function render(){
  $("waveNum").textContent = S.wave;
  $("wallNow").textContent = S.wall;
  $("wallMax").textContent = S.wallMax;
  $("guardNum").textContent = S.guard;
  $("drawNum").textContent = S.deck.length;
  $("discardNum").textContent = S.discard.length;
  $("deckCount").textContent = S.deck.length + S.discard.length + S.hand.length;

  // battlement
  const bat = $("battlement");
  const intact = Math.ceil(S.wall / S.wallMax * MERLONS);
  bat.innerHTML = "";
  for(let i=0;i<MERLONS;i++){
    const m = document.createElement("div");
    m.className = "merlon" + (i < intact ? "" : " broken");
    bat.appendChild(m);
  }

  // supply pips
  const pips = $("pips"); pips.innerHTML = "";
  const shown = Math.max(S.supplyMax, S.supply);
  for(let i=0;i<shown;i++){
    const p = document.createElement("div");
    p.className = "pip" + (i < S.supply ? " full" : "");
    pips.appendChild(p);
  }

  // foes
  const box = $("attackers"); box.innerHTML = "";
  S.foes.filter(f=>f.alive).forEach(f=>box.appendChild(foeEl(f)));

  // hand
  const hand = $("hand"); hand.innerHTML = "";
  S.hand.forEach((c,i)=>hand.appendChild(cardEl(c.key,i)));

  $("endBtn").disabled = busy || S.over;

  const log = $("log");
  log.innerHTML = "";
  S.log.forEach(t=>{ const d=document.createElement("div"); d.textContent=t; log.appendChild(d); });
}

/* ============================ chrome ============================ */
$("endBtn").onclick = endTurn;

$("howBtn").onclick = ()=>{
  $("panel").innerHTML = `
    <h2>How to play</h2>
    <div class="rules">
      <p>Ten waves come at your wall. You lose when the wall reaches zero, and win when the tenth wave breaks.</p>
      <p><b>Each turn</b> you refill supply and draw five cards. Spend supply to play cards; anything left in hand is
      spent when you end the turn.</p>
      <p><b>Guard</b> soaks damage for one turn only, then it's gone. Repairs are permanent, so guard is cheaper but
      repairs are what you keep.</p>
      <p><b>Sappers</b> tunnel underneath — guard does nothing against them. <b>Armor</b> subtracts from every
      single hit, so many small arrows are wasted on a Shieldman.</p>
      <p><b>Between waves</b> you patch 8 wall and add one card to your deck. Your deck reshuffles from the spent
      pile when it runs out, so every card you add dilutes the ones you already have. Add carefully.</p>
      <p><b>Keys:</b> 1–9 play a card, Enter ends the turn, Esc cancels a target.</p>
    </div>
    <button class="primary" id="backBtn">Back to the wall</button>`;
  $("backBtn").onclick = ()=>{ closeVeil(); };
  openVeil();
};

$("deckBtn").onclick = ()=>{
  const all = {};
  S.deck.concat(S.discard, S.hand).forEach(c=>{ all[c.key]=(all[c.key]||0)+1; });
  const rows = Object.keys(all).sort((a,b)=>CARDS[a].cost-CARDS[b].cost)
    .map(k=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #2E3742;padding:5px 0">
      <span>${all[k]}× ${CARDS[k].name}</span><span style="color:var(--verdigris)">${CARDS[k].cost}</span></div>`).join("");
  $("panel").innerHTML = `
    <h2>Your garrison</h2>
    <div class="rules" style="max-width:36ch">${rows}</div>
    <button class="primary" id="backBtn">Back to the wall</button>`;
  $("backBtn").onclick = ()=>{ closeVeil(); };
  openVeil();
};

document.addEventListener("keydown", e=>{
  if(!$("veil").classList.contains("hidden")) return;
  if(e.key==="Escape"){ selected=null; render(); return; }
  if(e.key==="Enter"){ endTurn(); return; }
  const n = parseInt(e.key,10);
  if(n>=1 && n<=9){
    const i = n-1;
    const c = S.hand[i]; if(!c || busy) return;
    const d = CARDS[c.key];
    if(d.cost > S.supply) return;
    if(d.target){ selected = (selected===i)?null:i; render(); }
    else playCard(i,null);
  }
});

/* ============================ boot ============================ */
$("panel").innerHTML = `
  <h2>Siege</h2>
  <p>A deck-building defence. Ten waves, one wall, and a hand of cards that gets better and
     more crowded every time you survive.</p>
  <button class="primary" id="startBtn">Take the wall</button>`;
newGame();                                   // build a board behind the title card
$("startBtn").onclick = ()=>{ closeVeil(); newGame(); };
openVeil();
</script>
</body>
