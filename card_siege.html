<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siege — a solitaire for one deck of cards</title>
<style>
  :root{
    --stone-deep:#161B22;
    --stone:#232B36;
    --slate:#39434F;
    --slate-hi:#4E5A69;
    --limewash:#E7E1D1;
    --limewash-dim:#B7B0A0;
    --verdigris:#4FA091;
    --blood:#A8332A;
    --gilt:#C9A227;
    --face:#F7F3E8;
    --ink:#1A1D22;
    --display:"Hoefler Text","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
    --ui:"Trebuchet MS","Lucida Grande",Verdana,sans-serif;
    --gap:clamp(8px,1.5vw,15px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%,#2C3644 0%,var(--stone-deep) 62%),var(--stone-deep);
    color:var(--limewash);font-family:var(--ui);-webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}

  #app{height:100%;display:flex;flex-direction:column;max-width:1060px;margin:0 auto;padding:var(--gap);gap:var(--gap)}

  header{display:flex;align-items:baseline;gap:16px;flex:0 0 auto;flex-wrap:wrap}
  .mark{font-family:var(--display);font-size:clamp(19px,3.1vw,27px);letter-spacing:.34em;text-transform:uppercase;margin:0}
  .counts{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--limewash-dim)}
  .counts b{color:var(--gilt);font-weight:700}
  .header-right{margin-left:auto;display:flex;gap:9px}
  .ghost-btn{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--limewash-dim);
    border:1px solid var(--slate);padding:6px 11px;border-radius:2px}
  .ghost-btn:hover{color:var(--limewash);border-color:var(--slate-hi)}

  /* ---------- playing cards ---------- */
  .pc{
    position:relative;background:var(--face);color:var(--ink);
    border:1px solid #A9A292;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 18px rgba(0,0,0,.42);
    font-family:var(--display);
    transition:transform .13s ease,box-shadow .13s ease,filter .2s ease,opacity .25s ease;
  }
  .pc .corner{position:absolute;font-size:12px;line-height:1;letter-spacing:-.02em;font-weight:600}
  .pc .corner.tl{top:5px;left:6px;text-align:left}
  .pc .corner.br{bottom:5px;right:6px;transform:rotate(180deg)}
  .pc .corner small{display:block;font-size:11px}
  .pc .pip{font-size:clamp(24px,4.6vw,34px);opacity:.92}
  .pc.red{color:var(--blood)}
  .pc.black{color:#22262C}

  /* attackers */
  .siegeline{
    flex:1 1 auto;min-height:0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:center;
    gap:clamp(6px,1.2vw,13px);align-content:flex-end;padding-bottom:2px;
  }
  .foe{width:clamp(62px,8.4vw,80px);height:clamp(88px,12vw,112px)}
  .foe .tag{
    position:absolute;top:-11px;left:50%;transform:translateX(-50%);
    font-family:var(--ui);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
    padding:2px 6px;border-radius:2px;white-space:nowrap;color:#fff;background:#5A6472;
  }
  .foe .tag.engine{background:#7A4A9E}
  .foe.aimable{cursor:crosshair;box-shadow:0 0 0 2px var(--gilt),0 8px 18px rgba(0,0,0,.42)}
  .foe.aimable:hover{transform:translateY(-6px)}
  .foe.weak{opacity:.45;filter:grayscale(.6)}
  .foe.falling{opacity:0;transform:translateY(18px) rotate(6deg)}
  .empty-line{color:var(--limewash-dim);font-size:12px;letter-spacing:.18em;text-transform:uppercase;padding-bottom:26px}

  /* ---------- wall ---------- */
  .rampart{flex:0 0 auto}
  .battlement{display:flex;gap:3px;align-items:flex-end;height:24px}
  .merlon{flex:1 1 0;height:24px;border-radius:1px 1px 0 0;
    background:linear-gradient(180deg,#8E8878 0%,#635E52 100%);transition:height .3s ease,background .3s ease}
  .merlon.broken{height:8px;background:linear-gradient(180deg,#4A4A46 0%,#33332F 100%);
    clip-path:polygon(0 100%,0 42%,22% 66%,44% 22%,68% 62%,88% 30%,100% 74%,100% 100%)}
  .curtain{
    height:clamp(28px,4.4vh,42px);
    background:repeating-linear-gradient(90deg,#5C5749 0 54px,#4B473C 54px 56px),
               repeating-linear-gradient(0deg,#5C5749 0 18px,#443F36 18px 20px);
    border-top:2px solid #6E6857;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
  .wall-name{font-family:var(--display);font-size:11px;letter-spacing:.32em;text-transform:uppercase;
    color:#1E1B15;text-shadow:0 1px 0 rgba(255,255,255,.14)}
  .wall-num{font-weight:700;font-size:15px;color:#1E1B15;text-shadow:0 1px 0 rgba(255,255,255,.14)}
  .rampart.shake{animation:shake .3s ease}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-4px,2px)}
    45%{transform:translate(4px,-2px)}70%{transform:translate(-3px,1px)}}

  /* ---------- strip ---------- */
  .strip{flex:0 0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-height:34px}
  .muster{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--limewash-dim)}
  .muster b{color:var(--verdigris);font-size:17px;letter-spacing:0;font-family:var(--display)}
  .muster.idle b{color:var(--limewash-dim)}
  .hint{font-size:11.5px;color:var(--limewash-dim);letter-spacing:.02em;text-transform:none}
  .end-btn{margin-left:auto;background:var(--blood);color:#FBF3EA;padding:9px 20px;border-radius:2px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;box-shadow:0 3px 0 #71231C}
  .end-btn:hover{filter:brightness(1.1)}
  .end-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #71231C}
  .end-btn[disabled]{opacity:.4;cursor:default;box-shadow:none}

  /* ---------- hand ---------- */
  .hand{flex:0 0 auto;display:flex;justify-content:center;align-items:flex-end;
    gap:clamp(5px,1vw,11px);min-height:clamp(126px,17vh,152px);padding-bottom:2px}
  .hc{width:clamp(74px,9.6vw,92px);height:clamp(104px,14vw,128px);cursor:pointer}
  .hc:hover{transform:translateY(-12px)}
  .hc.chosen{transform:translateY(-16px);box-shadow:0 0 0 2px var(--verdigris),0 16px 26px rgba(0,0,0,.5)}
  .hc .use{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);display:flex;gap:4px;z-index:3}
  .hc .use button{font-family:var(--ui);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--verdigris);color:#062019;padding:4px 7px;border-radius:2px;white-space:nowrap;font-weight:700}
  .hc .use button:hover{filter:brightness(1.12)}
  .hc .role{position:absolute;top:50%;left:50%;transform:translate(-50%,14px);
    font-family:var(--ui);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#8B8471}

  /* ---------- log ---------- */
  .log{position:fixed;right:10px;top:54px;width:min(226px,40vw);max-height:36vh;overflow:hidden;
    font-size:10.5px;line-height:1.5;color:var(--limewash-dim);text-align:right;pointer-events:none;
    display:flex;flex-direction:column-reverse;gap:1px}
  .log div{opacity:.8}
  .log div:first-child{color:var(--limewash);opacity:1}

  /* ---------- overlay ---------- */
  .veil{position:fixed;inset:0;background:rgba(12,15,20,.92);display:grid;place-items:center;
    padding:20px;z-index:20;backdrop-filter:blur(3px);overflow:auto}
  .veil.hidden{display:none}
  .panel{max-width:640px;width:100%;text-align:center}
  .panel h2{font-family:var(--display);font-size:clamp(21px,4.2vw,34px);letter-spacing:.24em;
    text-transform:uppercase;margin:0 0 8px}
  .panel p{color:var(--limewash-dim);font-size:13px;line-height:1.6;margin:0 auto 20px;max-width:50ch}
  .rules{text-align:left;max-width:54ch;margin:0 auto 20px;color:var(--limewash-dim);font-size:12.5px;line-height:1.62}
  .rules p{margin:0 0 9px;max-width:none;text-align:left}
  .rules b{color:var(--limewash)}
  .rules .s{color:var(--blood);font-weight:700}
  .primary{background:var(--gilt);color:#231C05;font-weight:700;padding:11px 26px;border-radius:2px;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 3px 0 #8E7217}
  .primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8E7217}

  @media (max-width:640px){
    .log{display:none}
    .hand{overflow-x:auto;justify-content:flex-start;padding:0 4px 34px}
    .hc{flex:0 0 auto}
    .mark{letter-spacing:.2em}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 class="mark">Siege</h1>
    <span class="counts">Day <b id="turnNum">1</b> · Assault <b id="assaultLeft">26</b> · Garrison <b id="garrisonLeft">21</b></span>
    <div class="header-right">
      <button class="ghost-btn" id="howBtn">How to play</button>
      <button class="ghost-btn" id="newBtn">New siege</button>
    </div>
  </header>

  <div class="siegeline" id="siegeline"></div>

  <div class="rampart" id="rampart">
    <div class="battlement" id="battlement"></div>
    <div class="curtain">
      <span class="wall-name">The Wall</span>
      <span class="wall-num"><span id="wallNow">55</span> / <span id="wallMax">55</span></span>
    </div>
  </div>

  <div class="strip">
    <span class="muster idle" id="muster">Muster <b id="musterNum">0</b></span>
    <span class="hint" id="hint">Tap hearts to muster, then tap an attacker to strike.</span>
    <button class="end-btn" id="endBtn">Let them come</button>
  </div>

  <div class="hand" id="hand"></div>
</div>

<div class="log" id="log"></div>
<div class="veil" id="veil"><div class="panel" id="panel"></div></div>

<script>
"use strict";

const SUITS = {"♠":"black","♣":"black","♥":"red","♦":"red"};
const NAMES = {11:"J",12:"Q",13:"K",14:"A"};
const label = r => NAMES[r] || String(r);
const $ = id => document.getElementById(id);
const MERLONS = 16;
const HAND = 5;

let S = null, chosen = [], busy = false, uid = 0;

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newGame(){
  const black=[], red=[];
  for(const s of Object.keys(SUITS))
    for(let r=2;r<=14;r++)
      (SUITS[s]==="black"?black:red).push({id:"c"+(++uid), suit:s, rank:r});
  S = {
    wallMax:55, wall:55,
    assault:shuffle(black), garrison:shuffle(red), spent:[],
    field:[], hand:[], turn:1, reshuffles:0, log:[], over:false
  };
  chosen = []; busy = false;
  draw(HAND);
  assault();
  say("The banners come over the ridge.");
  render();
}

function draw(n){
  for(let i=0;i<n;i++){
    if(!S.garrison.length){
      if(!S.spent.length) break;
      S.garrison = shuffle(S.spent); S.spent = [];
      const toll = 5 + 4*S.reshuffles;      // each re-forming costs more than the last
      S.reshuffles++;
      S.wall = Math.max(0, S.wall - toll);
      say(`The garrison re-forms. Exhaustion costs ${toll} wall.`);
      shakeWall();
      if(S.wall<=0){ setTimeout(lose,0); return; }
    }
    S.hand.push(S.garrison.pop());
  }
}

function assault(){
  const push = S.assault.length <= 10 ? 3 : 2;   // the final push comes harder
  for(let i=0;i<push && S.assault.length;i++) S.field.push(S.assault.pop());
}

function say(t){ S.log.unshift(t); if(S.log.length>14) S.log.pop(); }
function shakeWall(){ const r=$("rampart"); r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake"); }

/* ---------------- player actions ---------------- */
function toggleChoose(cardId){
  if(busy) return;
  const i = chosen.indexOf(cardId);
  if(i>=0) chosen.splice(i,1); else chosen.push(cardId);
  render();
}
const musterTotal = () => chosen.reduce((n,id)=>{
  const c = S.hand.find(x=>x.id===id); return n + (c?c.rank:0);
},0);

function strike(foe){
  if(busy || !chosen.length) return;
  const total = musterTotal();
  if(total < foe.rank){
    $("hint").textContent = `Muster ${total} won't break ${label(foe.rank)}${foe.suit}. Add another heart.`;
    return;
  }
  chosen.forEach(id=>{
    const k = S.hand.findIndex(x=>x.id===id);
    if(k>=0) S.spent.push(S.hand.splice(k,1)[0]);
  });
  const waste = total - foe.rank;
  foe.dead = true;
  say(`${label(foe.rank)}${foe.suit} cut down by ${total}${waste?` — ${waste} wasted`:" exactly"}.`);
  chosen = [];
  render();
  setTimeout(()=>{ S.field = S.field.filter(f=>!f.dead); render(); checkWin(); }, 260);
}

function spendDiamond(cardId, mode){
  if(busy) return;
  const k = S.hand.findIndex(x=>x.id===cardId);
  if(k<0) return;
  const c = S.hand[k];
  S.spent.push(S.hand.splice(k,1)[0]);
  chosen = chosen.filter(id=>id!==cardId);
  if(mode==="repair"){
    const before = S.wall;
    S.wall = Math.min(S.wallMax, S.wall + c.rank);
    say(`${label(c.rank)}♦ to the masons — wall +${S.wall-before}.`);
  }else{
    draw(2);
    say(`${label(c.rank)}♦ traded for runners — draw 2.`);
  }
  render();
}

/* ---------------- the assault ---------------- */
async function endTurn(){
  if(busy || S.over) return;
  busy = true; chosen = []; render();

  for(const f of S.field.slice()){
    await wait(300);
    S.wall = Math.max(0, S.wall - f.rank);
    say(`${label(f.rank)}${f.suit} strikes for ${f.rank}.`);
    shakeWall();
    if(f.suit==="♣") f.retreat = true;      // infantry strike once and fall back
    render();
    if(S.wall<=0){ busy=false; return lose(); }
  }
  await wait(240);
  S.field = S.field.filter(f=>!f.retreat);   // spades hold their ground
  S.turn++;
  if(S.hand.length < HAND) draw(HAND - S.hand.length);
  assault();
  busy = false;
  render();
  checkWin();
}
const wait = ms => new Promise(r=>setTimeout(r,ms));

function checkWin(){
  if(S.over) return;
  if(!S.assault.length && !S.field.length) win();
}

function lose(){
  if(S.over) return;
  S.over = true; render();
  $("panel").innerHTML = `
    <h2>The wall is breached</h2>
    <p>You held ${S.turn-1} ${S.turn-1===1?"day":"days"} with ${S.assault.length + S.field.length} of the
       26 attackers still unspent. The gate goes at dawn.</p>
    <button class="primary" id="againBtn">Set the watch again</button>`;
  $("againBtn").onclick = ()=>{ closeVeil(); newGame(); };
  openVeil();
}
function win(){
  if(S.over) return;
  S.over = true; render();
  const grade = S.wall >= 40 ? "Barely a scratch on the stone."
              : S.wall >= 20 ? "Costly, but the banners are pulling back."
              : "Held by a hand's breadth.";
  $("panel").innerHTML = `
    <h2>The siege lifts</h2>
    <p>All 26 attackers spent in ${S.turn} days, with ${S.wall} of ${S.wallMax} wall standing. ${grade}</p>
    <button class="primary" id="againBtn">Play again</button>`;
  $("againBtn").onclick = ()=>{ closeVeil(); newGame(); };
  openVeil();
}
function openVeil(){ $("veil").classList.remove("hidden"); }
function closeVeil(){ $("veil").classList.add("hidden"); }

/* ---------------- rendering ---------------- */
function faceEl(card, cls){
  const el = document.createElement("div");
  el.className = `pc ${SUITS[card.suit]} ${cls}`;
  el.dataset.rank = card.rank;
  el.dataset.suit = card.suit;
  el.innerHTML =
    `<span class="corner tl">${label(card.rank)}<small>${card.suit}</small></span>` +
    `<span class="pip">${card.suit}</span>` +
    `<span class="corner br">${label(card.rank)}<small>${card.suit}</small></span>`;
  el.setAttribute("aria-label", `${label(card.rank)} of ${card.suit}`);
  return el;
}

function render(){
  $("turnNum").textContent = S.turn;
  $("assaultLeft").textContent = S.assault.length + S.field.length;
  $("garrisonLeft").textContent = S.garrison.length + S.spent.length + S.hand.length;
  $("wallNow").textContent = S.wall;
  $("wallMax").textContent = S.wallMax;

  const bat = $("battlement"); bat.innerHTML = "";
  const intact = Math.ceil(S.wall / S.wallMax * MERLONS);
  for(let i=0;i<MERLONS;i++){
    const m = document.createElement("div");
    m.className = "merlon" + (i<intact ? "" : " broken");
    bat.appendChild(m);
  }

  const total = musterTotal();
  const mu = $("muster");
  mu.className = "muster" + (total ? "" : " idle");
  $("musterNum").textContent = total;

  // attackers
  const line = $("siegeline"); line.innerHTML = "";
  if(!S.field.length){
    const e = document.createElement("div");
    e.className = "empty-line";
    e.textContent = S.assault.length ? "The field is clear — for now" : "No one left out there";
    line.appendChild(e);
  }
  S.field.forEach(f=>{
    const el = faceEl(f, "foe");
    if(f.dead) el.classList.add("falling");
    const engine = f.suit==="♠";
    const tag = document.createElement("span");
    tag.className = "tag" + (engine ? " engine" : "");
    tag.textContent = engine ? "Engine" : "Infantry";
    el.appendChild(tag);
    if(total>0 && !busy && !f.dead){
      if(total >= f.rank){
        el.classList.add("aimable");
        el.tabIndex = 0;
        el.onclick = ()=>strike(f);
        el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();strike(f);} };
      } else {
        el.classList.add("weak");
      }
    }
    line.appendChild(el);
  });

  // hand
  const hand = $("hand"); hand.innerHTML = "";
  S.hand.sort((a,b)=> a.suit===b.suit ? a.rank-b.rank : (a.suit==="♥"?-1:1));
  S.hand.forEach(c=>{
    const el = faceEl(c, "hc");
    const role = document.createElement("span");
    role.className = "role";
    role.textContent = c.suit==="♥" ? "Soldiers" : "Supplies";
    el.appendChild(role);
    if(c.suit==="♥"){
      if(chosen.includes(c.id)) el.classList.add("chosen");
      el.onclick = ()=>toggleChoose(c.id);
      el.tabIndex = 0;
      el.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleChoose(c.id);} };
    }else{
      const use = document.createElement("span");
      use.className = "use";
      const b1 = document.createElement("button");
      b1.textContent = `Repair ${c.rank}`;
      b1.onclick = e=>{ e.stopPropagation(); spendDiamond(c.id,"repair"); };
      const b2 = document.createElement("button");
      b2.textContent = "Draw 2";
      b2.onclick = e=>{ e.stopPropagation(); spendDiamond(c.id,"draw"); };
      use.append(b1,b2);
      el.appendChild(use);
    }
    hand.appendChild(el);
  });

  $("endBtn").disabled = busy || S.over;
  if(!busy){
    $("hint").textContent = total
      ? `Muster ${total} — strike anything ranked ${total} or lower.`
      : "Tap hearts to muster, then tap an attacker to strike.";
  }

  const log = $("log"); log.innerHTML = "";
  S.log.forEach(t=>{ const d=document.createElement("div"); d.textContent=t; log.appendChild(d); });
}

/* ---------------- chrome ---------------- */
$("endBtn").onclick = endTurn;
$("newBtn").onclick = ()=>{ closeVeil(); newGame(); };
$("howBtn").onclick = ()=>{
  $("panel").innerHTML = `
    <h2>How to play</h2>
    <div class="rules">
      <p>One standard deck, split by colour. The <b>26 black cards</b> are the besieging army. The
      <b>26 red cards</b> are your garrison. Aces are high — <b>A = 14</b>, K 13, Q 12, J 11.</p>
      <p><b>Each day</b> two black cards march up to the wall (three once the army is running low).
      You hold five red cards.</p>
      <p><span class="s">♥ Hearts are soldiers.</span> Tap them to muster; their ranks add together.
      Then tap an attacker whose rank your muster meets or beats, and it is cut down. Anything over
      its rank is wasted, so the game is really about spending your hearts exactly.</p>
      <p><span class="s">♦ Diamonds are supplies.</span> Spend one to repair the wall by its rank, or
      trade it for two fresh cards. Never both.</p>
      <p><b>Then they strike.</b> Every attacker still standing takes its rank off your wall.
      <b>♣ Clubs</b> are infantry: they hit once and fall back. <b>♠ Spades</b> are siege engines:
      they hold their ground and hit again every single day until you kill them. Ignore a spade at
      your peril, and ignore a club on purpose.</p>
      <p><b>Running dry.</b> When the garrison pile is empty it re-forms from your spent cards, and
      that exhaustion costs wall — 5 the first time, then 9, then 13. Drawing hard is not free.</p>
      <p><b>You win</b> by clearing all 26 attackers. <b>You lose</b> if the wall reaches zero.
      Hearts total 104 and the army totals 208 — you were never going to kill all of them, so choose
      what to let through.</p>
    </div>
    <button class="primary" id="backBtn">Back to the wall</button>`;
  $("backBtn").onclick = closeVeil;
  openVeil();
};

document.addEventListener("keydown", e=>{
  if(!$("veil").classList.contains("hidden")) return;
  if(e.key==="Escape"){ chosen=[]; render(); }
  if(e.key==="Enter" && e.target===document.body) endTurn();
});
